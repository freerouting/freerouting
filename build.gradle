tasks.withType(Test).configureEach { Test task ->
    // Keep the established parallelism for independent tests. Tests tagged "serial" run through
    // the dedicated testSerial task below because they start embedded servers or use substantial
    // routing resources.
    maxParallelForks = task.name == 'testSerial'
        ? 1
        : (task.name == 'testSlow'
            ? Math.min(2, Math.max(1, Runtime.runtime.availableProcessors().intdiv(4)))
            : (Runtime.runtime.availableProcessors().intdiv(2) ?: 1))

    // Absolute fixtures path so forked workers find DSN files even when user.dir is not the repo root.
    systemProperty 'freerouting.test.fixtures.dir', layout.projectDirectory.dir('fixtures').asFile.absolutePath

    testLogging {
        showExceptions = true
        showStandardStreams = true
    }

    timeout = Duration.ofMinutes(30)

    // Attach Mockito as a Java agent so that the inline-mock-maker can function
    // on Java 21+ without the JVM's self-attach restriction warning.
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"

    // Default logging configuration for test runs:
    //   - No log file is written (file logging is disabled).
    //   - Console output is restricted to INFO level and above (ERROR, WARN, INFO).
    // Individual tests may override freerouting.logging.* system properties
    // before the Log4j2 context is initialised if finer-grained output is needed.
    systemProperty 'freerouting.logging.file.enabled', 'false'
    systemProperty 'freerouting.logging.console.enabled', 'true'
    systemProperty 'freerouting.logging.console.level', 'INFO'

    // Gradle 9.3+ writes transient binary results (in-progress-results-generic.bin).
    // Leftover files from an interrupted run can make the :test task fail with
    // NoSuchFileException even when the tests themselves would pass.
    doFirst {
        def binaryDir = binaryResultsDirectory.get().asFile
        if (binaryDir.exists()) {
            binaryDir.deleteDir()
        }
    }

    def failedTests = []

    // Prefer addTestListener over deprecated afterTest/afterSuite(Closure) (removed in Gradle 10).
    addTestListener(new TestListener() {
        @Override
        void afterTest(TestDescriptor descriptor, TestResult result) {
            if (result.resultType == TestResult.ResultType.FAILURE) {
                failedTests << descriptor
            }
        }

        @Override
        void afterSuite(TestDescriptor desc, TestResult result) {
            if (!desc.parent && !failedTests.isEmpty()) {
                def out = System.out
                out.println()
                out.println("Failed tests (${failedTests.size()}):")
                failedTests.each { descriptor ->
                    out.println("  ${descriptor.className} > ${descriptor.displayName}")
                }
            }
        }
    })
}

test {
    useJUnitPlatform {
        excludeTags 'serial'
        // GUI/accessibility tests run via the dedicated testGui task (D5/D25).
        excludeTags 'gui'
        // Daily runs skip slow tests unless explicitly requested.
        if (!includeSlowTests.get()) {
            excludeTags 'slow'
        }
    }
}

tasks.register('testSlow', Test) {
    group = 'verification'
    description = 'Runs tests tagged with @Tag("slow").'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter(tasks.named('test'))
    useJUnitPlatform {
        includeTags 'slow'
    }
}

tasks.register('testSerial', Test) {
    group = 'verification'
    description = 'Runs tests tagged with @Tag("serial") sequentially.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    mustRunAfter(tasks.named('test'))
    useJUnitPlatform {
        includeTags 'serial'
    }
}

tasks.register('testGui', Test) {
    group = 'verification'
    description = 'Runs GUI/accessibility tests tagged with @Tag("gui"); component-only, forced headless (D5/D7/D25).'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    mustRunAfter(tasks.named('testSerial'))
    // Component-only a11y tests must not require a display (D7).
    systemProperty 'java.awt.headless', 'true'
    useJUnitPlatform {
        includeTags 'gui'
    }
}

tasks.named('check') {
    dependsOn(tasks.named('testSerial'))
}

tasks.register('testAll') {
    group = 'verification'
    description = 'Runs default, serial-sensitive, slow, and GUI tests.'
    dependsOn(tasks.named('test'), tasks.named('testSlow'), tasks.named('testSerial'), tasks.named('testGui'))
}

tasks.named('testSlow') {
    mustRunAfter(tasks.named('test'))
}

tasks.named('testSerial') {
    mustRunAfter(tasks.named('testSlow'))
}

rewrite {
    // Fail fast on misspelled / nonexistent recipe names instead of silently skipping them.
    failOnInvalidActiveRecipes = true

    // Protect the v1.9 reference implementation (src_v19 source set) — it must stay unmodified.
    exclusion("src_v19/**")
    exclusion("**/src_v19/**")
    exclusion("**/geometry/**")
    exclusion("**/board/**")
    exclusion("**/drc/**")
    exclusion("**/autoroute/**")
    exclusion("**/management/**")
    exclusion("**/io/**")
    exclusion("**/interactive/**")
    exclusion("**/gui/**")


tasks.register('phase2GenerateFieldMap', Exec) {
    group = 'rewrite'
    description = 'Generate field rename map before running rewriteRun'
    def pkgs = System.getProperty('rewrite.targetPackages', '')
    if (pkgs) {
        def pkgList = pkgs.split(',').collect { it.trim() }
        commandLine 'powershell', '-NoProfile', '-File', 'scripts/rewrite/generate-field-rename-map.ps1', '-TargetPackages', pkgList.join(',')
    } else {
        commandLine 'powershell', '-NoProfile', '-File', 'scripts/rewrite/generate-field-rename-map.ps1'
    }
}

tasks.register('phase2FieldReferenceRenames', Exec) {
    group = 'rewrite'
    description = 'Apply cross-file field reference renames from build/field-renames.tsv'
    def pkgs = System.getProperty('rewrite.targetPackages', '')
    if (pkgs) {
        def pkgList = pkgs.split(',').collect { it.trim() }
        commandLine 'powershell', '-NoProfile', '-File', 'scripts/rewrite/apply-field-reference-renames.ps1', '-TargetPackages', pkgList.join(',')
    } else {
        commandLine 'powershell', '-NoProfile', '-File', 'scripts/rewrite/apply-field-reference-renames.ps1'
    }
}

tasks.register('phase2aFieldsPost') {
    group = 'rewrite'
    description = 'Post-steps after Phase2aFields: field reference fallback + spotlessApply'
    dependsOn(tasks.named('phase2FieldReferenceRenames'), tasks.named('spotlessApply'))
}

tasks.register('phase2fPost') {
    group = 'rewrite'
    description = 'Post-steps after Phase2fLocalVariables: spotlessApply only'
    dependsOn(tasks.named('spotlessApply'))
}

tasks.register('phase2Naming') {
    group = 'rewrite'
    description = 'Phase 2 post-steps: field reference fallback + spotlessApply (run rewriteRun first)'
    dependsOn(tasks.named('phase2FieldReferenceRenames'), tasks.named('spotlessApply'))
}

tasks.named('spotlessApply').configure { mustRunAfter(tasks.named('phase2FieldReferenceRenames')) }

['rewriteRun', 'rewriteDryRun', 'rewriteDiscover'].each { taskName ->
    tasks.matching { it.name == taskName }.configureEach {
        dependsOn(tasks.named('compileRewriteRecipesJava'))
    }
}


