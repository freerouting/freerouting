import java.time.Duration
import org.gradle.api.tasks.testing.TestResult

plugins {
    id 'java'
    id 'jvm-test-suite'
    id 'signing'
    id 'maven-publish'
    id 'checkstyle'
    id "com.vanniktech.maven.publish" version "0.37.0"
    id 'io.github.ben-manes.versions' version '0.60.0'
    id 'org.openrewrite.rewrite' version '7.39.0'
    id "com.diffplug.spotless" version "8.9.0"
}

checkstyle {
    toolVersion = '13.9.0'
    configFile = file('config/checkstyle/google_checks.xml')
    configProperties = [
            'org.checkstyle.google.suppressionfilter.config':
                    file('config/checkstyle/checkstyle-suppressions.xml').absolutePath
    ]
    ignoreFailures = false
}


java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(25)
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

sourceSets {
    rewriteRecipes {
        java {
            srcDirs = ['src/rewrite/java']
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}

// javadoc is required for Maven Central publishing but too strict for a non-library project.
// addStringOption(option, value) emits "-option value" — passing '-quiet' as the value of
// -Xdoclint:none is wrong and silently fails to suppress warnings.
// Use addBooleanOption so -Xdoclint:none is emitted as a standalone flag, and
// call options.quiet() separately to set -quiet.
tasks.withType(Javadoc).configureEach {
    options.addStringOption 'encoding', 'UTF-8'
    options.addBooleanOption 'Xdoclint:none', true
    options.quiet()
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }

        integrationTest(JvmTestSuite) {
            dependencies {
                implementation project()
            }

            targets {
                all {
                    testTask.configure {
                        shouldRunAfter(test)
                        systemProperty 'freerouting.logging.file.enabled', 'false'
                        systemProperty 'freerouting.logging.console.enabled', 'true'
                        systemProperty 'freerouting.logging.console.level', 'INFO'
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn(testing.suites.integrationTest, tasks.named('spotlessCheck'))
}

spotless {
    lineEndings = 'UNIX'
    java {
        // Explicit targets: main + test only. Excludes src_v19 (reference baseline) and
        // build/generated-src (VersionInfo.java regenerated on every build).
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        removeUnusedImports()
        // 1.28.0+ required for Java 25 (see diffplug/spotless#2468).
        googleJavaFormat('1.28.0').reorderImports(true)
    }
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        def current = it.currentVersion
        def candidate = it.candidate.version

        // 1. Skip non-stable versions (optional but recommended)
        def isNonStable = { String version ->
            def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { version.toUpperCase().contains(it) }
            def regex = /^[0-9,.v-]+(-r)?$/
            return !stableKeyword && !(version =~ regex)
        }

        if (isNonStable(candidate) && !isNonStable(current)) {
            return true
        }

        // 2. Reject if the Major version is different
        def currentMajor = current.tokenize('.')[0]
        def candidateMajor = candidate.tokenize('.')[0]

        return currentMajor != candidateMajor
    }
}

// Mockito agent configuration — must be declared before the dependencies block.
// Required for inline-mock-maker on Java 21+ (Mockito docs section 0.3):
// https://javadoc.io/doc/org.mockito/mockito-core/latest/org.mockito/org/mockito/Mockito.html#0.3
configurations {
    mockitoAgent
}

repositories {
    flatDir {
        dirs 'libs'
    }

    mavenCentral()
    // Adding mirror repositories
    maven {
        name = 'MirrorRepo1'
        url = 'https://repo1.maven.org/maven2' // Replace with actual mirror URL
    }

    google()
}

