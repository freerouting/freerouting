
#
# plugin settings
#

#
# java invocation
[java]

# name of java executable
path = java

# freerouting invocation
[module]

input_ext  = dsn
output_ext = ses
rules_ext = rules

#
# jar artifact descriptor
[artifact]

# jar downloaded from:
# https://github.com/freerouting/freerouting
location = jar/freerouting-2.4.1.jar

#
# plugin runtime settings
[settings]

# When true, opens Freerouting's interactive GUI window.
# When false, runs headlessly in the background with progress shown in KiCad.
gui = true
