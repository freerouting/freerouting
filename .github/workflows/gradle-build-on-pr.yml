name: 'CI: Pull Request Build & Test'

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Execute Gradle build & tests
        run: ./gradlew build

  i18n-context-check:
    name: Verify i18n Context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify i18n context is up to date
        run: python scripts/i18n/extract-context.py --check

  kicad-plugin-test:
    name: Verify KiCad Plugin & IPC Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run KiCad Plugin Fallback Tests
        run: python integrations/KiCad/tests/test_plugin_fallback.py
      - name: Run KiCad IPC Mock CI Tests
        run: python integrations/KiCad/tests/test_ipc_mock_ci.py
      - name: Verify KiCad PCM Package Conformance
        run: python scripts/kicad/validate_pcm_package.py
