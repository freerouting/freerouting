name: 'Docker: Publish Nightly Image'

on:
  schedule:
    - cron: '17 2 * * *' # Daily at 02:17 UTC
  workflow_dispatch: # Allows you to run this workflow manually

concurrency:
  group: docker-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if new commits exist since last nightly image
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python3 scripts/build/cleanup-ghcr-images.py \
            --owner "${{ github.repository_owner }}" \
            --package "${{ github.event.repository.name }}" \
            --image "${{ env.IMAGE_NAME }}" \
            --check-revision "${{ github.sha }}" \
            --tag nightly

      - name: Set up JDK
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        run: chmod +x gradlew

      - name: Run tests on native runner
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        run: ./gradlew test

      - name: Set up QEMU
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly

      - name: Build and push Docker image
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            BUILD_REVISION=${{ github.sha }}

      - name: Delete unused nightly Docker images
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python3 scripts/build/cleanup-ghcr-images.py \
            --owner "${{ github.repository_owner }}" \
            --package "${{ github.event.repository.name }}" \
            --image "${{ env.IMAGE_NAME }}"
