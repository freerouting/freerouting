name: 'Distribution: Release Packages'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows you to run this workflow manually

jobs:
  test:
    name: 'Test & Verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Run Tests
        run: ./gradlew build

  build-jar:
    name: 'Build JAR'
    needs: test
    runs-on: [ ubuntu-latest ]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Grant execute permission for build scripts
        run: chmod +x scripts/build/*.sh
      - name: Build with Gradle
        run: ./gradlew dist
      - name: Get Tag name
        id: tagName
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "Error: Release workflow must be run on a version tag (e.g. v2.5.0), but got ref '${GITHUB_REF_NAME}' (${GITHUB_REF_TYPE})." >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create Distribution
        run: scripts/build/create-distribution-jar.sh ${{ steps.tagName.outputs.tag }}
      - uses: AButler/upload-release-assets@v4.0
        with:
          files: './scripts/build/freerouting-${{ steps.tagName.outputs.tag }}.jar'
          release-tag: v${{ steps.tagName.outputs.tag }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu-x64:
    needs: test
    runs-on: [ ubuntu-latest ]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Grant execute permission for build scripts
        run: chmod +x scripts/build/*.sh
      - name: Build with Gradle
        run: ./gradlew dist
      - name: Get Tag name
        id: tagName
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "Error: Release workflow must be run on a version tag (e.g. v2.5.0), but got ref '${GITHUB_REF_NAME}' (${GITHUB_REF_TYPE})." >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create Distribution
        run: scripts/build/create-distribution-linux-x64.sh ${{ steps.tagName.outputs.tag }}
      - uses: AButler/upload-release-assets@v4.0
        with:
          files: './scripts/build/freerouting-${{ steps.tagName.outputs.tag }}-linux-x64.zip'
          release-tag: v${{ steps.tagName.outputs.tag }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build-windows-x64:
    needs: test
    runs-on: [ windows-latest ]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
      - name: Build with Gradle
        run: .\gradlew.bat dist --no-daemon
      - name: Get Tag name
        id: tagName
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "Error: Release workflow must be run on a version tag (e.g. v2.5.0), but got ref '${GITHUB_REF_NAME}' (${GITHUB_REF_TYPE})." >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create Distribution
        run: .\scripts\build\create-distribution-windows-x64.bat ${{ steps.tagName.outputs.tag }}
      - uses: AButler/upload-release-assets@v4.0
        with:
          files: './scripts/build/freerouting-${{ steps.tagName.outputs.tag }}-windows-x64.msi'
          release-tag: v${{ steps.tagName.outputs.tag }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    needs: test
    runs-on: [ macos-15 ]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Grant execute permission for build scripts
        run: chmod +x scripts/build/*.sh
      - name: Build with Gradle
        run: ./gradlew dist
      - name: Get Tag name
        id: tagName
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "Error: Release workflow must be run on a version tag (e.g. v2.5.0), but got ref '${GITHUB_REF_NAME}' (${GITHUB_REF_TYPE})." >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create Distribution
        run: scripts/build/create-distribution-macos-arm64.sh ${{ steps.tagName.outputs.tag }}
      - uses: AButler/upload-release-assets@v4.0
        with:
          files: './scripts/build/freerouting-${{ steps.tagName.outputs.tag }}-macos-arm64.dmg'
          release-tag: v${{ steps.tagName.outputs.tag }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-x64:
    needs: test
    runs-on: [ macos-15-intel ]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: 'x64'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/help/legal-terms-of-use'
          build-scan-terms-of-use-agree: 'yes'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Grant execute permission for build scripts
        run: chmod +x scripts/build/*.sh
      - name: Build with Gradle
        run: ./gradlew dist
      - name: Get Tag name
        id: tagName
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "Error: Release workflow must be run on a version tag (e.g. v2.5.0), but got ref '${GITHUB_REF_NAME}' (${GITHUB_REF_TYPE})." >&2
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create Distribution
        run: scripts/build/create-distribution-macos-x64.sh ${{ steps.tagName.outputs.tag }}
      - uses: AButler/upload-release-assets@v4.0
        with:
          files: './scripts/build/freerouting-${{ steps.tagName.outputs.tag }}-macos-x64.dmg'
          release-tag: v${{ steps.tagName.outputs.tag }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
