name: Daily API Key Usage Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not update Google Sheets)'
        required: false
        type: boolean
        default: false

jobs:
  sync-usage:
    name: Sync BigQuery Usage to Google Sheets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/stats/requirements.txt

      - name: Run Sync Script
        env:
          FREEROUTING__USAGE_AND_DIAGNOSTIC_DATA__BIGQUERY_SERVICE_ACCOUNT_KEY: ${{ secrets.FREEROUTING_BIGQUERY_SERVICE_ACCOUNT_KEY }}
          FREEROUTING__API_SERVER__AUTHENTICATION__GOOGLE_SHEETS__SHEET_URL: ${{ secrets.FREEROUTING__API_SERVER__AUTHENTICATION__GOOGLE_SHEETS__SHEET_URL }}
          FREEROUTING__API_SERVER__AUTHENTICATION__GOOGLE_SHEETS__GOOGLE_API_KEY: ${{ secrets.FREEROUTING__API_SERVER__AUTHENTICATION__GOOGLE_SHEETS__GOOGLE_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python scripts/stats/sync_api_key_usage_to_sheets.py $EXTRA_ARGS
