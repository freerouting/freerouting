name: Daily API Key Usage Sync

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not update Google Sheets)'
        required: false
        type: boolean
        default: false

jobs:
  sync-usage:
    name: Sync BigQuery Usage to Google Sheets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/stats/requirements.txt

      - name: Run Sync Script
        env:
          FREEROUTING__USAGE_AND_DIAGNOSTIC_DATA__BIGQUERY_SERVICE_ACCOUNT_KEY: ${{ secrets.FREEROUTING_BIGQUERY_SERVICE_ACCOUNT_KEY }}
          FREEROUTING_API_KEY_SPREADSHEET_ID: ${{ secrets.FREEROUTING_API_KEY_SPREADSHEET_ID }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python scripts/stats/sync_api_key_usage_to_sheets.py $EXTRA_ARGS
