name: 'Triage: Gemini Community Feedback'

on:
  pull_request_target:
    types: [closed]
  issues:
    types: [closed]

jobs:
  feedback:
    # Only run for merged pull requests or closed issues
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issues' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Fetch previous commit so we can verify integrity against the pre-merge base
          fetch-depth: 2
          persist-credentials: false

      - name: Verify script integrity against merged changes
        id: integrity-check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # If the PR modified community-feedback.py or its workflow, skip execution
            # to guarantee that untrusted code cannot execute with write tokens and secrets.
            if git diff --name-only HEAD^1 HEAD | grep -qE '^(\.github/workflows/community-feedback\.yml|scripts/triage/community-feedback\.py)'; then
              echo "PR modified feedback automation scripts; skipping automated run to ensure security."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Restore the trusted copy of the script from the base commit prior to the merge
            git checkout HEAD^1 -- scripts/triage/community-feedback.py 2>/dev/null || true
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.integrity-check.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run community feedback
        if: steps.integrity-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python scripts/triage/community-feedback.py
