default_language_version:
  python: python3

exclude: |
  (?x)^(
    \..*/|
    src_v19/|
    fixtures/|
    integrations/|
    examples/|
    docs/reference/|
    src/main/resources/app/freerouting/helpset/|
    build/|
    out/|
    bin/|
    tmp/|
    logs/|
    assets/|
    scripts/benchmark/logs/|
    scripts/benchmark/outputs/|
    scripts/benchmark/results/|
    scripts/i18n/__pycache__/|
    .*\.step$|
    .*\.stp$|
    .*\.dsn$|
    .*\.ses$|
    .*\.rules$|
    .*\.par$|
    .*\.PLD$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        types_or: [java, markdown, yaml, python, shell, powershell, properties]
      - id: end-of-file-fixer
        types_or: [java, markdown, yaml, python, shell, powershell, properties]
      - id: check-json
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-toml
      - id: mixed-line-ending
        exclude: \.(bat|cmd|ps1)$
        args: ['--fix=lf']

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: spotless-check
        name: Spotless Check
        entry: ./gradlew spotlessCheck
        language: system
        files: \.(java|groovy|gradle)$
        pass_filenames: false
