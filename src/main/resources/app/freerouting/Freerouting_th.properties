command_line_help=การใช้งาน\n\nfreerouting [พารามิเตอร์]\n\nพารามิเตอร์\n\n-de <design.dsn>\nโหลดไฟล์ Specctra .dsn\n\n-di <design_directory>\nตั้งค่าโฟลเดอร์เริ่มต้นที่ใช้โดยไดอะล็อกเปิดไฟล์การออกแบบ\n\n-dr <design_rules_file>\nอ่านกฎการเดินสายจากไฟล์ .rules\n\n-do <output_file>\nบันทึกบอร์ด (.dsn), เซสชัน (.ses) หรือ\nสคริปต์ Autodesk Fusion (.scr) ในตอนท้าย\n\n-mp <number_of_passes>\nตั้งค่าจำนวนรอบสูงสุดของการเดินสายอัตโนมัติที่ต้องทำงาน\n\n-l <language>\n"en" สำหรับภาษาอังกฤษ, "de" สำหรับภาษาเยอรมัน หรือ "zh" สำหรับภาษาจีนตัวย่อ มิฉะนั้นจะใช้ค่าเริ่มต้นของระบบ ภาษาอังกฤษจะถูกใช้เป็นค่าเริ่มต้นสำหรับภาษาที่ไม่รองรับ\n\n-mt <number_of_threads>\nกำหนดขนาด thread-pool สำหรับการเพิ่มประสิทธิภาพการเดินสาย ค่าเริ่มต้นคือ\nน้อยกว่าจำนวนประมวลผลเชิงตรรกะในระบบอยู่หนึ่งตัว\n\n-is <selection_strategy>\nSequential (ตามลำดับ) หรือ prioritized (ตามลำดับความสำคัญ) กำหนดกลยุทธ์การเลือกรายการสำหรับ\nการเพิ่มประสิทธิภาพการเดินสาย ค่าเริ่มต้นคือตามลำดับ (sequential)\n\n-h แสดงคำอธิบายความช่วยเหลือนี้
