command_line_help=วิธีใช้งาน\n\nfreerouting [พารามิเตอร์]\n\nพารามิเตอร์\n\n-de <design.dsn>\nโหลดไฟล์ Specctra .dsn\n\n-di <design_directory>\nกำหนดโฟลเดอร์เริ่มต้นที่ใช้โดยไดอะล็อกเปิดงานออกแบบ\n\n-dr <design_rules_file>\nอ่านกฎการเดินสายจากไฟล์ .rules\n\n-do <output_file>\nบันทึกบอร์ด (.dsn), เซสชัน (.ses), หรือ\nสคริปต์ Autodesk Fusion (.scr) ที่ส่วนท้าย\n\n-mp <number_of_passes>\nกำหนดจำนวนรอบสูงสุดของการเดินสายอัตโนมัติที่จะดำเนินการ\n\n-l <ภาษา>\nen" สำหรับภาษาอังกฤษ, "de" สำหรับภาษาเยอรมัน หรือ "zh" สำหรับภาษาจีนตัวย่อ มิฉะนั้นจะใช้ค่าเริ่มต้นของระบบ ภาษาอังกฤษจะถูกใช้เป็นค่าเริ่มต้นสำหรับภาษาที่ยังไม่รองรับ\n\n-mt <number_of_threads>\nกำหนดขนาด thread-pool สำหรับการเพิ่มประสิทธิภาพเส้นทาง ค่าเริ่มต้นคือ\nน้อยกว่าจำนวนโปรเซสเซอร์เชิงตรรกะในระบบอยู่หนึ่งตัว\n\n-us <updating_strategy>\nGreedy, Global หรือ Hybrid ตั้งค่ากลยุทธ์การอัปเดตบอร์ดสำหรับการเดินสาย\noptimization. The default is greedy. When Hybrid is selected,\nใช้ตัวเลือก "hr" เพื่อระบุอัตราส่วนไฮบริด\n\n-hr <m\:n>\nกำหนดอัตราส่วนไฮบริดในรูปแบบของ\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nค่าเริ่มต้นคือ 1\:1 ตัวเลือกนี้จะมีผลเฉพาะเมื่อ\nเลือกกลยุทธ์แบบผสม (Hybrid)\n\n-is <selection_strategy>\nตามลำดับ สุ่ม หรือเรียงตามลำดับความสำคัญ กำหนดกลยุทธ์การเลือกรายการ\nสำหรับการปรับประสิทธิภาพเส้นทองแดง ค่าเริ่มต้นคือ prioritized ซึ่งจะเลือก\nรายการตามคะแนนที่คำนวณได้ระหว่างรอบก่อนหน้า\n\n-h แสดงคำอธิบายความช่วยเหลือนี้
