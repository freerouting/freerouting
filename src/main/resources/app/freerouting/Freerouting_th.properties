command_line_help=การใช้งาน\n\nfreerouting [พารามิเตอร์]\n\nพารามิเตอร์\n\n-de <design.dsn>\nโหลดไฟล์ Specctra .dsn\n\n-di <design_directory>\nกำหนดโฟลเดอร์เริ่มต้นสำหรับไดอะล็อกเปิดการออกแบบ\n\n-dr <design_rules_file>\nอ่านกฎการเดินสายจากไฟล์ .rules\n\n-do <output_file>\nบันทึกบอร์ด (.dsn), เซสชัน (.ses) หรือ\nสคริปต์เซสชัน Eagle (.scr) ในตอนท้าย\n\n-mp <number_of_passes>\nกำหนดขีดจำกัดสูงสุดของจำนวนรอบการเดินสายอัตโนมัติ\nที่จะดำเนินการ\n\n-l <language>\nen" สำหรับภาษาอังกฤษ, "de" สำหรับภาษาเยอรมัน, "zh" สำหรับภาษาจีนตัวย่อ มิฉะนั้นจะเป็นค่าเริ่มต้นของระบบ ภาษาอังกฤษจะถูกตั้งเป็นค่าเริ่มต้นสำหรับภาษาที่ไม่รองรับ\n\n-mt <number_of_threads>\nกำหนดขนาดของเธรดพูลสำหรับการปรับแต่งการเดินสายให้มีประสิทธิภาพ ค่าเริ่มต้นคือ\nน้อยกว่าจำนวนโปรเซสเซอร์เชิงตรรกะในระบบอยู่หนึ่ง\n\n-us <updating_strategy>\nGreedy, Global, Hybrid กำหนดกลยุทธ์การอัปเดตบอร์ดสำหรับการปรับแต่งการเดินสาย\nให้มีประสิทธิภาพ ค่าเริ่มต้นคือ greedy เมื่อเลือกแบบ hybrid\nจะมีอีกตัวเลือก "hr" ที่ใช้ระบุอัตราส่วน hybrid\n\n-hr <m\:n>\nกำหนดอัตราส่วนไฮบริดในรูปแบบของ\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "38": " ค่าเริ่มต้นคือ 1\:1 ผลลัพธ์จะมีผลเฉพาะเมื่อใช้กลยุทธ์แบบผสม (hybrid strategy)" } ```\nถูกเลือกอยู่\n\n-is <selection_strategy>\nเรียงลำดับ สุ่ม หรือตามลำดับความสำคัญ กำหนดกลยุทธ์การเลือกรายการ\nสำหรับการปรับเพิ่มประสิทธิภาพเส้นทาง: แบบเรียงลำดับ, แบบสุ่ม, แบบจัดลำดับความสำคัญ\nค่าเริ่มต้นคือ prioritized (เน้นตามลำดับความสำคัญ) กลยุทธ์แบบเน้นตามลำดับความสำคัญจะเลือกรายการตาม\nคะแนนที่คำนวณได้ในรอบก่อนหน้า\n\n-h แสดงคำอธิบายช่วยเหลือนี้\n
