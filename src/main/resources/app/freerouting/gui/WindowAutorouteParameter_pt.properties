active=Ativa
active_tooltip=Marque esta caixa para permitir que o autorouter roteie trilhas nesta camada.
against_preferred_direction=Contra a direção preferida
against_preferred_direction_tooltip=Custo de rotear uma trilha de cobre contra a direção preferida. Um custo maior penaliza o posicionamento de trilhas perpendicular à direção preferida.
apply_values_note=Clique em Aplicar para usar os valores atuais.
autoroute=Roteamento automático
autoroute_tooltip=Durante a etapa de roteamento, o autorouter estabelece automaticamente as conexões elétricas entre vários componentes, posicionando trilhas na placa.
bend_cost=Custo de curva
bend_cost_tooltip=Penalidade de curva por camada adicionada ao custo de expansão cada vez que o autorouter muda de direção nesta camada. Intervalo válido: 0.0 (sem penalidade, padrão) a 9.9 (desestimula fortemente curvas). Defina um valor alto em uma camada de face simples ou de jumpers para favorecer trilhas retas.
detail_autoroute_parameter=Configurações avançadas do autorouter
detail_parameter=Configurações avançadas
fanout=Fanout
fanout_tooltip=A etapa de fanout envolve a criação de vias iniciais e segmentos curtos de trilhas a partir dos pads de componentes densos (como BGAs) para outras camadas da placa.
fast=Rápido
horizontal=Horizontal
in_preferred_direction=Na direção preferida
in_preferred_direction_tooltip=Custo de rotear uma trilha de cobre na direção preferida. Um custo menor incentiva o posicionamento da trilha nesta camada.
job_timeout=Tempo limite:
job_timeout_tooltip=Tempo limite de roteamento em horas, minutos e segundos. O valor é limitado a 24 horas.
layer=Camada
layer_tooltip=Lista de camadas configuradas na placa de roteamento.
max_passes=Número máximo de passos:
max_passes_tooltip=Número máximo de etapas de roteamento. Use 0 para nenhum limite.
max_threads=Número máximo de threads:
max_threads_tooltip=Número de threads de roteamento. 1 utiliza um núcleo de CPU; valores mais altos utilizam mais núcleos, até ao limite desta máquina.
optimization=Otimização
optimization_tooltip=Na etapa de otimização, o roteamento inicial é refinado para melhorar o design geral.
plane_via_costs=Custos de via para plano de alimentação:
plane_via_costs_tooltip=Custo de via quando uma rede se conecta a um plano de alimentação ou massa.
power_layer_tooltip=Desativado porque esta é uma camada de plano e não pode ser usada para rotear trilhas de cobre regulares.
preferred_direction=Direção preferida
preferred_direction_tooltip=Defina a direção preferida das trilhas nesta camada para vertical ou horizontal.
routing_stages=Etapas de roteamento:
routing_stages_tooltip=Escolha quais etapas de roteamento executar durante a tarefa.
slow=Lento
speed=Velocidade:
start_pass=Passo inicial:
start_ripup_costs=Custos iniciais de rip-up:
