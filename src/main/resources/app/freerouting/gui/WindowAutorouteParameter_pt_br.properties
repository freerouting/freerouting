fast=Rápido
horizontal=Horizontal
in_preferred_direction=Na direção preferida
in_preferred_direction_tooltip=Custo de rotear uma trilha de cobre na direção preferida. Um custo menor incentiva o reposicionamento de trilhas nesta camada.
job_timeout=Tempo limite:
job_timeout_tooltip=Tempo limite de roteamento em horas, minutos e segundos. O valor é limitado a 24 horas.
layer=Camada
layer_tooltip=Lista de camadas configuradas na placa de roteamento.
