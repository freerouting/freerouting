bend_cost=Custo de curva
bend_cost_tooltip=Penalidade de curva por camada adicionada ao custo de expansão cada vez que o autorouter muda de direção nesta camada. Intervalo válido: 0,0 (sem penalidade, padrão) a 9,9 (desencoraja fortemente curvas). Defina um valor alto em uma camada de face simples ou de jumpers para favorecer trilhas retas.
