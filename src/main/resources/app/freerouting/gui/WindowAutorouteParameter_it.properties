active=Attivo
active_tooltip=Seleziona questa casella per consentire all'autorouter di tracciare le connessioni su questo layer.
against_preferred_direction=Contro la direzione preferita
against_preferred_direction_tooltip=Costo dell'instradamento di una traccia contro la direzione preferita. Un costo superiore penalizza il posizionamento delle tracce perpendicolare alla direzione preferita.
algorithm=Algoritmo
algorithm_current=Attuale (predefinito)
algorithm_tooltip=Scegli il motore di instradamento. Attuale utilizza l'implementazione moderna; v1.9 è il percorso di confronto obsoleto.
algorithm_v19=v1.9 (obsoleto)
apply_values_note=Fai clic su Applica per utilizzare i valori attuali.
autoroute=Instradamento automatico
autoroute_tooltip=Durante la fase di instradamento, l'autorouter stabilisce automaticamente le connessioni elettriche tra i vari componenti posizionando le tracce sul PCB.
bend_cost=Costo di curvatura
bend_cost_tooltip=Penalità di curvatura per layer aggiunta al costo di espansione ogni volta che l'autorouter cambia direzione su questo layer. Intervallo valido: da 0.0 (nessuna penalità, predefinito) a 9.9 (scoraggia fortemente le curvature). Impostare su un valore alto su un layer a faccia singola o con ponticelli per favorire le tracce dritte.
detail_autoroute_parameter=Impostazioni avanzate autorouter
detail_parameter=Impostazioni avanzate
fanout=Uscita tracce (Fanout)
fanout_tooltip=La fase di uscita tracce da pad densi prevede la creazione di via iniziali e brevi segmenti di traccia dai pad dei componenti ad alta densità (come i BGA) verso altri layer del PCB.
fast=Veloce
horizontal=Orizzontale
in_preferred_direction=Nella direzione preferita
in_preferred_direction_tooltip=Costo dell'instradamento di una traccia nella direzione preferita. Un costo inferiore favorisce il posizionamento delle tracce su questo layer.
job_timeout=Tempo limite:
job_timeout_tooltip=Tempo limite di instradamento in ore, minuti e secondi. Il valore è limitato a un massimo di 24 ore.
layer=Layer
layer_tooltip=Elenco dei layer configurati nella scheda da instradare.
max_passes=Passaggi massimi:
max_passes_tooltip=Passaggi massimi di instradamento. Usa 0 per nessun limite.
max_threads=Thread massimi:
max_threads_tooltip=Numero di thread di instradamento. 1 utilizza un core CPU; valori più elevati utilizzano più core, fino al limite di questa macchina.
optimization=Ottimizzazione
optimization_tooltip=Nella fase di ottimizzazione, l'instradamento iniziale viene rifinito per migliorare il circuito complessivo.
plane_via_costs=Costi via piano di alimentazione:
plane_via_costs_tooltip=Costo della via quando una rete si connette a un piano di alimentazione o di massa.
power_layer_tooltip=Disabilitato perché questo è un piano di alimentazione / massa e non può essere utilizzato per l'instradamento delle tracce normali.
preferred_direction=Direzione preferita
preferred_direction_tooltip=Imposta la direzione preferita delle tracce su questo layer in verticale o orizzontale.
routing_stages=Fasi di instradamento:
routing_stages_tooltip=Scegli quali fasi di instradamento eseguire durante il lavoro.
slow=Lento
speed=Velocità:
start_pass=Passaggio iniziale:
start_ripup_costs=Costi iniziali di rip-up:
start_ripup_costs_tooltip=Penalità iniziale per la rimozione delle tracce esistenti. Valori più alti rendono l'autorouter meno propenso ad annullare il lavoro svolto.
title=Impostazioni autorouter
trace_costs_on_layer=Costi traccia
trace_costs_on_layer_tooltip=Configura i modificatori del costo di espansione su ciascun layer della scheda.
vertical=Verticale
via_costs=Costi via:
via_costs_tooltip=Costo di una via per il cambio layer. Valori più alti mantengono l'autorouter più a lungo sul layer corrente.
vias_allowed=Via consentite:
