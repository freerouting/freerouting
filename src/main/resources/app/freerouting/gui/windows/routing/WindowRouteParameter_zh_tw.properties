45_degree=45 度
45_degree_tooltip=將互動走線轉角限制為 45 度角。
90_degree=90 度
90_degree_tooltip=將互動走線轉角限制為 90 度角。
automatic=自動
automatic_neckdown=自動頸縮
automatic_neckdown_tooltip=啟用時，走線寬度會在小於目前走線寬度的引腳處自動減小。
automatic_tooltip=使用網路設定中定義的佈線規則。
change_snap_angle_45=具有任意角度的既有走線無法完全支援 45° 貼齊角度。確定仍要更改貼齊角度嗎？
change_snap_angle_90=只有 90° 吸附角度才能完全支援正交走線。確定仍要變更吸附角度嗎？
clearance_compensation=間距補償：
clearance_compensation_checkbox=間距補償
clearance_compensation_checkbox_tooltip=在佈線期間套用額外的間距補償。
clearance_compensation_checkbox_tooltip_current=在佈線期間套用額外的間距補償。目前補償：{{value}}。
clearance_compensation_tooltip=啟用間距補償可能有助於僅使用一種走線間距類型的情況。
detail_parameter=詳細參數
drag_components_enabled=啟用拖曳元件
drag_components_enabled_tooltip=允許按住滑鼠左鍵時拖曳元件。
dynamic=動態
dynamic_tooltip=在移動滑鼠時進行互動佈線。
highlight_routing_obstacle=高亮顯示佈線障礙區
highlight_routing_obstacle_tooltip=在動態佈線時高亮顯示目前的佈線障礙區。
ignore_conduction_areas=忽略導電區
ignore_conduction_areas_tooltip=啟用時，在佈線過程中會將導電區視為非障礙區。
keepout_outside_outline=板框外禁布區
keepout_outside_outline_tooltip=啟用時，板框外的整個區域都將被視為禁布區。
manual=手動
manual_tooltip=手動選擇佈線規則與走線寬度。
none=無
none_tooltip=允許在互動佈線期間使用任意走線角度。
off=關閉
on=開啟
pin_pad_to_turn_gap=焊盤至轉彎間距：
pin_pad_to_turn_gap_tooltip=走線離開焊盤後在轉灣前必須延伸的最小距離。數值越高，限制越嚴格。
pin_pad_to_turn_gap_tooltip_current=走線離開焊盤後轉彎前的最小行進距離。數值越高限制越嚴格。目前數值：{{value}}。
pull_tight_accuracy=拉直精度：
pull_tight_accuracy_tooltip=佈線精度。數值越低越慢但更精確；數值越高越快但精度較低。
pull_tight_accuracy_tooltip_current=佈線精度。數值越低越慢但更精確；數值越高越快但精度較低。目前數值：{{value}}。
pull_tight_region=拉直半徑：
pull_tight_region_tooltip=游標周圍的半徑範圍，在每個佈線步驟後會將此範圍內的走線拉直。較小的值會將整理限制在較小區域且速度更快；最大值則套用到整板。
pull_tight_region_tooltip_radius=每次佈線步驟後拉直走線的游標周圍半徑。較小的值會將清理限制在較小區域且速度較快；最大值則套用至整個板圖。目前的半徑：{{value}}。
pull_tight_region_tooltip_whole_board=在每個佈線步驟後拉直走線時，游標周圍的半徑範圍。較小的值會將清理範圍限制在較小區域且速度更快；最大值適用於整塊板子。目前半徑：整塊板子（無限制）。
push&shove_enabled=啟用推擠佈線
push&shove_enabled_tooltip=允許互動佈線時推開既有走線（推擠佈線）。
restrict_pin_exit_directions=限制引腳引出方向
restrict_pin_exit_directions_tooltip=啟用時，將矩形引腳的走線引出限制在較短的兩側。
route_mode=佈線模式：
route_mode_tooltip=對固定網路佈線時切換至縫合模式。
rule_selection=規則選擇：
rule_selection_tooltip=選擇手動佈線規則或使用網路規則。
snap_angle=吸附角度：
snap_angle_tooltip=在互動佈線期間限制走線角度。
stitching=縫合佈線
stitching_tooltip=點選以放置轉角並手動進行縫合佈線。
title=佈線設定
via_snap_to_smd_center=導通孔貼齊 SMD 焊盤中心
via_snap_to_smd_center_tooltip=啟用後，連接至 SMD 引腳的導通孔將自動貼齊至其焊盤中心。
