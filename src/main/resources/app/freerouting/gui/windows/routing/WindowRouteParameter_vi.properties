pull_tight_region_tooltip_radius=Bán kính xung quanh con trỏ mà trong đó các đường đồng được kéo thẳng sau mỗi bước định tuyến. Giá trị nhỏ hơn sẽ giới hạn việc dọn dẹp trong một vùng nhỏ hơn và nhanh hơn; giá trị tối đa áp dụng cho toàn bộ bo mạch. Bán kính hiện tại: {{value}}.
pull_tight_region_tooltip_whole_board=Bán kính xung quanh con trỏ mà trong đó các đường đồng được kéo thẳng sau mỗi bước định tuyến. Giá trị nhỏ hơn sẽ giới hạn việc dọn dẹp trong một vùng nhỏ hơn và nhanh hơn; giá trị tối đa áp dụng cho toàn bộ bo mạch. Bán kính hiện tại: toàn bộ bo mạch (không giới hạn).
