active=Attivo
active_tooltip=Consente allo sbrogliatore automatico di sbrogliare le tracce su questo strato.
against_preferred_direction=Contro la direzione preferita
against_preferred_direction_tooltip=Costo di sbroglio di una traccia contro la direzione preferita. Un costo più alto scoraggia lo sbroglio su questo strato nella direzione perpendicolare.
apply_values_note=Fai clic su Applica per utilizzare i valori attuali.
autoroute=Sbroglio automatico
autoroute_tooltip=Durante la fase di sbroglio automatico, lo sbrogliatore automatico stabilisce le connessioni elettriche piazzando tracce di rame e via.
bend_cost=Costo di curvatura
bend_cost_tooltip=Penalità di curvatura per strato aggiunta al costo di espansione ogni volta che lo sbrogliatore cambia direzione su questo strato. Intervallo valido: da 0.0 (nessuna penalità; predefinito) a 9.9 (scoraggia fortemente le curve). Impostare un valore alto su uno strato monofaccia o con ponticelli per favorire tracce diritte.
detail_autoroute_parameter=Impostazioni avanzate sbrogliatore
detail_parameter=Impostazioni avanzate
fanout=Sventagliamento
fanout_tooltip=La fase di sventagliamento crea via iniziali e brevi segmenti di traccia dai pad di componenti ad alta densità (come i pad BGA) verso altri strati del PCB.
fast=Veloce
horizontal=Orizzontale
in_preferred_direction=In direzione preferita
in_preferred_direction_tooltip=Costo di sbroglio di una traccia nella direzione preferita. Un costo inferiore incoraggia lo sbroglio su questo strato in quella direzione.
job_timeout=Timeout dell'operazione:
job_timeout_tooltip=Imposta il timeout di sbroglio. Il valore massimo consentito è di quattro settimane.
layer=Strato
layer_tooltip=Elenca gli strati configurati sulla scheda da sbrogliare.
max_passes=Passate massime di sbroglio:
max_passes_tooltip=Imposta il numero massimo di passate di sbroglio. Usa 0 per nessun limite.
max_threads=Thread massimi di sbroglio:
max_threads_tooltip=Numero di thread di sbroglio. 1 usa un solo core CPU; valori più alti usano più core, fino al limite di questa macchina.
optimization=Ottimizzazione
optimization_tooltip=Durante la fase di ottimizzazione, i percorsi iniziali vengono perfezionati per migliorare il disegno complessivo.
plane_via_costs=Costo via verso piano di alimentazione o massa:
plane_via_costs_tooltip=Costo di una via usata quando una rete si collega a un piano di alimentazione o massa.
power_layer_tooltip=Disabilitato perché questo non è uno strato segnale e non può essere utilizzato per lo sbroglio delle tracce ordinarie.
preferred_direction=Direzione preferita
preferred_direction_tooltip=Imposta la direzione preferita di sbroglio delle tracce su questo strato su orizzontale o verticale.
routing_stages=Fasi di sbroglio:
routing_stages_tooltip=Seleziona le fasi di sbroglio da eseguire durante il lavoro.
slow=Lento
speed=Velocità:
start_pass=Passata iniziale:
start_ripup_costs=Costo iniziale di rimozione:
start_ripup_costs_tooltip=Penalità iniziale per la rimozione delle tracce esistenti. Valori più alti rendono lo sbrogliatore meno propenso ad annullare il lavoro svolto.
timeout_unit_days=Giorni
timeout_unit_hours=Ore
timeout_unit_minutes=Minuti
timeout_unit_weeks=Settimane
title=Impostazioni sbrogliatore
trace_costs_on_layer=Costi di pista per strato
trace_costs_on_layer_tooltip=Configura i modificatori del costo di espansione per ogni strato della scheda.
vertical=Verticale
via_costs=Costi di via:
via_costs_tooltip=Costo del cambio strato con una via. Valori più alti mantengono lo sbrogliatore più a lungo sullo strato corrente.
vias_allowed=Via consentite:
vias_allowed_tooltip=Consente allo sbrogliatore automatico di cambiare strato inserendo via.
