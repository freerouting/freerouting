active=פעיל
active_tooltip=אפשר לנתב האוטומטי לנתב מוליכים בשכבה זו.
against_preferred_direction=נגד הכיוון המועדף
against_preferred_direction_tooltip=עלות ניתוב מוליך נגד הכיוון המועדף. עלות גבוהה יותר מפחיתה ניתוב בשכבה זו בכיוון הניצב.
apply_values_note=לחץ על 'החל' כדי להשתמש בערכים הנוכחיים.
autoroute=ניתוב אוטומטי
autoroute_tooltip=במהלך שלב הניתוב האוטומטי, הנתב האוטומטי יוצר חיבורים חשמליים על ידי הצבת מוליכים וקדחי מעבר.
bend_cost=עלות כיפוף
bend_cost_tooltip=קנס כיפוף לפי שכבה שמתווסף לעלות ההתפשטות בכל פעם שהנתב משנה כיוון בשכבה זו. טווח תקין: 0.0 (ללא קנס; ברירת מחדל) עד 9.9 (מרחיק כיווני כיפוף בחוזקה). הגדר ערך גבוה בשכבה חד-צדדית או בשכבת חוט דילוג כדי להעדיף מוליכים ישרים.
detail_autoroute_parameter=הגדרות נתב אוטומטי מתקדמות
detail_parameter=הגדרות מתקדמות
fanout=פיזור יציאות מפדים צפופים
fanout_tooltip=שלב פיזור היציאות מציב קדחי מעבר ראשוניים ומקעטי מוליכים קצרים מפדים של רכיבים צפופים (כגון פדי BGA) לשכבות PCB אחרות.
fast=מהיר
horizontal=אופקי
in_preferred_direction=בכיוון המועדף
in_preferred_direction_tooltip=עלות ניתוב מוליך בכיוון הניתוב המועדף. עלות נמוכה יותר מעודדת ניתוב בשכבה זו בכיוון זה.
job_timeout=זמן קצוב למשימה:
job_timeout_tooltip=הגדר את הזמן הקצוב לניתוב. הערך מוגבל לארבעה שבועות לכל היותר.
layer=שכבה
layer_tooltip=מציג את השכבות שהוגדרו בלוח הניתוב.
max_passes=מספר מעברים מרבי:
max_passes_tooltip=הגדרת המספר המרבי של מעברי ניתוב. השתמש ב-0 ללא הגבלה.
max_threads=מספר תהליכוני ניתוב מרבי:
max_threads_tooltip=מספר תהליכוני הניתוב. הערך 1 משתמש שליבת מעבד אחת; ערכים גבוהים יותר משתמשים בלבות נוספות, עד למגבלה של מחשב זה.
optimization=אופטימיזציה
optimization_tooltip=במהלך שלב האופטימיזציה, המסלולים הראשוניים משופרים כדי לשפר את התכן הכולל.
plane_via_costs=עלות קדח למישור הספק או הארקה:
plane_via_costs_tooltip=עלות קדח מעבר המשמש כאשר רשת מתחברת למישור הספק או הארקה.
power_layer_tooltip=מושבת מכיוון שזו אינה שכבת אות ולא ניתן להשתמש בה לניתוב מוליכים רגיל.
preferred_direction=כיוון ניתוב מועדף
preferred_direction_tooltip=הגדר את כיוון הניתוב המועדף של המוליך בשכבה זו לאופקי או אנכי.
routing_stages=שלבי ניתוב:
routing_stages_tooltip=בחירת שלבי הניתוב להרצה במהלך המשימה.
slow=איטי
speed=מהירות:
start_pass=מעבר התחלה:
start_ripup_costs=עלות התחלת פירוק:
start_ripup_costs_tooltip=קנס התחלתי עבור פירוק מוליכים קיימים. ערכים גבוהים יותר מפחיתים את הסיכוי שהנתב יבטל עבודה קיימת.
timeout_unit_days=ימים
timeout_unit_hours=שעות
timeout_unit_minutes=דקות
timeout_unit_weeks=שבועות
title=הגדרות נתב אוטומטי
trace_costs_on_layer=עלויות מוליך לפי שכבה
trace_costs_on_layer_tooltip=הגדרת מקדמי עלות התפשטות עבור כל שכבה בלוח.
vertical=אנכי
via_costs=עלויות קדח מעבר:
via_costs_tooltip=עלות החלפת שכבות באמצעות קדח מעבר. ערכים גבוהים יותר משאירים את הנתב בשכבה הנוכחית לזמן רב יותר.
vias_allowed=קדחי מעבר מותרים:
vias_allowed_tooltip=אפשר לנתב האוטומטי להחליף שכבות על ידי הוספת קדחי מעבר.
