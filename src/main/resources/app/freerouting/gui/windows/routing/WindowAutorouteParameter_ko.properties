active=활성
active_tooltip=자동 배선기가 이 레이어에서 트레이스를 배선할 수 있도록 하려면 이 상자를 선택하세요.
against_preferred_direction=선호 배선 방향 반대로
against_preferred_direction_tooltip=선호 배선 방향에 반하여 트레이스를 배선할 때의 비용입니다. 비용이 높을수록 선호 배선 방향과 수직인 트레이스 배치에 페널티가 부여됩니다.
apply_values_note=현재 값을 사용하려면 적용을 클릭하세요.
autoroute=자동 배선
autoroute_tooltip=배선 단계 동안 자동 배선기는 PCB에 트레이스를 배치하여 다양한 부품 간의 전기적 연결을 자동으로 설정합니다.
bend_cost=굴곡 비용
bend_cost_tooltip=이 레이어에서 라우터가 방향을 전환할 때마다 확장 비용에 추가되는 레이어별 굴곡 페널티입니다. 유효 범위: 0.0(페널티 없음, 기본값) ~ 9.9(굴곡을 강력히 억제). 단면 레이어나 점퍼 와이어 레이어에서 직선 트레이스를 선호하려면 높은 값으로 설정하십시오.
detail_autoroute_parameter=고급 자동 배선기 설정
detail_parameter=고급 설정
fanout=팬아웃
fanout_tooltip=팬아웃 단계는 고밀도 부품(BGA 등)의 패드에서 PCB의 다른 레이어로 연결되는 초기 비아 및 짧은 트레이스 세그먼트를 생성하는 작업을 포함합니다.
fast=빠르게
horizontal=수평
in_preferred_direction=선호 배선 방향으로
in_preferred_direction_tooltip=선호 배선 방향으로 트레이스를 배선할 때의 비용입니다. 비용이 낮을수록 이 레이어에 트레이스가 배치되도록 유도합니다.
job_timeout=타임아웃:
job_timeout_tooltip=시간, 분, 초 단위의 배선 타임아웃입니다. 이 값은 최대 24시간으로 제한됩니다.
layer=레이어
layer_tooltip=배선 보드에 구성된 레이어 목록입니다.
max_passes=최대 패스 수:
max_passes_tooltip=최대 배선 패스 횟수입니다. 제한을 두지 않으려면 0을 사용하세요.
max_threads=최대 쓰레드:
max_threads_tooltip=배선 쓰레드 수입니다. 1은 하나의 CPU 코어를 사용하며, 더 높은 값은 이 시스템의 제한까지 더 많은 코어를 사용합니다.
optimization=최적화
optimization_tooltip=최적화 단계에서는 전체적인 설계를 개선하기 위해 초기 배선을 다듬고 정리합니다.
plane_via_costs=파워 플레인 비아 비용:
plane_via_costs_tooltip=넷이 파워 플레인 또는 접지면에 연결될 때의 비아 비용입니다.
power_layer_tooltip=이 레이어는 파워 플레인 레이어이며 일반 트레이스 배선에 사용할 수 없으므로 비활성화되어 있습니다.
preferred_direction=선호 배선 방향
preferred_direction_tooltip=이 레이어에서의 선호 배선 방향을 수직 또는 수평으로 설정합니다.
routing_stages=배선 단계:
routing_stages_tooltip=작업 중 실행할 배선 단계를 선택합니다.
slow=느리게
speed=속도:
start_pass=시작 패스:
start_ripup_costs=립업 시작 비용:
start_ripup_costs_tooltip=기존 트레이스를 립업할 때의 시작 페널티입니다. 값이 높을수록 라우터가 작업을 취소하려는 시도를 줄입니다.
title=자동 배선기 설정
trace_costs_on_layer=트레이스 비용
trace_costs_on_layer_tooltip=각 보드 레이어의 확장 비용 수정자를 구성합니다.
vertical=수직
via_costs=비아 비용:
via_costs_tooltip=레이어 전환 비아의 비용입니다. 값이 높을수록 라우터가 현재 레이어에 더 오래 유지됩니다.
vias_allowed=비아 허용:
