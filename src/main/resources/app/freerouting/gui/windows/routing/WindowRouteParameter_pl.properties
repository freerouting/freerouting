pin_pad_to_turn_gap=Odstęp od padu do załamania:
pin_pad_to_turn_gap_tooltip=Odległość, po której ścieżka może zmienić kierunek po opuszczeniu pada. Wyższe wartości wprowadzają większe ograniczenia.
