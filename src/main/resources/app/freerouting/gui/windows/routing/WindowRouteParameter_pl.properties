pull_tight_accuracy=Dokładność napięcia ścieżki:
pull_tight_accuracy_tooltip=Precyzja trasowania. Niższe wartości są wolniejsze, ale bardziej precyzyjne; wyższe wartości są szybsze, ale mniej precyzyjne.
pull_tight_accuracy_tooltip_current=Precyzja trasowania. Niższe wartości są wolniejsze, ale bardziej precyzyjne; wyższe wartości są szybsze, ale mniej precyzyjne. Aktualna wartość: {{value}}.
pull_tight_region=Promień napięcia ścieżki:
pull_tight_region_tooltip=Promień wokół kursora, w obrębie którego ścieżki miedziane są prostowane po każdym kroku trasowania. Mniejsze wartości ograniczają czyszczenie do mniejszego obszaru i są szybsze; wartość maksymalna dotyczy całej płytki.
pull_tight_region_tooltip_radius=Promień wokół kursora, w obrębie którego ścieżki miedziane są prostowane po każdym kroku trasowania. Mniejsze wartości ograniczają czyszczenie do mniejszego obszaru i są szybsze; wartość maksymalna dotyczy całej płytki. Bytno promień: {{value}}.
pull_tight_region_tooltip_whole_board=Promień wokół kursora, w obrębie którego ścieżki miedziane są prostowane po każdym kroku trasowania. Mniejsze wartości ograniczają czyszczenie do mniejszego obszaru i są szybsze; wartość maksymalna dotyczy całej płytki. Bądźcący promień: cała płytka (bez limitu).
