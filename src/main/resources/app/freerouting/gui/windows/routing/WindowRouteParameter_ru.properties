pin_pad_to_turn_gap_tooltip=Минимальное расстояние, которое должна пройти дорожка после выхода из контактной площадки, прежде чем сможет повернуть. Более высокие значения более ограничены.
pin_pad_to_turn_gap_tooltip_current=Минимальное расстояние, которое медная дорожка должна пройти после выхода из контактной площадки, прежде чем сможет повернуть. Более высокие значения накладывают больше ограничений. Текущее значение: {{value}}.
pull_tight_accuracy=Точность вытягивания:
pull_tight_accuracy_tooltip=Точность трассировки. Меньшие значения работают медленнее, но точнее; большие значения работают быстрее, но менее точно.
pull_tight_accuracy_tooltip_current=Точность трассировки. Меньшие значения работают медленнее, но точнее; большие значения работают быстрее, но менее точно. Текущее значение: {{value}}.
pull_tight_region=Радиус вытягивания:
pull_tight_region_tooltip=Радиус вокруг курсора, в пределах которого проводники выпрямляются после каждого шага трассировки. Меньшие значения ограничивают очистку меньшей областью и работают быстрее; максимальное значение применяется ко всей плате.
pull_tight_region_tooltip_radius=Радиус вокруг курсора, в пределах которого дорожки выпрямляются после каждого шага трассировки. Меньшие значения ограничивают очистку меньшей областью и работают быстрее; максимальное значение применяется ко всей плате. Текущий радиус: {{value}}.
pull_tight_region_tooltip_whole_board=Радиус вокруг курсора, в пределах которого проводники выпрямляются после каждого шага трассировки. Меньшие значения ограничивают очистку меньшей областью и работают быстрее; максимальное значение применяется ко всей плате. Текущий радиус: вся плата (без ограничений).
