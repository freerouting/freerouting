title=Routing Settings
snap_angle=Snap angle:
snap_angle_tooltip=Restrict trace angles during interactive routing.
90_degree=90 degrees
90_degree_tooltip=Constrain interactive trace corners to 90-degree angles.
45_degree=45 degrees
45_degree_tooltip=Constrain interactive trace corners to 45-degree angles.
none=None
none_tooltip=Allow arbitrary trace angles during interactive routing.
route_mode=Route mode:
route_mode_tooltip=Switch to stitching mode when routing shove-fixed nets.
dynamic=Dynamic
dynamic_tooltip=Route interactively while moving the mouse.
stitching=Stitching
stitching_tooltip=Click to place corners and manually stitch the route.
rule_selection=Rule selection:
rule_selection_tooltip=Choose manual routing rules or use the net rules.
automatic=Automatic
automatic_tooltip=Use routing rules defined in the net settings.
manual=Manual
manual_tooltip=Select routing rules and trace widths manually.
push&shove_enabled=Push-and-shove enabled
push&shove_enabled_tooltip=Allow interactive routing to displace existing traces (push-and-shove).
drag_components_enabled=Drag components enabled
drag_components_enabled_tooltip=Enable dragging components while holding the left mouse button.
via_snap_to_smd_center=Vias snap to SMD pad centers
via_snap_to_smd_center_tooltip=When enabled, vias attached to SMD pins snap to the centers of their pads.
highlight_routing_obstacle=Highlight routing obstacle
highlight_routing_obstacle_tooltip=Highlight the current routing obstacle in dynamic routing.
ignore_conduction_areas=Ignore conduction areas
ignore_conduction_areas_tooltip=When enabled, conduction areas are treated as non-obstacles during routing.
automatic_neckdown=Automatic neckdown
automatic_neckdown_tooltip=When enabled, trace width is automatically reduced at pins narrower than the current trace width.
restrict_pin_exit_directions=Restrict pin exit directions
restrict_pin_exit_directions_tooltip=When enabled, trace exits from rectangular pins are restricted to their shorter sides.
pin_pad_to_turn_gap=Pad-to-turn gap:
pin_pad_to_turn_gap_tooltip=Minimum distance a trace must travel after leaving a pad before it can turn. Higher values are more restrictive.
pin_pad_to_turn_gap_tooltip_current=Minimum distance a trace must travel after leaving a pad before it can turn. Higher values are more restrictive. Current value: {{value}}.
pull_tight_region=Pull-tight radius:
pull_tight_region_tooltip=The radius around the cursor within which traces are straightened after each routing step. Smaller values limit cleanup to a smaller area and are faster; the maximum applies to the entire board.
pull_tight_region_tooltip_whole_board=The radius around the cursor within which traces are straightened after each routing step. Smaller values limit cleanup to a smaller area and are faster; the maximum applies to the entire board. Current radius: entire board (no limit).
pull_tight_region_tooltip_radius=The radius around the cursor within which traces are straightened after each routing step. Smaller values limit cleanup to a smaller area and are faster; the maximum applies to the entire board. Current radius: {{value}}.
detail_parameter=Detailed parameters
change_snap_angle_45=Existing traces with arbitrary angles are not fully supported with a 45° snap angle. Change the snap angle anyway?
change_snap_angle_90=Only orthogonal traces are fully supported with a 90° snap angle. Change the snap angle anyway?
clearance_compensation=Clearance compensation:
clearance_compensation_tooltip=Enabling clearance compensation may help when using only one trace clearance type.
clearance_compensation_checkbox=Clearance compensation
clearance_compensation_checkbox_tooltip=Apply extra clearance compensation during routing.
clearance_compensation_checkbox_tooltip_current=Apply extra clearance compensation during routing. Current compensation: {{value}}.
on=on
off=off
pull_tight_accuracy=Pull-tight accuracy:
pull_tight_accuracy_tooltip=Routing precision. Lower values are slower but more precise; higher values are faster but less precise.
pull_tight_accuracy_tooltip_current=Routing precision. Lower values are slower but more precise; higher values are faster but less precise. Current value: {{value}}.
keepout_outside_outline=Keepout outside board outline
keepout_outside_outline_tooltip=When enabled, the entire area outside the board outline is treated as a keepout.
