pin_pad_to_turn_gap=パッドから曲がりまでの間隔:
pin_pad_to_turn_gap_tooltip=パッドから出たトレースが曲がるまでに進む必要のある最小距離です。値が大きいほど制約が厳しくなります。
pin_pad_to_turn_gap_tooltip_current=トレースがパッドを出てから方向転換するまでに移動しなければならない最小距離です。値が大きいほど制約が厳しくなります。現在の値: {{value}}
pull_tight_accuracy=プルタイト精度:
pull_tight_accuracy_tooltip=配線精度。値が小さいほど低速ですが高精度になり、値が大きいほど高速ですが精度が低下します。
pull_tight_accuracy_tooltip_current=配線精度。値が小さいほど低速ですが高精度になり、値が大きいほど高速ですが精度が低下します。現在の値: {{value}}。
pull_tight_region=プルタイト半径:
pull_tight_region_tooltip=各配線ステップ後にトレースが直線化される、カーソル周辺の半径。値を小さくするとクリーンアップが狭い領域に制限され高速になります。最大値は基板全体に適用されます。
pull_tight_region_tooltip_radius=各配線ステップの後にトレースが直線化される、カーソル周辺の半径です。値が小さいほどクリーンアップの範囲が狭くなり、高速になります。最大値はボード全体に適用されます。現在の半径: {{value}}
pull_tight_region_tooltip_whole_board=配線ステップのたびにトレースが直線化される、カーソル周辺の半径です。値を小さくするとクリーンアップがより狭い領域に制限されて高速になります。最大値は基板全体に適用されます。現在の半径：基板全体（制限なし）。
push&shove_enabled=プッシュ＆ショブ有効
