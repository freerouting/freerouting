active=Ενεργό
active_tooltip=Ενεργοποιήστε τον αυτόματο δρομολογητή για να δρομολογεί διαδρόμους σε αυτό το στρώμα.
against_preferred_direction=Αντίθετα στην προτιμώμενη κατεύθυνση
against_preferred_direction_tooltip=Κόστος δρομολόγησης διαδρόμου αντίθετα στην προτιμώμενη κατεύθυνση. Το υψηλότερο κόστος αποτρέπει τη δρομολόγηση σε αυτό το στρώμα στην κάθετη κατεύθυνση.
apply_values_note=Κάντε κλικ στο Εφαρμογή για να χρησιμοποιήσετε τις τρέχουσες τιμές.
autoroute=Αυτόματη δρομολόγηση
autoroute_tooltip=Κατά το στάδιο αυτόματης δρομολόγησης, ο αυτόματος δρομολογητής δημιουργεί ηλεκτρικές συνδέσεις τοποθετώντας διαδρόμους και διελεύσεις.
bend_cost=Κόστος κάμψης
bend_cost_tooltip=Ποινή κάμψης ανά στρώμα που προστίθεται στο κόστος επέκτασης κάθε φορά που ο δρομολογητής αλλάζει κατεύθυνση σε αυτό το στρώμα. Έγκυρο εύρος: 0.0 (χωρίς ποινή, προεπιλογή) έως 9.9 (αποθαρρύνει έντονα τις κάμψεις). Ορίστε μια υψηλή τιμή σε στρώμα μονής όψης ή γέφυρας σύρματος για να ευνοήσετε ευθείες διαδρομές.
detail_autoroute_parameter=Ρυθμίσεις για προχωρημένους αυτόματου δρομολογητή
detail_parameter=Ρυθμίσεις για προχωρημένους
fanout=Εξάπλωση διαδρόμων
fanout_tooltip=Το στάδιο εξάπλωσης διαδρόμων δημιουργεί αρχικές διελεύσεις και μικρά τμήματα διαδρόμων από επιθέματα πυκνών εξαρτημάτων (όπως επιθέματα BGA) προς άλλα στρώματα της πλακέτας.
fast=Γρήγορα
horizontal=Οριζόντια
in_preferred_direction=Στην προτιμώμενη κατεύθυνση
in_preferred_direction_tooltip=Κόστος δρομολόγησης διαδρόμου στην προτιμώμενη κατεύθυνση. Το χαμηλότερο κόστος ενθαρρύνει τη δρομολόγηση σε αυτό το στρώμα προς εκείνη την κατεύθυνση.
job_timeout=Χρονικό όριο εργασίας:
job_timeout_tooltip=Ορίστε το χρονικό όριο δρομολόγησης. Η τιμή περιορίζεται το πολύ στις τέσσερις εβδομάδες.
layer=Στρώμα
layer_tooltip=Προβάλλει τη λίστα με τα στρώματα που έχουν διαμορφωθεί στην πλακέτα δρομολόγησης.
max_passes=Μέγιστα περάσματα δρομολόγησης:
max_passes_tooltip=Ορίστε τον μέγιστο αριθμό περασμάτων δρομολόγησης. Χρησιμοποιήστε το 0 για κανένα όριο.
max_threads=Μέγιστα νήματα δρομολόγησης:
max_threads_tooltip=Αριθμός νημάτων δρομολόγησης. Το 1 χρησιμοποιεί έναν πυρήνα CPU· υψηλότερες τιμές χρησιμοποιούν περισσότερους πυρήνες, έως το όριο αυτού του μηχανήματος.
optimization=Βελτιστοποίηση
optimization_tooltip=Κατά το στάδιο βελτιστοποίησης, οι αρχικές δρομολογήσεις βελτιώνονται για τη συνολική αναβάθμιση της σχεδίασης.
plane_via_costs=Κόστος διέλευσης προς επίπεδο τροφοδοσίας ή γείωσης:
plane_via_costs_tooltip=Κόστος διέλευσης που χρησιμοποιείται όταν ένα δίκτυο συνδέεται σε επίπεδο τροφοδοσίας ή γείωσης.
power_layer_tooltip=Απενεργοποιήθηκε επειδή αυτό δεν είναι στρώμα σήματος και δεν μπορεί να χρησιμοποιηθεί για κανονική δρομολόγηση διαδρόμων.
preferred_direction=Προτιμώμενη κατεύθυνση
preferred_direction_tooltip=Ορίστε την προτιμώμενη κατεύθυνση δρομολόγησης διαδρόμων σε αυτό το στρώμα σε οριζόντια ή κατακόρυφη.
routing_stages=Στάδια δρομολόγησης:
routing_stages_tooltip=Επιλέξτε τα στάδια δρομολόγησης που θα εκτελεστούν κατά τη διάρκεια της εργασίας.
slow=Αργά
speed=Ταχύτητα:
start_pass=Αρχικό πέρασμα:
start_ripup_costs=Αρχικό κόστος αφαίρεσης:
start_ripup_costs_tooltip=Αρχική ποινή για την αφαίρεση υφιστάμενων διαδρόμων. Υψηλότερες τιμές καθιστούν λιγότερο πιθανό για τον δρομολογητή να αναιρέσει υπάρχουσα εργασία.
timeout_unit_days=Ημέρες
timeout_unit_hours=Ώρες
timeout_unit_minutes=Λεπτά
timeout_unit_weeks=Εβδομάδες
title=Ρυθμίσεις αυτόματου δρομολογητή
trace_costs_on_layer=Κόστη διαδρόμων ανά στρώμα
trace_costs_on_layer_tooltip=Διαμορφώστε τους τροποποιητές κόστους επέκτασης για κάθε στρώμα της πλακέτας.
vertical=Κατακόρυφα
via_costs=Κόστη διέλευσης:
via_costs_tooltip=Κόστος αλλαγής στρωμάτων με διέλευση. Υψηλότερες τιμές κρατούν τον δρομολογητή περισσότερο στο τρέχον στρώμα.
vias_allowed=Επιτρεπόμενες διελεύσεις:
vias_allowed_tooltip=Να επιτρέπεται στον αυτόματο δρομολογητή να αλλάζει στρώματα τοποθετώντας διελεύσεις.
