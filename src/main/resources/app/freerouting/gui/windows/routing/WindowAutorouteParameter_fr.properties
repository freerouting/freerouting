active=Active
active_tooltip=Cochez cette case pour autoriser l'autorouteur à router des pistes sur cette couche.
against_preferred_direction=Contre la direction préférée
against_preferred_direction_tooltip=Coût de routage d'une piste à l'encontre de la direction préférée. Un coût plus élevé pénalise le placement de pistes perpendiculairement à la direction préférée.
apply_values_note=Cliquez sur Appliquer pour utiliser les valeurs actuelles.
autoroute=Routage automatique
autoroute_tooltip=Pendant l'étape de routage, l'autorouteur établit automatiquement les connexions électriques entre les différents composants en plaçant des pistes sur le circuit imprimé.
bend_cost=Coût de courbure
bend_cost_tooltip=Pénalité de courbure par couche ajoutée au coût d'expansion chaque fois que l'autorouteur change de direction sur cette couche. Plage valide : 0.0 (aucune pénalité, par défaut) à 9.9 (décourage fortement les courbures). Définissez une valeur élevée sur une couche simple face ou à ponts pour favoriser des pistes droites.
detail_autoroute_parameter=Réglages avancés de l'autorouteur
detail_parameter=Paramètres avancés
fanout=Éventail
fanout_tooltip=L'étape d'éventail consiste à créer des vias initiaux et de courts segments de piste à partir des pastilles des composants denses (comme les BGA) vers les autres couches du circuit imprimé.
fast=Rapide
horizontal=Horizontale
in_preferred_direction=Dans la direction préférée
in_preferred_direction_tooltip=Coût de routage d'une piste dans la direction préférée. Un coût plus faible encourage le placement de pistes sur cette couche.
job_timeout=Délai d'expiration :
job_timeout_tooltip=Délai d'expiration du routage en heures, minutes et secondes. La valeur est plafonnée à 24 heures.
layer=Couche
layer_tooltip=Liste des couches configurées sur la carte à router.
max_passes=Passes maximales :
max_passes_tooltip=Nombre maximal de passes de routage. Utilisez 0 pour aucune limite.
max_threads=Nombre maximal de threads :
max_threads_tooltip=Nombre de threads de routage. 1 utilise un seul cœur CPU ; des valeurs plus élevées utilisent plus de cœurs, dans la limite des capacités de cette machine.
optimization=Optimisation
optimization_tooltip=Lors de l'étape d'optimisation, le routage initial est affiné pour améliorer la conception globale.
plane_via_costs=Coûts des vias vers plan de puissance :
plane_via_costs_tooltip=Coût du via lorsqu'un réseau se connecte à un plan de puissance ou de masse.
power_layer_tooltip=Désactivé car il s'agit d'une couche de plan et elle ne peut pas être utilisée pour router des pistes ordinaires.
preferred_direction=Direction préférée
preferred_direction_tooltip=Définissez la direction préférée de routage des pistes sur cette couche (verticale ou horizontale).
routing_stages=Étapes de routage :
routing_stages_tooltip=Choisissez les étapes de routage à exécuter pendant la tâche.
slow=Lent
speed=Vitesse :
start_pass=Passe de départ :
start_ripup_costs=Coûts de démarrage de rip-up :
start_ripup_costs_tooltip=Pénalité initiale pour supprimer les pistes existantes. Des valeurs plus élevées rendent l'autorouteur moins enclin à défaire le travail déjà effectué.
title=Réglages de l'autorouteur
trace_costs_on_layer=Coûts de piste
trace_costs_on_layer_tooltip=Configurez les modificateurs de coût d'expansion sur chaque couche de la carte.
vertical=Verticale
via_costs=Coûts des vias :
via_costs_tooltip=Coût d'un via de changement de couche. Des valeurs plus élevées maintiennent l'autorouteur plus longtemps sur la couche actuelle.
vias_allowed=Vias autorisés :
