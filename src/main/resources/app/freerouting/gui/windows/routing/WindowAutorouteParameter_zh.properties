active=启用
active_tooltip=允许自动布线器在该层上布设走线。
against_preferred_direction=逆优先方向
against_preferred_direction_tooltip=逆优先方向布线走线的代价。较高的代价会抑制在该层的垂直方向上布线。
apply_values_note=点击应用以使用当前值。
autoroute=自动布线
autoroute_tooltip=在自动布线阶段，自动布线器通过放置走线和过孔建立电气连接。
bend_cost=转弯代价
bend_cost_tooltip=自动布线器在该层改变方向时附加到扩展代价上的逐层转弯惩罚。有效范围：0.0（无惩罚，默认值）到 9.9（强烈抑制转弯）。在单面板或跳线层上设置较高值可以促使布线尽可能保持直线。
detail_autoroute_parameter=自动布线器高级设置
detail_parameter=高级设置
fanout=扇出
fanout_tooltip=扇出阶段会从高密度元件焊盘（如 BGA 焊盘）创建初始过孔和短走线段至其他 PCB 层。
fast=快
horizontal=水平
in_preferred_direction=沿优先方向
in_preferred_direction_tooltip=沿优先方向布线走线的代价。较低的代价会鼓励在该层的该方向上布线。
job_timeout=任务超时时间：
job_timeout_tooltip=设置布线超时时间。最大值上限为四周。
layer=层
layer_tooltip=列出布线板上配置的层。
max_passes=最大布线轮次：
max_passes_tooltip=设置布线阶段的最大轮次。设置为 0 表示无限制。
max_threads=最大布线线程数：
max_threads_tooltip=布线使用的线程数。设为 1 表示使用单个 CPU 核心；更高的数值将使用更多核心，上限为当前机器的核心数。
optimization=优化
optimization_tooltip=在优化阶段，初始布线将被精简改善，以提升整体设计质量。
plane_via_costs=电源平面过孔代价：
plane_via_costs_tooltip=当网络连接到电源平面或地平面时使用过孔的代价。
power_layer_tooltip=已禁用，因为这不是信号层，无法用于常规走线布线。
preferred_direction=优先布线方向
preferred_direction_tooltip=将该层上的优先布线方向设置为水平或垂直。
routing_stages=布线阶段：
routing_stages_tooltip=选择任务期间要运行的布线阶段。
slow=慢
speed=速度：
start_pass=起始轮次：
start_ripup_costs=拆线起始代价：
start_ripup_costs_tooltip=拆除已有走线的初始惩罚。数值越高，自动布线器越不容易撤销已布好的走线。
timeout_unit_days=天
timeout_unit_hours=小时
timeout_unit_minutes=分钟
timeout_unit_weeks=周
title=自动布线器设置
trace_costs_on_layer=按层的走线代价
trace_costs_on_layer_tooltip=配置每个板层的扩展代价修正。
vertical=垂直
via_costs=过孔代价：
via_costs_tooltip=使用过孔切换铜层的代价。数值越高，自动布线器越倾向于保持在当前层布线。
vias_allowed=允许使用过孔：
vias_allowed_tooltip=允许自动布线器通过放置过孔来进行换层。
