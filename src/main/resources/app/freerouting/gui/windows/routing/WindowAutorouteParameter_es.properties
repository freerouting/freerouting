active=Activa
active_tooltip=Permite que el enrutador automático enrute pistas en esta capa.
against_preferred_direction=Contra la dirección preferida
against_preferred_direction_tooltip=Coste de enrutar una pista de cobre contra la dirección preferida. Un coste mayor desaconseja el enrutado en esta capa en la dirección perpendicular.
apply_values_note=Haz clic en Aplicar para usar los valores actuales.
autoroute=Enrutado automático
autoroute_tooltip=Durante la etapa de enrutado automático, el enrutador automático establece conexiones eléctricas mediante la colocación de pistas y vías.
bend_cost=Coste de curvatura
bend_cost_tooltip=Penalización por curvatura por capa que se añade al coste de expansión cada vez que el enrutador cambia de dirección en esta capa. Rango válido: 0.0 (sin penalización; por defecto) a 9.9 (desaconseja fuertemente las curvaturas). Defina un valor alto en una capa de una sola cara o con puentes de hilo para favorecer las pistas rectas.
detail_autoroute_parameter=Ajustes avanzados del enrutador automático
detail_parameter=Ajustes avanzados
fanout=Abanico de pistas
fanout_tooltip=La etapa de abanico de pistas crea vías iniciales y segmentos cortos de pista desde pads de componentes densos (como pads BGA) hacia otras capas del PCB.
fast=Rápido
horizontal=Horizontal
in_preferred_direction=En la dirección preferida
in_preferred_direction_tooltip=Coste de enrutar una pista de cobre en la dirección preferida de enrutado. Un coste menor fomenta el enrutado en esta capa en esa dirección.
job_timeout=Tiempo límite del trabajo:
job_timeout_tooltip=Establece el tiempo límite de enrutado. El valor máximo está limitado a cuatro semanas.
layer=Capa
layer_tooltip=Muestra las capas configuradas en la placa de enrutado.
max_passes=Pasadas máximas de enrutado:
max_passes_tooltip=Establece el número máximo de pasadas de enrutado. Usa 0 para sin límite.
max_threads=Subprocesos máximos de enrutado:
max_threads_tooltip=Número de subprocesos de enrutado. 1 usa un núcleo de CPU; valores más altos usan más núcleos, hasta el límite de este equipo.
optimization=Optimización
optimization_tooltip=Durante la etapa de optimización, se perfeccionan los trazados iniciales para mejorar el diseño general.
plane_via_costs=Coste de vía a plano de alimentación o masa:
plane_via_costs_tooltip=Coste de una vía utilizada cuando una red se conecta a un plano de alimentación o masa.
power_layer_tooltip=Desactivado porque esta no es una capa de señal y no se puede usar para el enrutado habitual de pistas de cobre.
preferred_direction=Dirección preferida de enrutado
preferred_direction_tooltip=Establece la dirección preferida de enrutado en esta capa como horizontal o vertical.
routing_stages=Etapas de enrutado:
routing_stages_tooltip=Selecciona las etapas de enrutado que se ejecutarán durante la tarea.
slow=Lento
speed=Velocidad:
start_pass=Pasada inicial:
start_ripup_costs=Coste inicial de deshacer pistas:
start_ripup_costs_tooltip=Penalización inicial por eliminar pistas existentes. Los valores más altos hacen que el enrutador sea menos propenso a deshacer el trabajo existente.
timeout_unit_days=Días
timeout_unit_hours=Horas
timeout_unit_minutes=Minutos
timeout_unit_weeks=Semanas
title=Ajustes del enrutador automático
trace_costs_on_layer=Costes de pista por capa
trace_costs_on_layer_tooltip=Configura los modificadores de coste de expansión para cada capa de la placa.
vertical=Vertical
via_costs=Costes de vía:
via_costs_tooltip=Coste de cambiar de capa con una vía. Los valores más altos mantienen el enrutador en la capa actual durante más tiempo.
vias_allowed=Vías permitidas:
vias_allowed_tooltip=Permite que el enrutador automático cambie de capa mediante la colocación de vías.
