active=Activa
active_tooltip=Permet a l'encaminador automàtic encaminar pistes en aquesta capa.
against_preferred_direction=Contra la direcció preferida
against_preferred_direction_tooltip=Cost d'encaminar una pista contra la direcció preferida. Un cost més alt desincentiva l'encaminament en aquesta capa en la direcció perpendicular.
apply_values_note=Feu clic a Aplica per utilitzar els valors actuals.
autoroute=Encaminament automàtic
autoroute_tooltip=Durant l'etapa d'encaminament automàtic, l'encaminador automàtic estableix connexions elèctriques col·locant pistes i vies.
bend_cost=Cost de curvatura
bend_cost_tooltip=Penalització de curvatura per capa afegida al cost d'expansió cada vegada que l'encaminador canvia de direcció en aquesta capa. Interval vàlid: de 0.0 (sense penalització; per defecte) a 9.9 (desaconsella fortament les curvatures). Establiu un valor alt en una capa d'una sola cara o de pont de fil per afavorir les pistes rectes.
detail_autoroute_parameter=Paràmetres avançats de l'encaminador automàtic
detail_parameter=Paràmetres avançats
fanout=Escapament
fanout_tooltip=L'etapa d'escapament crea vies inicials i segments curts de pista des de coixinets de components densos (com ara coixinets BGA) cap a altres capes de la placa.
fast=Ràpid
horizontal=Horitzontal
in_preferred_direction=En la direcció preferida
in_preferred_direction_tooltip=Cost d'encaminar una pista en la direcció preferida. Un cost més baix afavoreix l'encaminament en aquesta capa en aquesta direcció.
job_timeout=Temps límit de la tasca:
job_timeout_tooltip=Establiu el temps límit d'encaminament. El valor està limitat a un màxim de quatre setmanes.
layer=Capa
layer_tooltip=Llista les capes configurades a la placa d'encaminament.
max_passes=Passades màximes d'encaminament:
max_passes_tooltip=Defineix el nombre màxim de passades d'encaminament. Utilitzeu 0 per a sense límit.
max_threads=Fils màxims d'encaminament:
max_threads_tooltip=Nombre de fils d'encaminament. 1 utilitza un nucli de CPU; els valors més alts utilitzen més nuclis, fins al límit d'aquesta màquina.
optimization=Optimització
optimization_tooltip=Durant l'etapa d'optimització, es refinen els encaminaments inicials per millorar el disseny general.
plane_via_costs=Cost de via cap a pla d'alimentació o massa:
plane_via_costs_tooltip=Cost d'una via utilitzada quan una xarxa es connecta a un pla d'alimentació o massa.
power_layer_tooltip=Desactivat perquè aquesta no és una capa de senyal i no es pot utilitzar per a l'encaminament de pistes habitual.
preferred_direction=Direcció preferida
preferred_direction_tooltip=Establiu la direcció preferida d'encaminament de les pistes en aquesta capa com a horitzontal o vertical.
routing_stages=Etapes d'encaminament:
routing_stages_tooltip=Selecciona les etapes d'encaminament que s'executaran durant la tasca.
slow=Lent
speed=Velocitat:
start_pass=Passada inicial:
start_ripup_costs=Cost inicial de treure pistes:
start_ripup_costs_tooltip=Penalització inicial per retirar pistes existents. Els valors més alts fan que l'encaminador sigui menys propens a desfer la feina existent.
timeout_unit_days=Dies
timeout_unit_hours=Hores
timeout_unit_minutes=Minuts
timeout_unit_weeks=Setmanes
title=Paràmetres de l'encaminador automàtic
trace_costs_on_layer=Costos de pista per capa
trace_costs_on_layer_tooltip=Configura els modificadors del cost d'expansió per a cada capa de la placa.
vertical=Vertical
via_costs=Costos de via:
via_costs_tooltip=Cost de canviar de capa amb una via. Els valors més alts fan que l'encaminador romangui més temps a la capa actual.
vias_allowed=Vies permeses:
vias_allowed_tooltip=Permet que l'encaminador automàtic canviï de capa col·locant vies.
