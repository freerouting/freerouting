pull_tight_region_tooltip=Le rayon autour du curseur à l’intérieur duquel les pistes sont redressées après chaque étape de routage. Les valeurs plus faibles limitent le nettoyage à une zone plus restreinte et sont plus rapides ; le maximum s’applique à l’ensemble de la carte.
pull_tight_region_tooltip_radius=Le rayon autour du curseur à l’intérieur duquel les pistes sont redressées après chaque étape de routage. Des valeurs plus petites limitent le nettoyage à une zone plus restreinte et sont plus rapides ; le maximum s’applique à toute la carte. Rayon actuel : {{value}}.
pull_tight_region_tooltip_whole_board=Le rayon autour du curseur à l'intérieur duquel les pistes sont redressées après chaque étape de routage. Des valeurs plus petites limitent le nettoyage à une zone plus restreinte et sont plus rapides ; le maximum s'applique à l'ensemble de la carte. Rayon actuel : carte entière (sans limite).
