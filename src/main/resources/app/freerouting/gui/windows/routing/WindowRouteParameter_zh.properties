45_degree=45 度
45_degree_tooltip=将交互布线的走线拐角限制为 45 度角。
90_degree=90 度
90_degree_tooltip=将交互布线的走线拐角限制为 90 度角。
automatic=自动
automatic_neckdown=自动颈缩
automatic_neckdown_tooltip=启用后，当进入宽度小于当前走线宽度的引脚时，走线宽度会自动减小。
automatic_tooltip=使用网络设置中定义的布线规则。
change_snap_angle_45=捕捉角度为 45° 时，无法完全支持具有任意角度的现有走线。仍要更改捕捉角度吗？
change_snap_angle_90=切换到 90° 吸附角度时才完全支持正交走线。仍要更改吸附角度吗？
clearance_compensation=间距补偿：
clearance_compensation_checkbox=间距补偿
clearance_compensation_checkbox_tooltip=在布线过程中应用额外的间距补偿。
clearance_compensation_checkbox_tooltip_current=在布线过程中应用额外的间距补偿。当前补偿值：{{value}}。
clearance_compensation_tooltip=仅使用一种走线间距类型时，启用间距补偿可能会有所帮助。
detail_parameter=详细参数
drag_components_enabled=启用拖动元件
drag_components_enabled_tooltip=允许按住鼠标左键时拖动元件。
dynamic=动态
dynamic_tooltip=在移动鼠标时进行交互式布线。
highlight_routing_obstacle=高亮布线障碍区
highlight_routing_obstacle_tooltip=在动态布线中高亮显示当前布线障碍区。
ignore_conduction_areas=忽略导电区
ignore_conduction_areas_tooltip=启用后，布线期间导电区将被视为非障碍物。
keepout_outside_outline=板框外禁布区
keepout_outside_outline_tooltip=启用后，板框外的整个区域将被视为禁布区。
manual=手动
manual_tooltip=手动选择布线规则和走线宽度。
none=无
none_tooltip=允许交互布线时使用任意走线角度。
off=关闭
on=开启
pin_pad_to_turn_gap=焊盘到转弯间距：
pin_pad_to_turn_gap_tooltip=走线离开焊盘后在允许转弯前必须走过的最小距离。数值越高，限制越严格。
pin_pad_to_turn_gap_tooltip_current=走线在离开焊盘后转向前必须行走的最短距离。数值越高限制越强。当前值：{{value}}。
pull_tight_accuracy=拉直精度：
pull_tight_accuracy_tooltip=布线精度。较低的值速度较慢但更精确；较高的值速度较快但精度较低。
pull_tight_accuracy_tooltip_current=布线精度。较低的值速度较慢但更精确；较高的值速度较快但精度较低。当前值：{{value}}。
pull_tight_region=拉直半径：
pull_tight_region_tooltip=光标周围在每次布线步骤后对走线进行拉直的半径范围。较小的值会将整理限制在更小的区域且速度更快；最大值适用于整个电路板。
pull_tight_region_tooltip_radius=每次布线步骤后，光标周围走线被拉直的半径范围。较小的值会将清理限制在较小区域内且速度更快；最大值则适用于整块板。当前半径：{{value}}。
pull_tight_region_tooltip_whole_board=在每次布线步骤后将光标周围特定半径范围内的走线拉直。较小的值会将清理限制在更小区域内，处理速度更快；最大值则应用于整块板。当前半径：整块板（无限制）。
push&shove_enabled=启用推挤布线
push&shove_enabled_tooltip=允许交互布线推开已有走线（推挤布线）。
restrict_pin_exit_directions=限制引脚出线方向
restrict_pin_exit_directions_tooltip=启用后，矩形引脚的走线引出被限制在其短边。
route_mode=布线模式：
route_mode_tooltip=对固定网络进行布线时切换到缝合模式。
rule_selection=规则选择：
rule_selection_tooltip=选择手动布线规则或使用网络规则。
snap_angle=吸附角度：
snap_angle_tooltip=交互布线时限制走线角度。
stitching=缝合布线
