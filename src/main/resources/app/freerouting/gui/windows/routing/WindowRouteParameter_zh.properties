45_degree=45度
90_degree=90度
automatic=自动
automatic_neckdown=自动颈缩
automatic_neckdown_tooltip=若设置，当焊盘/引脚尺寸小于当前走线宽度时，走线宽度会自动减小。
automatic_tooltip=使用网络设置中定义的布线规则。
change_snap_angle_45=暂未完全支持 45° 吸附角下的任意角度走线。仍要更改吸附角吗？
change_snap_angle_90=目前仅完全支持 90° 吸附角的正交走线。仍要更改吸附角吗？
clearance_compensation=间距补偿：
clearance_compensation_checkbox=间距补偿
clearance_compensation_checkbox_tooltip=在布线期间应用额外的间距补偿。
clearance_compensation_checkbox_tooltip_current=在布线期间应用额外的间距补偿。当前补偿：{{value}}。
clearance_compensation_tooltip=当仅使用一种走线间距类型时，开启间距补偿可能会有所帮助。
detail_parameter=详细参数
drag_components_enabled=启用拖拽元件
drag_components_enabled_tooltip=允许按住鼠标左键拖拽元件。
dynamic=动态
dynamic_tooltip=移动鼠标时进行交互式布线。
highlight_routing_obstacle=高亮显示布线障碍物
highlight_routing_obstacle_tooltip=在动态布线过程中高亮显示当前的布线障碍物。
ignore_conduction_areas=忽略导电区 / 铺铜
ignore_conduction_areas_tooltip=若设置，导电区 / 铺铜将不被视为布线障碍物。
keepout_outside_outline=板框外禁布区
keepout_outside_outline_tooltip=如果启用，板框外的整个区域都将成为禁布区。
manual=手动
manual_tooltip=手动选择布线规则和走线宽度。
none=无
off=关闭
on=开启
pin_pad_to_turn_gap=焊盘到拐角间距：
pin_pad_to_turn_gap_tooltip=走线离开焊盘后允许拐角前的最小距离。数值越高限制越严格。
pin_pad_to_turn_gap_tooltip_current=走线离开焊盘后允许拐角前的最小距离。数值越高限制越严格。当前值：{{value}}。
pull_tight_accuracy=拉直精度：
pull_tight_accuracy_tooltip=布线精度。较小的值速度较慢但更精确；较大的值速度较快但精度较低。
pull_tight_accuracy_tooltip_current=布线精度。较小的值速度较慢但更精确；较大的值速度较快但精度较低。当前值：{{value}}。
pull_tight_region=拉直半径：
pull_tight_region_tooltip=每次布线步骤后光标周围进行走线拉直整理的距离半径。较小的数值会将整理限制在较小区域并提高速度；滑动到最大值可作用于全板。
pull_tight_region_tooltip_radius=每次布线步骤后光标周围进行走线拉直整理的距离半径。较小的数值会将整理限制在较小区域并提高速度；滑动到最大值可作用于全板。当前半径：{{value}}。
pull_tight_region_tooltip_whole_board=每次布线步骤后光标周围进行走线拉直整理的距离半径。较小的数值会将整理限制在较小区域并提高速度；滑动到最大值可作用于全板。当前半径：全板（无限制）。
push&shove_enabled=启用推挤布线
push&shove_enabled_tooltip=允许推挤障碍物。
restrict_pin_exit_directions=限制引脚出线方向
restrict_pin_exit_directions_tooltip=选中后，矩形引脚的走线出线方向将被限制在短边侧。
route_mode=布线模式：
route_mode_tooltip=针对固定网络切换至缝合模式。
rule_selection=规则选择：
rule_selection_tooltip=选择手动布线规则或使用网络规则。
snap_angle=吸附角度：
snap_angle_tooltip=在交互式布线期间限制走线角度。
stitching=缝合
stitching_tooltip=点击以放置拐角并手动缝合走线。
title=布线设置
via_snap_to_smd_center=过孔吸附至 SMD（表面贴装）中心
via_snap_to_smd_center_tooltip=若设置，连接 SMD（表面贴装）引脚的过孔将自动吸附至引脚中心。
