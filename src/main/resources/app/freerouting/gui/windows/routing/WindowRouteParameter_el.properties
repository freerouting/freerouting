pin_pad_to_turn_gap=Απόσταση επιθέματος–στροφής:
pin_pad_to_turn_gap_tooltip=Ελάχιστη απόσταση που πρέπει να διανύσει ένας χάλκινος διάδρομος αφού φύγει από ένα επίθεμα πριν μπορέσει να στρίψει. Οι υψηλότερες τιμές είναι πιο περιοριστικές.
pin_pad_to_turn_gap_tooltip_current=Ελάχιστη απόσταση που πρέπει να διανύσει ένας χάλκινος διάδρομος αφού φύγει από ένα επίθεμα πριν στρίψει. Οι υψηλότερες τιμές είναι πιο περιοριστικές. Τρέχουσα τιμή: {{value}}.
pull_tight_accuracy=Ακρίβεια τεντώματος:
pull_tight_accuracy_tooltip=Ακρίβεια δρομολόγησης. Οι χαμηλότερες τιμές είναι πιο αργές αλλά πιο ακριβείς· οι υψηλότερες τιμές είναι πιο γρήγορες αλλά λιγότερο ακριβείς.
pull_tight_accuracy_tooltip_current=Ακρίβεια δρομολόγησης. Οι χαμηλότερες τιμές είναι πιο αργές αλλά πιο ακριβείς· οι υψηλότερες τιμές είναι πιο γρήγορες αλλά λιγότερο ακριβείς. Τρέχουσα τιμή: {{value}}.
pull_tight_region=Ακτίνα τεντώματος:
pull_tight_region_tooltip=Η ακτίνα γύρω από τον κέρσορα εντός της οποίας οι χάλκινοι διάδρομοι ευθυγραμμίζονται μετά από κάθε βήμα δρομολόγησης. Μικρότερες τιμές περιορίζουν τον καθαρισμό σε μικρότερη περιοχή και είναι ταχύτερες· η μέγιστη τιμή εφαρμόζεται σε ολόκληρη την πλακέτα.
pull_tight_region_tooltip_radius=Η ακτίνα γύρω από τον κέρσορα εντός της οποίας οι χάλκινοι διάδρομοι ευθυγραμμίζονται μετά από κάθε βήμα δρομολόγησης. Μικρότερες τιμές περιορίζουν τον καθαρισμό σε μικρότερη περιοχή και είναι ταχύτερες· η μέγιστη τιμή εφαρμόζεται σε ολόκληρη την πλακέτα. Τρέχουσα ακτίνα: {{value}}.
pull_tight_region_tooltip_whole_board=Η ακτίνα γύρω από τον κέρσορα εντός της οποίας οι χάλκινοι διάδρομοι ευθυγραμμίζονται μετά από κάθε βήμα δρομολόγησης. Μικρότερες τιμές περιορίζουν τον καθαρισμό σε μικρότερη περιοχή και είναι ταχύτερες· το μέγιστο ισχύει για ολόκληρη την πλακέτα. Τρέχουσα ακτίνα: ολόκληρη η πλακέτα (χωρίς όριο).
