active=有効
active_tooltip=オートルーターがこのレイヤーでトレースを自動配線できるようにします。
against_preferred_direction=優先方向に対して
against_preferred_direction_tooltip=優先方向に対して直交してトレースを配線するコストです。コストを高くすると、このレイヤーでの垂直方向の配線が抑制されます。
apply_values_note=現在の値を使用するには「適用」をクリックしてください。
autoroute=自動配線する
autoroute_tooltip=自動配線段階では、オートルーターがトレースとビアを配置して電気的接続を確立します。
bend_cost=ベンドコスト
bend_cost_tooltip=このレイヤーでルーターが方向転換するたびに拡張コストに追加されるレイヤーごとのベンドペナルティ。有効範囲: 0.0 (ペナルティなし、デフォルト) ～ 9.9 (ベンドを強く抑制)。片面基板やジャンパー線レイヤーで高い値を設定すると直線的なトレースが優先されます。
detail_autoroute_parameter=オートルーター詳細設定
detail_parameter=詳細設定
fanout=ファンアウト
fanout_tooltip=ファンアウト段階では、高密度部品のパッド（BGAパッドなど）から他のレイヤーへ初期ビアと短いトレース区間を作成します。
fast=高速
horizontal=水平
in_preferred_direction=優先配線方向
in_preferred_direction_tooltip=優先配線方向にトレースを配線するコストです。コストを低くすると、このレイヤーでのその方向への配線が促進されます。
job_timeout=ジョブタイムアウト:
job_timeout_tooltip=配線のタイムアウトを設定します。値の上限は4週間です。
layer=レイヤー
layer_tooltip=配線基板上に設定されているレイヤーを一覧表示します。
max_passes=最大配線パス数:
max_passes_tooltip=配線パスの最大数を設定します。無制限にするには0を使用します。
max_threads=最大配線スレッド数:
max_threads_tooltip=配線スレッドの数です。1の場合は1つのCPUコアを使用し、大きい値にするとこのマシンの上限までより多くのコアを使用します。
optimization=最適化
optimization_tooltip=最適化段階では、全体的な設計を改善するために初期配線を整理・短縮します。
plane_via_costs=プレーンビアコスト:
plane_via_costs_tooltip=ネットが電源プレーンまたはグラウンドプレーンに接続する際に使用されるビアのコストです。
power_layer_tooltip=シグナル層ではないため無効です。通常のトレース配線には使用できません。
preferred_direction=優先配線方向
preferred_direction_tooltip=このレイヤーでの優先配線方向を水平または垂直に設定します。
routing_stages=配線ステージ:
routing_stages_tooltip=ジョブ中に実行する配線段階を選択します。
slow=低速
speed=速度:
start_pass=開始パス:
start_ripup_costs=リップアップ開始コスト:
start_ripup_costs_tooltip=既存のトレースをリップアップする際の初期ペナルティです。値が高いほど、オートルーターは既存の配線を解除しにくくなります。
timeout_unit_days=日
timeout_unit_hours=時間
timeout_unit_minutes=分
timeout_unit_weeks=週
title=オートルーター設定
trace_costs_on_layer=レイヤーごとのトレースコスト
trace_costs_on_layer_tooltip=各基板レイヤーの拡張コストの補正値を設定します。
vertical=垂直
via_costs=ビアコスト:
via_costs_tooltip=ビアでレイヤーを変更する際のコストです。値が高いほど、オートルーターは現在のレイヤーに留まろうとします。
vias_allowed=ビアの許可:
vias_allowed_tooltip=オートルーターがビアを配置してレイヤーを変更することを許可します。
