pull_tight_region_tooltip_whole_board=Радіус навколо курсора, у межах якого доріжки вирівнюються після кожного кроку трасування. Менші значення обмежують очищення меншою областю та працюють швидше; максимум застосовується до всієї плати. Поточний радіус: уся плата (без обмежень).
