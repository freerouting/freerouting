active=सक्रिय
active_tooltip=ऑटोराउटर को इस परत पर ट्रेस स्वचालित रूट करने के लिए सक्षम करें।
against_preferred_direction=पसंदीदा दिशा के विपरीत
against_preferred_direction_tooltip=पसंदीदा दिशा के विपरीत ट्रेस रूट करने की लागत। अधिक लागत इस परत पर लंबवत दिशा में रूटिंग को हतोत्साहित करती है।
apply_values_note=वर्तमान मानों का उपयोग करने के लिए लागू करें पर क्लिक करें।
autoroute=स्वचालित रूटिंग
autoroute_tooltip=स्वचालित रूटिंग चरण के दौरान, ऑटोराउटर ट्रेस और विया रखकर विद्युत कनेक्शन स्थापित करता है।
bend_cost=मोड़ लागत
bend_cost_tooltip=जब भी राउटर इस परत पर दिशा बदलता है, तो विस्तार लागत में प्रति-परत मोड़ दंड जोड़ा जाता है। मान्य सीमा: 0.0 (कोई दंड नहीं; डिफ़ॉल्ट) से 9.9 (मोड़ को दृढ़ता से हतोत्साहित करता है)। सीधे ट्रेस को प्राथमिकता देने के लिए एकतरफा या जंप तार की परत पर उच्च मान सेट करें।
detail_autoroute_parameter=उन्नत ऑटोराउटर सेटिंग्स
detail_parameter=उन्नत सेटिंग्स
fanout=फैनआउट
fanout_tooltip=फैनआउट चरण सघन-घटक पैड (जैसे BGA पैड) से अन्य PCB परतों तक शुरुआती विया और छोटे ट्रेस खंड बनाता है।
fast=तेज़
horizontal=क्षैतिज
in_preferred_direction=पसंदीदा दिशा में
in_preferred_direction_tooltip=पसंदीदा दिशा में ट्रेस रूट करने की लागत। कम लागत इस परत पर उस दिशा में रूटिंग को बढ़ावा देती है।
job_timeout=जॉब समय-सीमा:
job_timeout_tooltip=रूटिंग समय-सीमा निर्धारित करें। अधिकतम मान चार सप्ताह तक सीमित है।
layer=परत
layer_tooltip=रूटिंग बोर्ड पर कॉन्फ़िगर की गई परतों की सूची दिखाता है।
max_passes=अधिकतम पास:
max_passes_tooltip=रूटिंग पास की अधिकतम संख्या सेट करें। बिना किसी सीमा के लिए 0 का उपयोग करें।
max_threads=अधिकतम रूटिंग थ्रेड्स:
max_threads_tooltip=रूटिंग थ्रेड्स की संख्या। 1 एक CPU कोर का उपयोग करता है; उच्च मान इस मशीन की सीमा तक अधिक कोर का उपयोग करते हैं।
optimization=अनुकूलन
optimization_tooltip=अनुकूलन चरण के दौरान, समग्र डिज़ाइन में सुधार करने के लिए शुरुआती रूट को परिष्कृत किया जाता है।
plane_via_costs=पावर या ग्राउंड प्लेन विया लागत:
plane_via_costs_tooltip=नेट को पावर या ग्राउंड प्लेन से कनेक्ट करते समय उपयोग की जाने वाली विया की लागत।
power_layer_tooltip=अक्षम है क्योंकि यह सिग्नल परत नहीं है और इसका उपयोग सामान्य ट्रेस रूटिंग के लिए नहीं किया जा सकता है।
preferred_direction=पसंदीदा रूटिंग दिशा
preferred_direction_tooltip=इस परत पर पसंदीदा रूटिंग दिशा को क्षैतिज या ऊर्ध्वाधर पर सेट करें।
routing_stages=रूटिंग चरण:
routing_stages_tooltip=कार्य के दौरान चलाने के लिए रूटिंग चरणों का चयन करें।
slow=धीमा
speed=गति:
start_pass=आरंभ पास:
start_ripup_costs=उखाड़ने की आरंभ लागत:
start_ripup_costs_tooltip=मौजूदा ट्रेस को उखाड़ने का प्रारंभिक दंड। उच्च मान ऑटोराउटर द्वारा मौजूदा कार्य को पूर्ववत करने की संभावना कम करते हैं।
timeout_unit_days=दिन
timeout_unit_hours=घंटे
timeout_unit_minutes=मिनट
timeout_unit_weeks=सप्ताह
title=ऑटोराउटर सेटिंग्स
trace_costs_on_layer=परत के अनुसार ट्रेस लागत
trace_costs_on_layer_tooltip=प्रत्येक बोर्ड परत के लिए विस्तार लागत संशोधक कॉन्फ़िगर करें।
vertical=ऊर्ध्वाधर
via_costs=विया लागत:
via_costs_tooltip=विया के साथ परत बदलने की लागत। उच्च मान ऑटोराउटर को वर्तमान परत पर अधिक समय तक बनाए रखते हैं।
vias_allowed=अनुमत विया:
vias_allowed_tooltip=ऑटोराउटर को विया रखकर परतें बदलने की अनुमति दें।
