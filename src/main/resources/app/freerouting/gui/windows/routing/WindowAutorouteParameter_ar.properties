max_passes=الحد الأقصى لتمريرات التوجيه:
max_passes_tooltip=تعيين الحد الأقصى لعدد تمريرات التوجيه. استخدم 0 لعدم وجود حد.
max_threads=الحد الأقصى لخيوط معالجة التوجيه:
max_threads_tooltip=عدد خيوط معالجة التوجيه. القيمة 1 تستخدم نواة معالج واحدة؛ القيم الأعلى تستخدم نوى أكثر، حتى الحد الأقصى لهذا الجهاز.
optimization=التحسين
