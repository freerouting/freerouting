bend_cost=تكلفة الانحناء
bend_cost_tooltip=عقوبة انحناء لكل طبقة تُضاف إلى تكلفة التوسع في كل مرة يغير فيها الموجه الاتجاه على هذه الطبقة. النطاق الصالح: 0.0 (بدون عقوبة؛ الافتراضي) إلى 9.9 (يمنع الانحناءات بشدة). اضبط قيمة عالية على طبقة أحادية الوجه أو طبقة سلك قفز لتفضيل المسارات النحاسية المستقيمة.
detail_autoroute_parameter=إعدادات المُوجّه التلقائي المتقدمة
detail_parameter=إعدادات متقدمة
fanout=تفريع المسارات
fanout_tooltip=تُنشئ مرحلة تفريع المسارات فتحات فيا أولية وأجزاء مسار نحاسي قصيرة من وسادات المكوّنات الكثيفة (مثل وسادات BGA) إلى طبقات PCB الأخرى.
fast=سريع
horizontal=أفقي
in_preferred_direction=في الاتجاه المفضل
in_preferred_direction_tooltip=تكلفة توجيه مسار نحاسي في اتجاه التوجيه المفضل. التكلفة الأقل تشجع على التوجيه في هذه الطبقة بذلك الاتجاه.
job_timeout=مهلة المهمة:
job_timeout_tooltip=تعيين مهلة التوجيه. الحد الأقصى للقيمة هو أربعة أسابيع.
layer=الطبقة
