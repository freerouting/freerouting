active=نشط
active_tooltip=تمكين المُوجّه التلقائي من توجيه المسارات النحاسية على هذه الطبقة.
against_preferred_direction=عكس الاتجاه المفضل
against_preferred_direction_tooltip=تكلفة توجيه مسار نحاسي عكس الاتجاه المفضل. التكلفة الأعلى تثبط التوجيه في هذه الطبقة بالاتجاه المتعامد.
apply_values_note=انقر فوق تطبيق لاستخدام القيم الحالية.
autoroute=التوجيه التلقائي
