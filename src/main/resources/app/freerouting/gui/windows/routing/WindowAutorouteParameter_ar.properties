power_layer_tooltip=معطّل لأن هذه ليست طبقة إشارة ولا يمكن استخدامها لتوجيه مسار نحاسي عادي.
preferred_direction=اتجاه التوجيه المفضل
preferred_direction_tooltip=تعيين اتجاه التوجيه المفضل للمسار النحاسي على هذه الطبقة إلى أفقي أو عمودي.
routing_stages=مراحل التوجيه:
routing_stages_tooltip=حدد مراحل التوجيه المراد تشغيلها أثناء المهمة.
slow=بطيء
speed=السرعة:
