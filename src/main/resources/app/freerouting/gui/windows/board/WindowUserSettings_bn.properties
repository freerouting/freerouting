allow_contact=<html><div style='width: 380px;'>আপনার সম্মুখীন হওয়া সমস্যা এবং নতুন কোনো বৈশিষ্ট্য দেখতে চাইলে সে সম্পর্কে <strong>আমাদের আপনার সাথে যোগাযোগ করার অনুমতি দিন</strong>।</div></html>
