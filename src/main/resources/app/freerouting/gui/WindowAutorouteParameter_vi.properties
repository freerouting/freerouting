autoroute_tooltip=Trong giai đoạn định tuyến, bộ định tuyến tự động sẽ tự động thiết lập các kết nối điện giữa các linh kiện khác nhau bằng cách đặt các đường đồng trên bo mạch.
bend_cost=Chi phí gập
bend_cost_tooltip=Hình phạt gập trên mỗi lớp được cộng vào chi phí mở rộng mỗi khi bộ định tuyến đổi hướng trên lớp này. Khoảng hợp lệ: 0.0 (không phạt, mặc định) đến 9.9 (hạn chế mạnh việc gập). Hãy đặt giá trị cao trên lớp một mặt hoặc lớp cầu nhảy để ưu tiên các đường đồng thẳng.
