max_threads=Số luồng tối đa:
max_threads_tooltip=Số luồng định tuyến. 1 sử dụng một nhân CPU; các giá trị cao hơn sẽ sử dụng nhiều nhân hơn, tối đa theo giới hạn của máy tính này.
