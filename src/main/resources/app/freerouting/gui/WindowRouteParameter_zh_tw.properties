clearance_compensation_tooltip=當您僅使用一種走線間距類型時，開啟間距補償可能有所幫助。
detail_parameter=詳細參數
drag_components_enabled=啟用拖曳元件
drag_components_enabled_tooltip=啟用按住滑鼠左鍵拖曳元件的功能。
dynamic=動態
dynamic_tooltip=隨著滑鼠移動進行互動式佈線。
highlight_routing_obstacle=高亮顯示佈線障礙物
highlight_routing_obstacle_tooltip=在動態佈線時高亮顯示當前的佈線障礙物。
ignore_conduction_areas=忽略導電區
ignore_conduction_areas_tooltip=若勾選，導電區將不會被視為佈線障礙物。
