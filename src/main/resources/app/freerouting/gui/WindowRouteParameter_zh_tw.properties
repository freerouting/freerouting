restrict_pin_exit_directions_tooltip=若勾選，矩形引腳的走線引出方向將被限制在短邊。
route_mode=佈線模式：
route_mode_tooltip=切換至固定網路（shove fixed）的縫合模式。
rule_selection=規則選擇：
rule_selection_tooltip=選擇手動佈線規則或使用網路規則。
snap_angle=對齊角度：
snap_angle_tooltip=在互動式佈線期間限制走線角度。
