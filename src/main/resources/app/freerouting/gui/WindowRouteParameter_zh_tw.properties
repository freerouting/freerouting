automatic_tooltip=使用網路設定中定義的佈線規則。
change_snap_angle_45=尚不完全支援吸附角度為 45° 的任意角度走線。確定仍要變更吸附角度？
change_snap_angle_90=僅完全支援吸附角度為 90° 的正交走線。確定仍要變更吸附角度？
clearance_compensation=間距補償：
clearance_compensation_checkbox=間距補償
clearance_compensation_checkbox_tooltip=佈線期間套用額外的間距補償。
