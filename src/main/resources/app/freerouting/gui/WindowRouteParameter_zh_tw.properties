none=無
off=關閉
on=開啟
pin_pad_to_turn_gap=焊盤轉彎間距：
pin_pad_to_turn_gap_tooltip=走線離開焊盤後到允許轉彎的距離。數值越高限制越嚴格。
pin_pad_to_turn_gap_tooltip_current=走線離開焊盤後到允許轉彎的距離。數值越高限制越嚴格。目前數值：{{value}}。
pull_tight_accuracy=拉直精度：
pull_tight_accuracy_tooltip=佈線精度。數值越低速度越慢但精度更高；數值越高速度越快但精度較低。
pull_tight_accuracy_tooltip_current=佈線精度。數值越低速度越慢但精度更高；數值越高速度越快但精度較低。當前值：{{value}}。
pull_tight_region=拉直半徑：
pull_tight_region_tooltip=每次佈線步驟後拉直走線的光標周圍距離。較小的數值會將整理範圍限制在較小區域，速度也更快；滑動至最大值可應用於整塊板子。
pull_tight_region_tooltip_radius=每次佈線步驟後拉直走線的光標周圍距離。較小的數值會將整理範圍限制在較小區域，速度也更快；滑動至最大值可應用於整塊板子。目前半徑：{{value}}。
pull_tight_region_tooltip_whole_board=每次佈線步驟後拉直走線的光標周圍距離。較小的數值會將整理範圍限制在較小區域，速度也更快；滑動至最大值可應用於整塊板子。目前半徑：整塊板子（無限制）。
push&shove_enabled=啟用推擠佈線
