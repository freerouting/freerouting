max_passes=Максимум проходов:
max_passes_tooltip=Максимальное количество проходов трассировки. Используйте 0 для снятия ограничений.
max_threads=Максимум потоков:
max_threads_tooltip=Количество потоков трассировки. Значение 1 использует одно ядро ЦП; более высокие значения задействуют больше ядер, вплоть до лимита данной машины.
optimization=Оптимизация
optimization_tooltip=На этапе оптимизации исходная трассировка улучшается для повышения общего качества проекта.
