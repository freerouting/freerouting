bend_cost=Стоимость изгиба
bend_cost_tooltip=Штраф за изгиб на слое, добавляемый к стоимости расширения каждый раз, когда автотрассировщик меняет направление на этом слое. Допустимый диапазон: от 0.0 (без штрафа, по умолчанию) до 9.9 (сильно препятствует изгибам). Установите высокое значение для одностороннего слоя или слоя с перемычками, чтобы отдать предпочтение прямым дорожкам.
detail_autoroute_parameter=Расширенные настройки автотрассировщика
detail_parameter=Расширенные настройки
fanout=Вывод дорожек (Fanout)
fanout_tooltip=Этап вывода дорожек из плотных площадок (fanout) включает создание начальных vias и коротких отрезков дорожек от площадок плотных компонентов (таких как BGA) к другим слоям платы.
fast=Быстро
horizontal=Горизонтально
in_preferred_direction=В предпочтительном направлении
