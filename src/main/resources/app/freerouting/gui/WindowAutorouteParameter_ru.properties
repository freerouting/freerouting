active=Активен
active_tooltip=Установите этот флажок, чтобы разрешить автотрассировщику прокладывать дорожки на этом слое.
against_preferred_direction=Против предпочтительного направления
against_preferred_direction_tooltip=Стоимость трассировки медной дорожки против предпочтительного направления. Более высокая стоимость штрафует размещение медных дорожек перпендикулярно предпочтительному направлению.
apply_values_note=Нажмите «Применить», чтобы использовать текущие значения.
autoroute=Автотрассировка
