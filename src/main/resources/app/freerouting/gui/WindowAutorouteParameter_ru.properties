power_layer_tooltip=Отключено, так как это слой силовой плоскости и он не может использоваться для трассировки обычных медных дорожек.
preferred_direction=Предпочтительное направление
preferred_direction_tooltip=Задайте предпочтительное направление трассировки дорожек на этом слое: по вертикали или по горизонтали.
routing_stages=Этапы трассировки:
