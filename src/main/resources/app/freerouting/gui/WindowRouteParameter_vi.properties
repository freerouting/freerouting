pull_tight_accuracy=Độ chính xác kéo thẳng:
pull_tight_accuracy_tooltip=Độ chính xác định tuyến. Giá trị nhỏ hơn sẽ chậm hơn nhưng chính xác hơn; giá trị lớn hơn sẽ nhanh hơn nhưng kém chính xác hơn.
