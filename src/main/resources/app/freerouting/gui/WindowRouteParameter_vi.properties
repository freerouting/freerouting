pull_tight_region=Bán kính kéo thẳng:
pull_tight_region_tooltip=Khoảng cách xung quanh con trỏ mà tại đó các đường đồng được kéo thẳng sau mỗi bước định tuyến. Giá trị nhỏ hơn sẽ giới hạn việc làm sạch trong một vùng nhỏ hơn và nhanh hơn; trượt đến tối đa cho toàn bộ bo mạch.
pull_tight_region_tooltip_radius=Khoảng cách xung quanh con trỏ nơi các đường đồng được kéo thẳng sau mỗi bước định tuyến. Giá trị nhỏ hơn sẽ giới hạn việc dọn dẹp trong vùng nhỏ hơn và nhanh hơn; trượt đến tối đa cho toàn bộ bo mạch. Bán kính hiện tại: {{value}}.
pull_tight_region_tooltip_whole_board=Khoảng cách quanh con trỏ chuột nơi các đường đồng được kéo thẳng sau mỗi bước định tuyến. Giá trị nhỏ hơn sẽ giới hạn việc dọn dẹp trong một vùng nhỏ hơn và nhanh hơn; trượt đến tối đa cho toàn bộ bo mạch. Bán kính hiện tại: toàn bộ bo mạch (không giới hạn).
