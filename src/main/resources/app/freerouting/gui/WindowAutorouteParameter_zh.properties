active=启用
active_tooltip=勾选此复选框以允许自动布线器在该层上进行走线布线。
against_preferred_direction=逆优先方向
against_preferred_direction_tooltip=逆优先布线方向走线的代价。代价越高越惩罚垂直于优先布线方向放置走线。
algorithm=算法
algorithm_current=Current（默认）
algorithm_tooltip=选择布线引擎。Current 使用现代实现算法；v1.9 为旧版对比算法路径。
algorithm_v19=v1.9（旧版）
apply_values_note=点击“应用”以使用当前值。
autoroute=自动布线
autoroute_tooltip=在布线阶段，自动布线器通过在 PCB 上放置走线，自动建立各个元件之间的电气连接。
bend_cost=转弯代价
bend_cost_tooltip=自动布线器在此层改变方向时加到扩展代价上的单层转弯惩罚。有效范围：0.0（无惩罚，默认）至 9.9（强烈抑制转弯）。单层板或跳线层宜设为较高值，以优先保持直线走线。
detail_autoroute_parameter=自动布线器高级设置
detail_parameter=高级设置
fanout=扇出
fanout_tooltip=扇出阶段包括从密集元件（如 BGA）的焊盘引出初始过孔和短走线段至 PCB 的其他层。
fast=快
horizontal=水平
in_preferred_direction=顺优先方向
in_preferred_direction_tooltip=沿优先布线方向走线的代价。代价越低越倾向于在该层沿此方向放置走线。
job_timeout=超时时间：
job_timeout_tooltip=以小时、分钟和秒为单位的布线超时时间。最大值限制为 24 小时。
layer=层
layer_tooltip=布线板中配置的图层列表。
max_passes=最大 Pass 数：
max_passes_tooltip=最大布线轮次。设为 0 表示不限制。
max_threads=最大线程数：
max_threads_tooltip=布线线程数量。1 表示使用单个 CPU 核心；较高的值将使用更多核心，上限为本机的核心数。
optimization=优化
optimization_tooltip=在优化阶段，将对初始布线结果进行精细化调整，以改善整体设计。
plane_via_costs=电源平面过孔代价：
plane_via_costs_tooltip=网络连接到电源平面或地平面时的过孔代价。
power_layer_tooltip=已禁用，因为这是平面层，不能用于对常规走线进行布线。
preferred_direction=优先布线方向
preferred_direction_tooltip=将该层上走线的优先布线方向设置为垂直或水平。
routing_stages=布线阶段：
routing_stages_tooltip=选择在该任务期间要运行的布线阶段。
slow=慢
speed=速度：
start_pass=起始 Pass：
start_ripup_costs=初始拆线代价：
start_ripup_costs_tooltip=拆除现有走线的初始惩罚值。更高的值会让自动布线器不太倾向于撤销已完成的布线。
title=自动布线器设置
trace_costs_on_layer=走线代价
trace_costs_on_layer_tooltip=配置各个板层上的扩展代价修饰符。
vertical=垂直
via_costs=过孔代价：
via_costs_tooltip=切换图层时使用过孔的代价。更高的值会让自动布线器尽量在当前层延长走线。
vias_allowed=允许过孔：
