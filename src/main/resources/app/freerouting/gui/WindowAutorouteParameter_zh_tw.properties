active=啟用
active_tooltip=勾選此核取方塊以允許自動佈線器在此層上佈線。
against_preferred_direction=逆優先佈線方向
against_preferred_direction_tooltip=逆著優先佈線方向進行走線的代價。較高的代價會懲罰與優先佈線方向垂直的走線放置。
algorithm=演算法
algorithm_current=Current（預設）
algorithm_tooltip=選擇佈線引擎。「Current」使用現代實作；「v1.9」為舊版對照路徑。
algorithm_v19=v1.9（舊版）
apply_values_note=按一下「套用」以使用目前的值。
autoroute=自動佈線
autoroute_tooltip=在佈線階段，自動佈線器會在 PCB 上放置走線，自動建立各個元件之間的電氣連接。
bend_cost=轉彎代價
bend_cost_tooltip=自動佈線器在此圖層改變方向時，每次新增至擴展代價的單層轉彎懲罰。有效範圍：0.0（無懲罰，預設）至 9.9（強烈不建議轉彎）。在單面層或跳線層上設定為較高值可優先產生直走線。
detail_autoroute_parameter=進階自動佈線器設定
detail_parameter=進階設定
fanout=扇出
fanout_tooltip=扇出階段包含從密集元件（例如 BGA）的焊盤建立初始過孔與短走線段至 PCB 的其他圖層。
fast=快速
horizontal=水平
in_preferred_direction=順優先佈線方向
in_preferred_direction_tooltip=沿著優先佈線方向進行走線的代價。較低的代價會鼓勵在此層放置走線。
job_timeout=逾時時間：
job_timeout_tooltip=以時、分、秒為單位的佈線逾時時間。最大值限制為 24 小時。
layer=層
layer_tooltip=佈線板中設定的圖層清單。
max_passes=最大 Pass 數：
max_passes_tooltip=最大佈線次數。使用 0 表示不限制。
max_threads=最大執行緒數：
max_threads_tooltip=佈線執行緒數量。1 表示使用單核 CPU；較高的數值會使用更多核心，上限為本機硬體限制。
optimization=最佳化
optimization_tooltip=在最佳化階段，會對初始佈線進行微調以改善整體設計。
plane_via_costs=電源平面過孔代價：
plane_via_costs_tooltip=網路連接到電源平面或地平面時的過孔代價。
power_layer_tooltip=已停用，因為這是電源平面層，無法用於一般的走線佈線。
preferred_direction=優先佈線方向
preferred_direction_tooltip=將此圖層上走線的優先佈線方向設定為垂直或水平。
routing_stages=佈線階段：
routing_stages_tooltip=選擇要在此作業期間運行的佈線階段。
slow=慢速
speed=速度：
start_pass=起始 Pass：
start_ripup_costs=起始拆線代價：
start_ripup_costs_tooltip=拆除現有走線的起始懲罰。較高的數值會降低自動佈線器撤銷已有成果的意願。
title=自動佈線器設定
trace_costs_on_layer=走線代價
trace_costs_on_layer_tooltip=設定每個板層上的擴展代價修正值。
vertical=垂直
via_costs=過孔代價：
via_costs_tooltip=切換圖層過孔的代價。較高的數值會讓自動佈線器在當前圖層保持更長距離。
vias_allowed=允許過孔：
