active=有効
active_tooltip=このチェックボックスをオンにすると、オートルーターがこのレイヤー上でトレースを配線できるようになります。
against_preferred_direction=優先配線方向に反する方向
against_preferred_direction_tooltip=優先配線方向と逆方向にトレースを配線するコスト。コストを高くすると、優先配線方向に垂直なトレース配置にペナルティが課されます。
apply_values_note=現在の設定値を使用するには「適用」をクリックします。
autoroute=自動配線
autoroute_tooltip=配線ステージでは、オートルーターがPCB上にトレースを配置することにより、さまざまなコンポーネント間の電気的接続を自動的に確立します。
bend_cost=ベンドコスト
bend_cost_tooltip=このレイヤー上でルーターが方向転換するたびに拡張コストへ追加されるレイヤー別ベンドペナルティ。有効範囲: 0.0 (ペナルティなし、デフォルト) から 9.9 (曲がりを強力に抑制)。片面基板やジャンパー線レイヤーで直線のトレースを優先したい場合は高い値に設定します。
detail_autoroute_parameter=オートルーター詳細設定
detail_parameter=詳細設定
fanout=ファンアウト
fanout_tooltip=ファンアウトステージでは、高密度コンポーネント（BGAなど）のパッドからPCBの他のレイヤーへ、初期ビアと短いトレースセグメントを作成します。
fast=高速
horizontal=水平
in_preferred_direction=優先配線方向
in_preferred_direction_tooltip=優先配線方向にトレースを配線するコスト。コストを低くすると、このレイヤーへのトレース配置が優先されます。
job_timeout=タイムアウト:
job_timeout_tooltip=時間、分、秒単位での配線タイムアウト。上限は24時間です。
layer=レイヤー
layer_tooltip=配線基板で設定されているレイヤーの一覧。
max_passes=最大パス数:
max_passes_tooltip=最大配線パス数。制限なしにする場合は0を使用します。
max_threads=最大スレッド数:
max_threads_tooltip=配線スレッドの数。1を設定すると1つのCPUコアを使用し、より大きい値を設定すると、このマシンの上限までより多くのコアを使用します。
optimization=最適化
optimization_tooltip=最適化ステージでは、初期配線が整理・洗練され、全体的な設計が改善されます。
plane_via_costs=パワープレーンビアコスト:
plane_via_costs_tooltip=ネットがパワープレーン / グランドプレーンに接続する際のビアコスト。
power_layer_tooltip=プレーン層であり、通常のトレースの配線には使用できないため無効になっています。
preferred_direction=優先配線方向
preferred_direction_tooltip=このレイヤー上のトレースの優先配線方向を垂直または水平に設定します。
routing_stages=配線ステージ:
routing_stages_tooltip=ジョブ中に実行する配線ステージを選択します。
slow=低速
speed=速度:
start_pass=開始パス:
start_ripup_costs=リップアップ初期コスト:
start_ripup_costs_tooltip=既存のトレースをリップアップする際の初期ペナルティ。値を大きくすると、ルーターは既存の配線のやり直しを抑制するようになります。
title=オートルーター設定
trace_costs_on_layer=トレースコスト
trace_costs_on_layer_tooltip=各基板レイヤーにおける拡張コスト補正値を設定します。
vertical=垂直
via_costs=ビアコスト:
via_costs_tooltip=層変更ビアのコスト。値を大きくすると、ルーターは現在のレイヤーに長くとどまるようになります。
vias_allowed=ビアの許可:
