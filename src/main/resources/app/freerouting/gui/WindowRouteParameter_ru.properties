pull_tight_accuracy=Точность выравнивания и оптимизации:
pull_tight_accuracy_tooltip=Точность трассировки. Меньшие значения снижают скорость, но повышают точность; большие значения увеличивают скорость, но снижают точность.
pull_tight_accuracy_tooltip_current=Точность трассировки. Меньшие значения снижают скорость, но повышают точность; большие значения увеличивают скорость, но снижают точность. Текущее значение: {{value}}.
pull_tight_region=Радиус выравнивания и оптимизации:
pull_tight_region_tooltip=Расстояние вокруг курсора, в пределах которого проводится выравнивание и оптимизация геометрии дорожек после каждого шага трассировки. Меньшие значения ограничивают зону оптимизации и работают быстрее; сдвиньте на максимум для всей платы.
pull_tight_region_tooltip_radius=Расстояние вокруг курсора, в пределах которого проводится выравнивание и оптимизация геометрии дорожек после каждого шага трассировки. Меньшие значения ограничивают зону оптимизации и работают быстрее; сдвиньте на максимум для всей платы. Текущий радиус: {{value}}.
pull_tight_region_tooltip_whole_board=Расстояние вокруг курсора, в пределах которого проводится выравнивание и оптимизация геометрии дорожек после каждого шага трассировки. Меньшие значения ограничивают зону оптимизации и работают быстрее; сдвиньте на максимум для всей платы. Текущий радиус: вся плата (без ограничений).
