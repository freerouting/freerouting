pin_pad_to_turn_gap=Зазор до поворота от площадки:
pin_pad_to_turn_gap_tooltip=Расстояние, которое должна пройти медная дорожка после выхода из площадки перед поворотом. Чем выше значение, тем жестче ограничение.
