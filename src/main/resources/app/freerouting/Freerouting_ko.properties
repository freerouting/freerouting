command_line_help=사용법\n\nfreerouting [매개변수]\n\n매개변수\n\n-de <design.dsn>\nSpecctra .dsn 파일을 불러옵니다.\n\n-di <design_directory>\n디자인 열기 대화상자에서 사용할 기본 폴더를 설정합니다.\n\n-dr <design_rules_file>\n.rules 파일에서 배선 규칙 읽기\n\n-do <output_file>\n작업 완료 후 보드(.dsn), 세션(.ses) 또는\nAutodesk Fusion 스크립트(.scr) 저장\n\n-mp <number_of_passes>\n수행할 최대 자동 배선 패스 수 설정\n\n-l <language>\n영어는 "en", 독일어는 "de", 간체 중국어는 "zh". 지정하지 않으면 시스템 기본값을 사용합니다. 지원되지 않는 언어는 기본적으로 영어가 사용됩니다.\n\n-mt <number_of_threads>\n배선 최적화에 사용할 스레드 풀 크기를 설정합니다. 기본값은\n시스템의 논리 프로세서 수보다 1개 적은 수입니다.\n\n-is <selection_strategy>\nSequential(순차) 또는 Prioritized(우선순위). 배선 최적화를 위한\n항목 선택 전략을 설정합니다. 기본값은 Sequential입니다.\n\n-h 이 도움말 표시
