command_line_help=사용법\n\nfreerouting [매개변수]\n\n매개변수\n\n-de <design.dsn>\nSpecctra .dsn 파일을 불러옵니다\n\n-di <design_directory>\n디자인 열기 대화상자의 기본 폴더를 설정합니다\n\n-dr <design_rules_file>\n.rules 파일에서 배선 규칙을 읽어옵니다\n\n-do <output_file>\n작업 완료 후 보드 (.dsn), 세션 (.ses) 또는\nEagle 세션 스크립트 (.scr)를 저장합니다\n\n-mp <number_of_passes>\n수행할 자동 배선 패스 횟수의 상한값을\n설정합니다\n\n-l <language>\n영어의 경우 "en", 독일어의 경우 "de", 간체 중국어의 경우 "zh"를 사용하며, 그렇지 않으면 시스템 기본값이 사용됩니다. 지원되지 않는 언어의 경우 기본적으로 영어로 설정됩니다.\n\n-mt <number_of_threads>\n배선 최적화를 위한 스레드 풀 크기를 설정합니다. 기본값은\n시스템의 논리 프로세서 수보다 1개 적은 값입니다.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid 중 선택합니다. 배선 최적화를 위한\n보드 업데이트 전략을 설정합니다. 기본값은 greedy입니다. hybrid를 선택하면\n또 다른 옵션인 "hr"로 혼합 비율(hybrid ratio)을 지정합니다.\n\n-hr <m\:n>\n다음 형식으로 하이브리드 비율을 설정합니다:\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "38": " 기본값은 1\:1입니다. 하이브리드 전략인 경우에만 적용됩니다." } ```\n선택된 경우.\n\n-is <selection_strategy>\n순차적(Sequential), 임의(Random) 또는 우선순위(Prioritized). 항목 선택 전략을 설정합니다.\n배선 최적화 모드: sequential(순차), random(무작위), prioritized(우선순위).\n기본값은 prioritized입니다. Prioritized 전략은 이전 라운드에서\n계산된 점수를 바탕으로 항목을 선택합니다.\n\n-h 이 도움말을 표시합니다\n
