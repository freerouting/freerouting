command_line_help=사용법\n\nfreerouting [매개변수]\n\n매개변수\n\n-de <design.dsn>\nSpecctra .dsn 파일 불러오기\n\n-di <설계_디렉터리>\n디자인 열기 대화상자에서 사용할 기본 폴더를 설정합니다\n\n-dr <design_rules_file>\n.rules 파일에서 배선 규칙 읽기\n\n-do <output_file>\n보드(.dsn), 세션(.ses) 또는\n마지막에 Autodesk Fusion 스크립트(.scr)\n\n-mp <pass_수>\n수행할 자동 배선 패스의 최대 개수를 설정합니다.\n\n-l <언어>\n영어의 경우 "en", 독일어의 경우 "de", 간체 중국어의 경우 "zh"를 사용하며, 그렇지 않으면 시스템 기본값을 사용합니다. 지원되지 않는 언어의 경우 기본적으로 영어가 사용됩니다.\n\n-mt <스레드_수>\n경로 최적화를 위한 스레드 풀 크기를 설정합니다. 기본값은\n시스템의 논리 프로세서 수보다 하나 적은 수입니다.\n\n-us <업데이트_전략>\nGreedy, Global, 또는 Hybrid. 배선 시 보드 업데이트 전략을 설정합니다\n최적화를 수행합니다. 기본값은 greedy입니다. Hybrid를 선택하면,\n하이브리드 비율을 지정하려면 "hr" 옵션을 사용합니다.\n\n-hr <m\:n>\n하이브리드 비율을 다음 형식으로 설정:\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " 기본값은 1\:1입니다. 이 옵션은 다음의 경우에만 적용됩니다:" } ```\n하이브리드 전략이 선택되었습니다.\n\n-is <selection_strategy>\n순차적, 무작위 또는 우선순위 기반. 항목 선택 전략을 설정합니다.\n배선 최적화용입니다. 기본값은 prioritized이며,\n이전 라운드 동안 계산된 점수를 기반으로 한 항목.\n\n-h 이 도움말 표시
