command_line_help=NAUDOJIMAS\n\nfreerouting [PARAMETRAI]\n\nPARAMETRAI\n\n-de <dizainas.dsn>\nĮkelti Specctra .dsn failą\n\n-di <projekto_katalogas>\nNustatyti numatytąjį aplanką, naudojamą projektų atvėrimo languose\n\n-dr <design_rules_file>\nSkaityti trasavimo taisykles iš .rules failo\n\n-do <output_file>\nIšsaugoti plokštę (.dsn), seansą (.ses) arba\nAutodesk Fusion skriptą (.scr) pabaigoje\n\n-mp <ėjimų_skaičius>\nNustatyti didžiausią atliekamų automatinio trasavimo ėjimų skaičių\n\n-l <kalba>\n„en“ – anglų k., „de“ – vokiečių k. arba „zh“ – supaprastintai kinų k.; kitais atvejais naudojama sistemos numatytoji kalba. Nepalaikomoms kalboms pagal nutylėjimą naudojama anglų kalba.\n\n-mt <number_of_threads>\nNustatykite gijų telkinio dydį maršruto optimizavimui. Numatytasis yra\nvienu mažiau nei sistemos loginių procesorių skaičius.\n\n-us <updating_strategy>\n„Greedy“, „Global“ arba „Hybrid“. Nustatykite plokštės atnaujinimo strategiją trasavimui\noptimizavimui. Numatytasis yra „greedy“. Pasirinkus „Hybrid“,\nnaudokite parinktį „hr“, kad nurodytumėte hibridinį santykį.\n\n-hr <m\:n>\nNustatyti hibridinį santykį formatu\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nNumatytoji reikšmė yra 1\:1. Ši parinktis galioja tik tada, kai\nPasirinkta hibridinė strategija.\n\n-is <selection_strategy>\nNuoseklus, atsitiktinis arba prioritetinis. Nustatykite elementų pasirinkimo strategiją\nmaršruto optimizavimui. Numatytasis nustatymas yra prioritizuotas, kuris pasirenka\nelementus pagal įverčius, apskaičiuotus ankstesnio etapo metu.\n\n-h Parodyti šią pagalbą
