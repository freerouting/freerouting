command_line_help=NAUDOJIMAS\n\nfreerouting [PARAMETRAI]\n\nPARAMETRAI\n\n-de <design.dsn>\nĮkelti Specctra .dsn failą\n\n-di <design_directory>\nNustatyti numatytąjį aplanką, naudojamą projekto atvėrimo languose\n\n-dr <design_rules_file>\nSkaityti trasavimo taisykles iš .rules failo\n\n-do <išvesties_failas>\nPabaigoje išsaugoti plokštę (.dsn), seansą (.ses) arba\n„Autodesk Fusion“ scenarijų (.scr)\n\n-mp <ėjimų_skaičius>\nNustatyti didžiausią atliekamų automatinio trasavimo ėjimų skaičių\n\n-l <kalba>\n„en“ – anglų k., „de“ – vokiečių k. arba „zh“ – supaprastintoji kinų k.; kitais atvejais naudojama sistemos numatytoji kalba. Nepalaikomoms kalboms numatytuoju nustatymu naudojama anglų kalba.\n\n-mt <gijų_skaičius>\nNustatykite gijų telkinio dydį trasavimo optimizavimui. Numatytasis dydis yra\nvienetu mažesnis nei sistemos loginių procesorių skaičius.\n\n-is <pasirinkimo_strategija>\n„Sequential“ (nuosekli) arba „prioritized“ (prioritetinė). Nustatykite elementų pasirinkimo strategiją\ntrasavimo optimizavimui. Numatytasis nustatymas yra nuosekli strategija.\n\n-h Rodyti šią pagalbą
