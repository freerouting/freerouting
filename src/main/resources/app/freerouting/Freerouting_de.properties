command_line_help=VERWENDUNG\n\nfreerouting [PARAMETER]\n\nPARAMETER\n\n-de <design.dsn>\nDie Specctra .dsn-Datei laden\n\n-di <design_directory>\nStandardordner für den Dialog „Design öffnen“ festlegen\n\n-dr <design_rules_file>\nRouting-Regeln aus einer .rules-Regeldatei lesen\n\n-do <Ausgabedatei>\nSpeichern Sie die Platine (.dsn), die Sitzung (.ses) oder\nAutodesk Fusion-Skript (.scr) am Ende\n\n-mp <Anzahl_der_Durchlaeufe>\nMaximale Anzahl der auszuführenden automatischen Entflechtungsdurchläufe festlegen\n\n-l <Sprache>\nen" für Englisch, "de" für Deutsch oder "zh" für Vereinfachtes Chinesisch; andernfalls wird der Systemstandard verwendet. Für nicht unterstützte Sprachen wird standardmäßig Englisch verwendet.\n\n-mt <Anzahl_der_Threads>\nLegen Sie die Threadpool-Größe für die Trassenoptimierung fest. Der Standardwert ist\neines weniger als die Anzahl der logischen Prozessoren im System.\n\n-us <updating_strategy>\nGreedy, Global oder Hybrid. Legt die Strategie für Board-Aktualisierungen beim Entflechten fest\nOptimierung. Der Standardwert ist greedy. Wenn Hybrid ausgewählt ist,\nVerwenden Sie die Option „hr“, um das Hybridverhältnis anzugeben.\n\n-hr <m\:n>\nStellen Sie das Hybrid-Verhältnis ein im Format von\n```json { "36": " \#_globale_optimale_Durchläufe\:\#_priorisierte_Durchläufe." } ```\n```json { "37": " Der Standardwert ist 1\:1. Diese Option ist nur wirksam, wenn die" } ```\nHybride Strategie ist ausgewählt.\n\n-is <selection_strategy>\nSequenziell, zufällig oder priorisiert. Legt die Auswahlstrategie für Elemente fest\nfür die Routenoptimierung. Der Standardwert ist prioritized, was\nElemente basierend auf Bewertungen, die in der vorherigen Runde berechnet wurden.\n\n-h Diese Hilfe anzeigen
