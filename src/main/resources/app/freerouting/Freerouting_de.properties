command_line_help=VERWENDUNG\n\nfreerouting [PARAMETER]\n\nPARAMETER\n\n-de <design.dsn>\nLädt die Specctra-DSN-Datei\n\n-di <design_directory>\nLegt den Standardordner für die Dialoge zum Öffnen von Designs fest\n\n-dr <design_rules_file>\nLiest Routing-Regeln aus einer .rules-Datei\n\n-do <output_file>\nSpeichert am Ende die Platine (.dsn), die Session (.ses) oder\ndas Eagle-Session-Skript (.scr)\n\n-mp <number_of_passes>\nLegt die Obergrenze für die Anzahl der auszuführenden\nAutorouter-Durchläufe fest\n\n-l <language>\n„en“ für Englisch, „de“ für Deutsch, „zh“ für Vereinfachtes Chinesisch, ansonsten die Systemstandardeinstellung. Englisch ist als Standard für nicht unterstützte Sprachen eingestellt.\n\n-mt <number_of_threads>\nLegt die Thread-Pool-Größe für die Routing-Optimierung fest. Der Standardwert ist\neins weniger als die Anzahl der logischen Prozessoren im System.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Legt die Platinen-Aktualisierungsstrategie für die Routing-\nOptimierung fest. Der Standardwert ist Greedy. Wenn Hybrid ausgewählt ist,\ngibt eine weitere Option „hr“ das Hybrid-Verhältnis an.\n\n-hr <m\:n>\nLegt das Hybrid-Verhältnis fest im Format\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nDer Standardwert ist 1\:1. Er ist nur bei hybrider Strategie wirksam\nausgewählt ist.\n\n-is <selection_strategy>\nSequenziell, zufällig oder priorisiert. Legt die Elementauswahlstrategie fest\nfür die Rout-Optimierung: sequenziell, zufällig, priorisiert. Die\nStandard ist prioritized (priorisiert). Die priorisierte Strategie wählt Elemente basierend\nauf den in der vorherigen Runde berechneten Werten aus.\n\n-h Zeigt diese Hilfe an\n
