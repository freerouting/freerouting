command_line_help=VERWENDUNG\n\nfreerouting [PARAMETER]\n\nPARAMETER\n\n-de <design.dsn>\nDie Specctra .dsn-Datei laden\n\n-di <design_directory>\nStandardordner für Entwurf-öffnen-Dialoge festlegen\n\n-dr <design_rules_file>\nRouting-Regeln aus einer .rules-Datei lesen\n\n-do <output_file>\nSpeichern Sie die Platinen- (.dsn), Sitzungs- (.ses) oder\nAutodesk Fusion-Skript (.scr) am Ende\n\n-mp <Anzahl_der_Durchläufe>\nMaximale Anzahl der auszuführenden Durchläufe für die automatische Entflechtung festlegen\n\n-l <Sprache>\n"en" für Englisch, "de" für Deutsch oder "zh" für Vereinfachtes Chinesisch; andernfalls wird der Systemstandard verwendet. Englisch wird standardmäßig für nicht unterstützte Sprachen verwendet.\n\n-mt <number_of_threads>\nLegen Sie die Thread-Pool-Größe für die Routenoptimierung fest. Der Standardwert ist\neins weniger als die Anzahl der logischen Prozessoren im System.\n\n-is <selection_strategy>\nSequentiell oder priorisiert. Legt die Elementauswahlstrategie fest für\nRoutenoptimierung. Standard ist sequentiell.\n\n-h Diese Hilfe anzeigen
