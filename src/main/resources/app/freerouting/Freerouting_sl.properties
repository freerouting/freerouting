command_line_help=UPORABA\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nNaloži datoteko Specctra .dsn\n\n-di <design_directory>\nNastavi privzeto mapo za pogovorna okna za odpiranje načrtov\n\n-dr <design_rules_file>\nPreberi pravila vodenja sledi iz datoteke .rules\n\n-do <izhodna_datoteka>\nNa koncu shrani tiskano vezje (.dsn), sejo (.ses) ali\nskripto Autodesk Fusion (.scr)\n\n-mp <število_prehodov>\nNastavi največje število prehodov samodejnega vodenja sledi\n\n-l <jezik>\n"en" za angleščino, "de" za nemščino ali "zh" za poenostavljeno kitajščino; sicer uporabi sistemsko privzeto vrednost. Za nepodprte jezike se privzeto uporablja angleščina.\n\n-mt <število_nitij>\nNastavi velikost niza nitij za optimizacijo vodenja sledi. Privzeta vrednost je\neno manj od števila logičnih procesorjev v sistemu.\n\n-is <strategija_izbire>\nSequential ali prioritized. Nastavi strategijo izbire elementov za\noptimizacijo vodenja sledi. Privzeta vrednost je sequential.\n\n-h Prikaže to pomoč
