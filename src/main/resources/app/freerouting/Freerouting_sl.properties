command_line_help=UPORABA\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nNaloži datoteko Specctra .dsn\n\n-di <direktorij_projekta>\nNastavi privzeto mapo, ki jo uporabljajo pogovorna okna za odpiranje projektov\n\n-dr <datoteka_pravil_projekta>\nPreberi pravila vodenja sledi iz datoteke .rules\n\n-do <output_file>\nShrani vezje (.dsn), sejo (.ses) ali\nskript Autodesk Fusion (.scr) na koncu\n\n-mp <število_prehodov>\nNastavi največje število prehodov samodejnega vodenja sledi\n\n-l <jezik>\nen" za angleščino, "de" za nemščino ali "zh" za poenostavljeno kitajščino; sicer se uporabi sistemska privzeta vrednost. Za nepodprte jezike se privzeto uporablja angleščina.\n\n-mt <število_nitij>\nNastavi velikost niza niti za optimizacijo vodenja sledi. Privzeta vrednost je\nenega manj od števila logičnih procesorjev v sistemu.\n\n-us <updating_strategy>\n```json { "30": " Greedy, Global ali Hybrid. Nastavi strategijo posodabljanja vezja za voden\n```json { "31": " optimizacija. Privzeta možnost\nuporabite možnost "hr" za določitev hibridnega razmerja.\n\n-hr <m\:n>\nNastavite hibridno razmerje v obliki\n\#_global_optimal_passes\:\#_prioritized_passes.\n```json { "37": " Privzeta vrednost je 1\:1. Ta možnost ima učinek le, ko je" } ```\nIzbrana je hibridna strategija.\n\n-is <strategija_izbire>\nZaporedno, naključno ali prednostno. Nastavi strategijo izbire elementov\nza optimizacijo vodenja sledi. Privzeta možnost je prioritized, ki izbere\nelementi na podlagi ocen, izračunanih v prejšnji krog.\n\n-h Prikaže to pomoč
