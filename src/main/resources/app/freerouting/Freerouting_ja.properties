command_line_help=使用方法\n\nfreerouting [パラメータ]\n\nパラメータ\n\n-de <design.dsn>\nSpecctra .dsn ファイルを読み込みます\n\n-di <design_directory>\nデザインを開くダイアログのデフォルトフォルダを設定します\n\n-dr <design_rules_file>\n.rulesファイルから配線ルールを読み込みます\n\n-do <output_file>\n終了時にボード (.dsn)、セッション (.ses)、または\nEagleセッションスクリプト (.scr) を保存します\n\n-mp <number_of_passes>\n実行される自動配線パス（オートルーティングパス）の\n上限回数を設定します\n\n-l <language>\n英語は "en"、ドイツ語は "de"、簡体字中国語は "zh"、それ以外の場合はシステム標準になります。サポートされていない言語の場合はデフォルトで英語が設定されます。\n\n-mt <スレッド数>\nルート最適化用のスレッドプールサイズを設定します。デフォルトは\nシステム内の論理プロセッサ数から1を引いた値です。\n\n-us <更新戦略>\nGreedy、Global、Hybrid。ルート最適化の基板更新戦略を\n設定します。デフォルトは greedy です。hybrid を選択した場合、\n別のオプション "hr" でハイブリッド比率を指定します。\n\n-hr <m\:n>\nハイブリッド比率を以下の形式で設定します：\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nデフォルトは1\:1です。ハイブリッド戦略の場合のみ有効です。\nが選択されている場合。\n\n-is <selection_strategy>\nシーケンシャル、ランダム、または優先度順。アイテムの選択戦略を設定します\n配線最適化用\: シーケンシャル、ランダム、優先度順。\nデフォルトはprioritizedです。prioritized戦略は、前回のラウンドで\n計算されたスコアに基づいてアイテムを選択します。\n\n-h このヘルプを表示します\n
