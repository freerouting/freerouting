command_line_help=使用方法\n\nfreerouting [パラメータ]\n\nパラメータ\n\n-de <design.dsn>\nSpecctra .dsnファイルを読み込みます\n\n-di <設計ディレクトリ>\nデザインを開くダイアログのデフォルトフォルダーを設定\n\n-dr <design_rules_file>\n.rulesファイルから配線ルールを読み込む\n\n-do <output_file>\n基板（.dsn）、セッション（.ses）、または\n最後にAutodesk Fusionスクリプト（.scr）\n\n-mp <パス数>\n自動配線の最大パス数を設定します\n\n-l <言語コード>\n英語の場合は「en」、ドイツ語の場合は「de」、簡体字中国語の場合は「zh」を指定します。それ以外の場合はシステム既定値が使用されます。未サポート言語の場合は英語が既定値として使用されます。\n\n-mt <スレッド数>\n配線最適化のスレッドプールサイズを設定します。デフォルトは\nシステム内の論理プロセッサの数より1つ少ない値。\n\n-us <updating_strategy>\n配線時の基板更新戦略を Greedy, Global, または Hybrid に設定します。\n最適化アルゴリズム。デフォルトは greedy です。Hybrid が選択されている場合、\nハイブリッド比率を指定するには "hr" オプションを使用します。\n\n-hr <m\:n>\nハイブリッド比率を次の形式で設定します:\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nデフォルトは1\:1です。このオプションは、次の場合にのみ有効です：\nハイブリッド戦略が選択されています。\n\n-is <selection_strategy>\nSequential, random, or prioritized. Set the item-selection strategy\n配線の最適化を行います。デフォルトはprioritizedで、優先順位に従って\n前回のラウンドで計算されたスコアに基づいてアイテムを抽出します。\n\n-h このヘルプを表示
