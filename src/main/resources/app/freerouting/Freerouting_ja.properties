command_line_help=使用方法\n\nfreerouting [パラメータ]\n\nパラメータ\n\n-de <design.dsn>\nSpecctra .dsn ファイルを読み込む\n\n-di <design_directory>\nデザインを開くダイアログで使用するデフォルトフォルダを設定する\n\n-dr <design_rules_file>\n.rules ファイルから配線ルールを読み込む\n\n-do <output_file>\n終了時に基板（.dsn）、セッション（.ses）、または\nAutodesk Fusionスクリプト（.scr）を保存する\n\n-mp <number_of_passes>\n実行する自動配線パスの最大数を設定する\n\n-l <language>\n英語は "en"、ドイツ語は "de"、簡体字中国語は "zh"。それ以外の場合はシステムのデフォルトを使用。サポートされていない言語の場合はデフォルトで英語が使用されます。\n\n-mt <スレッド数>\n配線最適化のスレッドプールサイズを設定します。デフォルトは\nシステムの論理プロセッサ数マイナス1です。\n\n-is <選択戦略>\nSequential（順次）または prioritized（優先度順）。配線最適化の\nアイテム選択戦略を設定します。デフォルトは sequential です。\n\n-h このヘルプを表示
