command_line_help=USO\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nCarica il file Specctra .dsn\n\n-di <directory_di_progetto>\nImposta la cartella predefinita usata dalle finestre di dialogo Apri progetto\n\n-dr <file_regole_di_progetto>\nLegge le regole di sbroglio da un file .rules\n\n-do <output_file>\nSalva la scheda (.dsn), la sessione (.ses) o lo\nscript di Autodesk Fusion (.scr) al termine\n\n-mp <number_of_passes>\nImposta il numero massimo di passate di sbroglio automatico da eseguire\n\n-l <language>\nen" per l'inglese, "de" per il tedesco o "zh" per il cinese semplificato; in caso contrario, usa le impostazioni predefinite del sistema. L'inglese viene usato come predefinito per le lingue non supportate.\n\n-mt <numero_di_thread>\nImposta la dimensione del pool di thread per l'ottimizzazione dello sbroglio. Il valore predefinito è\nuno in meno rispetto al numero di processori logici nel sistema.\n\n-is <strategia_di_selezione>\nSequential o prioritized. Imposta la strategia di selezione degli elementi per\nl'ottimizzazione dello sbroglio. Il valore predefinito è sequential.\n\n-h Mostra questa guida
