command_line_help=USO\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nCarica il file .dsn Specctra\n\n-di <cartella_progetto>\nImposta la cartella predefinita per le finestre di apertura progetto\n\n-dr <file_regole_progetto>\nLegge le regole di instradamento da un file .rules\n\n-do <output_file>\nSalva la scheda (.dsn), la sessione (.ses) o\nlo script di sessione Eagle (.scr) al termine\n\n-mp <number_of_passes>\nImposta il limite massimo per il numero di passaggi di autorouter\nche verranno eseguiti\n\n-l <language>\nen" per l'inglese, "de" per il tedesco, "zh" per il cinese semplificato, altrimenti viene usata l'impostazione predefinita di sistema. L'inglese è impostato come predefinito per le lingue non supportate.\n\n-mt <numero_di_thread>\nImposta la dimensione del pool di thread per l'ottimizzazione dell'instradamento. Il valore predefinito è\npari al numero di processori logici nel sistema meno uno.\n\n-us <strategia_di_aggiornamento>\nGreedy, Global, Hybrid. Imposta la strategia di aggiornamento della scheda per l'ottimizzazione\ndell'instradamento. Il valore predefinito è greedy. Quando si seleziona hybrid,\nun'altra opzione "hr" specifica il rapporto hybrid.\n\n-hr <m\:n>\nImposta il rapporto ibrido nel formato\nn°_passaggi_ottimali_globali\:n°_passaggi_prioritari.\nIl valore predefinito è 1\:1. Ha effetto solo quando è selezionata\nla strategia ibrida.\n\n-is <strategia_selezione>\nSequenziale, casuale o prioritaria. Imposta la strategia di selezione degli elementi\nper l'ottimizzazione dell'instradamento\: sequenziale, casuale, prioritaria.\nil valore predefinito è prioritized. La strategia con priorità seleziona gli elementi in base\nai punteggi calcolati nel round precedente.\n\n-h Mostra questo aiuto\n
