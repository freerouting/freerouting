command_line_help=USO\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nCarica il file Specctra .dsn\n\n-di <directory_progetto>\nImposta la cartella predefinita usata dalle finestre di dialogo apri progetto\n\n-dr <file_regole_di_progetto>\nLegge le regole di sbroglio da un file .rules\n\n-do <output_file>\nSalva la scheda (.dsn), la sessione (.ses), o\nScript Autodesk Fusion (.scr) alla fine\n\n-mp <numero_di_passate>\nImposta il numero massimo di passate di sbroglio automatico da eseguire\n\n-l <lingua>\nen" per l'inglese, "de" per il tedesco o "zh" per il cinese semplificato; altrimenti usa le impostazioni predefinite di sistema. L'inglese viene usato come predefinito per le lingue non supportate.\n\n-mt <numero_di_thread>\nImposta la dimensione del thread pool per l'ottimizzazione dello sbroglio. Il valore predefinito è\nuno in meno del numero di elaboratori logici nel sistema.\n\n-us <updating_strategy>\nGreedy, Global o Hybrid. Imposta la strategia di aggiornamento della scheda per lo sbroglio\ndell'ottimizzazione. Il valore predefinito è greedy. Quando si seleziona Hybrid,\nusa l'opzione "hr" per specificare il rapporto ibrido.\n\n-hr <m\:n>\nImposta il rapporto ibrido nel formato\n```json { "36": " \#_passate_ottimali_globali\:\#_passate_prioritarizzate." } ```\nIl valore predefinito è 1\:1. Questa opzione ha effetto solo quando\nÈ selezionata la strategia ibrida.\n\n-is <selection_strategy>\nSequenziale, casuale o con priorità. Imposta la strategia di selezione degli elementi\nper l'ottimizzazione dello sbroglio. Il valore predefinito è prioritario, che seleziona\nelementi in base ai punteggi calcolati durante il round precedente.\n\n-h Mostra questo messaggio di aiuto
