command_line_help=ANVÄNDNING\n\nfreerouting [PARAMETRAR]\n\nPARAMETRAR\n\n-de <design.dsn>\nLäs in Specctra .dsn-filen\n\n-di <designkatalog>\nAnge standardmappen som används av öppna design-dialoger\n\n-dr <design_rules_file>\nLäs dragningsregler från en .rules-fil\n\n-do <output_file>\nSpara kortet (.dsn), sessionen (.ses) eller\nAutodesk Fusion-skript (.scr) i slutet\n\n-mp <number_of_passes>\nAnge maximalt antal automatdragningspass som ska utföras\n\n-l <språk>\nen" för engelska, "de" för tyska eller "zh" för förenklad kinesiska; annars används systemets standardvärde. Engelska används som standard för språk som inte stöds.\n\n-mt <antal_trådar>\nAnge storleken på trådpoolen för ruttoptimering. Standardvärdet är\nen färre än antalet logiska processorer i systemet.\n\n-us <updating_strategy>\nGreedy, Global eller Hybrid. Ställ in uppdateringsstrategin för kortet under dragning\noptimering. Standardvärdet är lysten. När Hybrid väljs,\nanvänd alternativet "hr" för att ange hybridförhållandet.\n\n-hr <m\:n>\nStäll in hybridförhållandet i formatet\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nStandardvärdet är 1\:1. Detta alternativ har endast effekt när\nHybridstrategi är vald.\n\n-is <urvalsstrategi>\nSekventiell, slumpmässig eller prioriterad. Ställ in strategin för val av objekt\nför ruttoptimering. Standardvärdet är prioriterat, som väljer\nobjekt baserat på poäng beräknade under föregående runda.\n\n-h Visa denna hjälp
