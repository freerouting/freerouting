command_line_help=ANVÄNDNING\n\nfreerouting [PARAMETRAR]\n\nPARAMETRAR\n\n-de <design.dsn>\nLäs in Specctra .dsn-filen\n\n-di <design_directory>\nStäll in standardmapp för dialogrutor som öppnar design\n\n-dr <design_rules_file>\nLäs dragningsregler från en .rules-fil\n\n-do <utdatafil>\nSpara kortet (.dsn), sessionen (.ses) eller\nAutodesk Fusion-skriptet (.scr) i slutet\n\n-mp <antal_pass>\nStäll in maximalt antal autorouter-pass som ska utföras\n\n-l <språk>\nen" för engelska, "de" för tyska eller "zh" för förenklad kinesiska; annars används systemets standardvärde. Engelska används som standard för språk som inte stöds.\n\n-mt <number_of_threads>\nAnge storleken på trådpoolen för optimering av dragning. Standard är\nen färre än antalet logiska processorer i systemet.\n\n-is <selection_strategy>\nSequential eller prioritized. Ange metod för objektsortering för\noptimering av dragning. Standard är sequential.\n\n-h Visa denna hjälp text
