command_line_help=ANVÄNDNING\n\nfreerouting [PARAMETRAR]\n\nPARAMETRAR\n\n-de <design.dsn>\nLaddar Specctra .dsn-filen\n\n-di <designkatalog>\nAnger standardmapp för dialogrutorna Öppna design\n\n-dr <designregelfil>\nLäser routingregler från en .rules-fil\n\n-do <output_file>\nSparar kortet (.dsn), sessionen (.ses) eller\nEagle-sessionsskriptet (.scr) i slutet\n\n-mp <number_of_passes>\nSätter den övre gränsen för antalet autorouting-omgångar\nsom ska utföras\n\n-l <language>\nen" för engelska, "de" för tyska, "zh" för förenklad kinesiska, annars används systemets standard. Engelska ställs in som standard för språk som inte stöds.\n\n-mt <number_of_threads>\nSätter trådpoolens storlek för ruttoptimering. Standardvärdet är\nen mindre än antalet logiska processorer i systemet.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Ställer in kortuppdateringsstrategi för rutt-\noptimering. Standardvärdet är greedy. När hybrid väljs\nanger ett annat alternativ "hr" hybridförhållandet.\n\n-hr <m\:n>\nStäller in hybridförhållande i formatet\n\#_globala_optimala_passeringar\:\#_prioriterade_passeringar.\nStandard är 1\:1. Det är endast effektivt när hybridstrategi\när vald.\n\n-is <urvalsstrategi>\nSequential, random, eller prioritized. Ställer in urvalsstrategi för objekt\nvid ruttoptimering\: sequential, random, prioritized.\nstandard är prioriterad. Prioriterad strategi väljer objekt baserat\npå poäng beräknade i föregående runda.\n\n-h Visar denna hjälp\n
