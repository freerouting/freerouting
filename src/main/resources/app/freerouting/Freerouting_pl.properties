command_line_help=UŻYCIE\n\nfreerouting [PARAMETRY]\n\nPARAMETRY\n\n-de <projekt.dsn>\nWczytuje plik .dsn formatu Specctra\n\n-di <katalog_projektów>\nUstawia domyślny folder dla okien dialogowych otwierania projektu\n\n-dr <plik_reguł_projektowych>\nOdczytuje reguły trasowania z pliku .rules\n\n-do <output_file>\nZapisuje płytkę (.dsn), sesję (.ses) lub\nskrypt sesji programu Eagle (.scr) na końcu\n\n-mp <number_of_passes>\nUstawia górny limit liczby przejść autoroutera,\nktóre zostaną wykonane\n\n-l <language>\n„en” dla angielskiego, „de” dla niemieckiego, „zh” dla chińskiego uproszczonego, w przeciwnym razie domyślny język systemu. Angielski jest ustawiany domyślnie dla nieobsługiwanych języków.\n\n-mt <number_of_threads>\nUstawia rozmiar puli wątków do optymalizacji trasowania. Wartością domyślną jest\no jeden mniej niż liczba procesorów logicznych w systemie.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Ustawia strategię aktualizacji płytki dla optymalizacji\ntrasowania. Domyślną wartością jest greedy. Gdy wybrano hybrid,\ninna opcja „hr” określa proporcję hybrydową (hybrid ratio).\n\n-hr <m\:n>\nUstawia współczynnik hybrydowy w formacie\nliczba_przebiegów_globalnie_optymalnych\:liczba_przebiegów_priorytetowych.\nDomyślna wartość to 1\:1. Działa tylko wtedy, gdy wybrana jest\nstrategia hybrydowa.\n\n-is <strategia_wyboru>\nSequential, random lub prioritized. Ustawia strategię wyboru elementów\ndo optymalizacji trasy\: sekwencyjną (sequential), losową (random) lub priorytetową (prioritized).\ndomyślną jest priorytetowa. Strategia priorytetowa wybiera elementy na podstawie\nwyników obliczonych w poprzedniej rundzie.\n\n-h Pokazuje tę pomoc\n
