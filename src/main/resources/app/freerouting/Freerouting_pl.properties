command_line_help=UŻYCIE\n\nfreerouting [PARAMETRY]\n\nPARAMETRY\n\n-de <design.dsn>\nWczytaj plik Specctra .dsn\n\n-di <katalog_projektu>\nUstaw domyślny folder używany przez okna otwierania projektu\n\n-dr <plik_regul_projektu>\nOdczytaj reguły trasowania z pliku .rules\n\n-do <plik_wyjściowy>\nZapisz płytkę (.dsn), sesję (.ses) lub\nskrypt Autodesk Fusion (.scr) na końcu\n\n-mp <liczba_przebiegów>\nUstaw maksymalną liczbę przebiegów automatycznego trasowania\n\n-l <język>\n"en" dla angielskiego, "de" dla niemieckiego lub "zh" dla chińskiego uproszczonego; w przeciwnym razie użyj domyślnego języka systemu. Angielski jest używany domyślnie dla nieobsługiwanych języków.\n\n-mt <number_of_threads>\nUstawia rozmiar puli wątków dla optymalizacji trasy. Domyślnie jest to\no jeden mniej niż liczba procesorów logicznych w systemie.\n\n-is <selection_strategy>\nSequential lub prioritized. Ustawia strategię wyboru elementów dla\noptymalizacji trasy. Domyślnie jest to sekwencyjna (sequential).\n\n-h Wyświetla tę pomoc
