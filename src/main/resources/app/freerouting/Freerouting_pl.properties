command_line_help=UŻYCIE\n\nfreerouting [PARAMETRY]\n\nPARAMETRY\n\n-de <design.dsn>\nWczytaj plik Specctra .dsn\n\n-di <katalog_projektu>\nUstawia domyślny folder używany przez okna otwierania projektu\n\n-dr <plik_reguł_projektu>\nOdczytaj reguły trasowania z pliku .rules\n\n-do <output_file>\nZapisz płytkę (.dsn), sesję (.ses) lub\nskrypt Autodesk Fusion (.scr) na końcu\n\n-mp <liczba_przebiegów>\nUstaw maksymalną liczbę przebiegów automatycznego trasowania do wykonania\n\n-l <język>\nen" dla angielskiego, "de" dla niemieckiego lub "zh" dla chińskiego uproszczonego; w przeciwnym razie użyty zostanie domyślny język systemu. Dla nieobsługiwanych języków domyślnie używany jest język angielski.\n\n-mt <liczba_wątków>\nUstaw rozmiar puli wątków dla optymalizacji trasowania. Domyślnie jest to\no jeden mniej niż liczba procesorów logicznych w systemie.\n\n-us <updating_strategy>\nZachłanny, Globalny lub Hybrydowy. Ustawia strategię aktualizacji płytki dla trasowania\noptymalizacji. Domyślnie jest to metoda zachłanna. Po wybraniu opcji Hybrydowy,\nużyj opcji "hr", aby określić współczynnik hybrydowy.\n\n-hr <m\:n>\nUstaw współczynnik hybrydowy w formacie\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nDomyślnie wynosi 1\:1. Ta opcja działa tylko wtedy, gdy\nWybrano strategię hybrydową.\n\n-is <selection_strategy>\nSekwencyjna, losowa lub priorytetyzowana. Ustawia strategię wyboru elementów\ndo optymalizacji trasowania. Domyślną opcją jest prioritized, która wybiera\nelementy na podstawie wyników obliczonych podczas poprzedniej rundy.\n\n-h Wyświetl tę pomoc
