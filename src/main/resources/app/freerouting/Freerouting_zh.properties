command_line_help=用法\n\nfreerouting [参数]\n\n参数\n\n-de <design.dsn>\n加载 Specctra .dsn 文件\n\n-di <设计目录>\n设置打开设计文件对话框使用的默认文件夹\n\n-dr <design_rules_file>\n从 .rules 规则文件读取布线规则\n\n-do <output_file>\n保存板图文件 (.dsn)、会话文件 (.ses) 或\n结尾处的 Autodesk Fusion 脚本 (.scr)\n\n-mp <pass_count>\n设置要执行的自动布线最大轮次\n\n-l <语言>\nen" 代表英语，"de" 代表德语，"zh" 代表简体中文；否则使用系统默认值。若语言不受支持，默认使用英语。\n\n-mt <线程数>\n设置用于路径优化的线程池大小。默认值为\n比系统中的逻辑处理器数量少一个。\n\n-us <updating_strategy>\nGreedy（贪婪）、Global（全局）或 Hybrid（混合）。设置自动布线的板更新策略\n优化。默认为 greedy。当选择 Hybrid 时，\n使用“hr”选项来指定混合比例。\n\n-hr <m\:n>\n设置混合比例，格式为\n```json { "36": " \#_全局最佳轮次\:\#_优先轮次。" } ```\n默认值为 1\:1。此选项仅在以下情况生效：\n已选择混合策略。\n\n-is <selection_strategy>\n顺序、随机或按优先级。设置项选择策略\n用于布线优化。默认为优先模式，会选择\n基于上一轮计算出的评分所选出的项目。\n\n-h 显示本帮助信息
