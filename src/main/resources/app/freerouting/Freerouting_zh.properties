command_line_help=用法\n\nfreerouting [参数]\n\n参数\n\n-de <design.dsn>\n加载 Specctra .dsn 文件\n\n-di <design_directory>\n设置打开设计对话框的默认文件夹\n\n-dr <design_rules_file>\n从 .rules 文件读取布线规则\n\n-do <output_file>\n最后保存电路板（.dsn）、会话（.ses）或\nEagle 会话脚本（.scr）\n\n-mp <number_of_passes>\n设置将要执行的自动布线循环次数\n上限\n\n-l <language>\n“en”表示英语，“de”表示德语，“zh”表示简体中文，否则默认为系统语言。对于不受支持的语言，默认设置为英语。\n\n-mt <number_of_threads>\n设置布线优化的线程池大小。默认值为\n系统逻辑处理器数量减 1。\n\n-us <updating_strategy>\nGreedy（贪婪）、Global（全局）、Hybrid（混合）。设置布线优化的\n电路板更新策略。默认值为 greedy。选择 hybrid 时，\n可通过另一个选项“hr”指定混合比例。\n\n-hr <m\:n>\n设置混合比例，格式为\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n默认值为 1\:1。仅在混合策略下有效\n被选中。\n\n-is <selection_strategy>\n按顺序、随机或按优先级。设置项选择策略\n用于走线优化：顺序、随机、按优先级。\n默认为 prioritized（优先）。优先策略会根据在前一轮中计算出的得分\n来选择项目。\n\n-h 显示此帮助信息\n
