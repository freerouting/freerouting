command_line_help=用法\n\nfreerouting [参数]\n\n参数\n\n-de <design.dsn>\n加载 Specctra .dsn 文件\n\n-di <design_directory>\n设置打开设计对话框使用的默认文件夹\n\n-dr <design_rules_file>\n从 .rules 文件读取布线规则\n\n-do <output_file>\n结束时保存板图文件 (.dsn)、会话文件 (.ses) 或\nAutodesk Fusion 脚本 (.scr)\n\n-mp <number_of_passes>\n设置要执行的最大自动布线轮次\n\n-l <language>\n“en”表示英语，“de”表示德语，“zh”表示简体中文；否则使用系统默认值。不支持的语言默认使用英语。\n\n-mt <number_of_threads>\n设置用于路径优化的线程池大小。默认值为\n系统中逻辑处理器数量减一。\n\n-is <selection_strategy>\nSequential（顺序）或 prioritized（优先级）。设置用于\n路径优化的项选择策略。默认值为 sequential（顺序）。\n\n-h 显示此帮助信息
