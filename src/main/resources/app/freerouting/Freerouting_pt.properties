command_line_help=UTILIZAÇÃO\n\nfreerouting [PARÂMETROS]\n\nPARÂMETROS\n\n-de <design.dsn>\nCarregar o ficheiro .dsn da Specctra\n\n-di <diretório_de_conceção>\nDefinir a pasta predefinida usada pelos diálogos de abertura de conceção\n\n-dr <design_rules_file>\nLer regras de encaminhamento de um ficheiro .rules\n\n-do <output_file>\nGuardar a placa (.dsn), sessão (.ses), ou\nscript do Autodesk Fusion (.scr) no final\n\n-mp <number_of_passes>\nDefinir o número máximo de passagens de encaminhamento automático a realizar\n\n-l <idioma>\nen" para inglês, "de" para alemão ou "zh" para chinês simplificado; caso contrário, utiliza a predefinição do sistema. O inglês é utilizado por predefinição para idiomas não suportados.\n\n-mt <número_de_threads>\nDefine o tamanho do pool de threads para a otimização do encaminhamento. O valor predefinido é\nmenos um do que o número de processadores lógicos no sistema.\n\n-us <updating_strategy>\nGulosos, Globais ou Híbridos. Define a estratégia de atualização da placa para o encaminhamento\notimização. O valor predefinido é greedy. Quando Híbrido é selecionado,\nuse a opção "hr" para especificar a proporção híbrida.\n\n-hr <m\:n>\nDefinir a proporção híbrida no formato de\n```json { "36": " \#_passagens_ótimas_globais\:\#_passagens_prioritárias." } ```\n```json { "37": " O valor predefinido é 1\:1. Esta opção só é eficaz quando o" } ```\nFoi selecionada a estratégia híbrida.\n\n-is <selection_strategy>\nSequencial, aleatória ou priorizada. Define a estratégia de seleção de elementos\npara a otimização do encaminhamento. O valor predefinido é prioritário, o qual seleciona\nelementos com base em pontuações calculadas durante a ronda anterior.\n\n-h Mostrar esta ajuda
