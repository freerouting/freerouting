command_line_help=USO\n\nfreerouting [PARÂMETROS]\n\nPARÂMETROS\n\n-de <design.dsn>\nCarrega o arquivo .dsn do Specctra\n\n-di <diretório_do_projeto>\nDefine a pasta padrão para as caixas de diálogo de abertura de projetos\n\n-dr <arquivo_de_regras_de_design>\nLê regras de roteamento de um arquivo .rules\n\n-do <arquivo_de_saida>\nSalva a placa (.dsn), a sessão (.ses) ou\no script de sessão do Eagle (.scr) ao final\n\n-mp <numero_de_passes>\nDefine o limite máximo do número de passes do autorouter\nque serão executados\n\n-l <idioma>\nen" para inglês, "de" para alemão, "zh" para chinês simplificado, caso contrário é o padrão do sistema. O inglês é definido por padrão para idiomas não suportados.\n\n-mt <número_de_threads>\nDefine o tamanho do pool de threads para a otimização do roteamento. O padrão é\num a menos do que o número de processadores lógicos no sistema.\n\n-us <estratégia_de_atualização>\nGreedy, Global, Hybrid. Define a estratégia de atualização da placa para a otimização\ndo roteamento. O padrão é greedy. Quando a opção hybrid é selecionada,\noutra opção "hr" especifica a proporção híbrida.\n\n-hr <m\:n>\nDefine a proporção híbrida no formato de\n```json { "37": " \#_de_passagens_globais_otimizadas\:\#_de_passagens_priorizadas." } ```\nO padrão é 1\:1. Só é efetivo quando a estratégia híbrida\nestiver selecionado.\n\n-is <selection_strategy>\nSequencial, aleatória ou priorizada. Define a estratégia de seleção de itens\npara otimização do roteamento\: sequencial, aleatório, priorizado. O\no padrão é prioritized. A estratégia prioritária seleciona os itens com base\nnas pontuações calculadas na rodada anterior.\n\n-h Mostra esta ajuda\n
