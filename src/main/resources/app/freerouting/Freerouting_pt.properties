command_line_help=UTILIZAÇÃO\n\nfreerouting [PARÂMETROS]\n\nPARÂMETROS\n\n-de <desenho.dsn>\nCarregar o ficheiro .dsn Specctra\n\n-di <diretoria_do_desenho>\nDefinir a pasta predefinida para as caixas de diálogo de abertura de desenhos\n\n-dr <ficheiro_regras_conceçao>\nLer regras de encaminhamento a partir de um ficheiro .rules\n\n-do <ficheiro_de_saida>\nGuardar a placa (.dsn), sessão (.ses), ou\nscript do Autodesk Fusion (.scr) no final\n\n-mp <numero_de_passagens>\nDefinir o número máximo de passagens de encaminhamento automático a realizar\n\n-l <idioma>\n"en" para inglês, "de" para alemão ou "zh" para chinês simplificado; caso contrário, utiliza a predefinição do sistema. O inglês é utilizado por predefinição para idiomas não suportados.\n\n-mt <número_de_threads>\nDefine o tamanho do grupo de threads para a otimização do encaminhamento. O valor predefinido é\nmenos um do que o número de processadores lógicos no sistema.\n\n-is <estratégia_de_seleção>\nSequential ou prioritized. Define a estratégia de seleção de elementos para a\notimização do encaminhamento. O valor predefinido é sequential.\n\n-h Exibe esta ajuda
