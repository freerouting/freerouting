command_line_help=USO\n\nfreerouting [PARÁMETROS]\n\nPARÁMETROS\n\n-de <diseño.dsn>\nCarga el archivo .dsn de Specctra\n\n-di <directorio_diseño>\nEstablecer la carpeta predeterminada utilizada por los cuadros de diálogo para abrir diseños\n\n-dr <design_rules_file>\nLeer reglas de enrutado desde un archivo .rules\n\n-do <archivo_salida>\nGuarda la placa (.dsn), la sesión (.ses), o\nscript de Autodesk Fusion (.scr) al final\n\n-mp <número_de_pasadas>\nEstablece el número máximo de pasadas de enrutado automático a realizar\n\n-l <idioma>\nen" para inglés, "de" para alemán o "zh" para chino simplificado; de lo contrario, se usa el predeterminado del sistema. El inglés se usa por defecto para los idiomas no admitidos.\n\n-mt <número_de_hilos>\nEstablece el tamaño del grupo de hilos para la optimización del enrutado. El valor predeterminado es\nuno menos que el número de procesadores lógicos en el sistema.\n\n-us <updating_strategy>\nGreedy, Global o Hybrid. Establece la estrategia de actualización de la placa para el enrutado\noptimización. El valor por defecto es greedy. Cuando se selecciona híbrido,\nuse la opción «hr» para especificar la relación híbrida.\n\n-hr <m\:n>\nEstablece la proporción híbrida en el formato de\n```json { "36": " \#_pasadas_óptimas_globales\:\#_pasadas_prioritarias." } ```\nEl valor por defecto es 1\:1. Esta opción solo tiene efecto cuando el\nSe selecciona la estrategia híbrida.\n\n-is <estrategia_de_selección>\nSecuencial, aleatoria o priorizada. Establece la estrategia de selección de elementos\npara la optimización de enrutado. El valor predeterminado es prioritized, que selecciona\nelementos en función de las puntuaciones calculadas durante la ronda anterior.\n\n-h Muestra esta ayuda
