command_line_help=USO\n\nfreerouting [PARÁMETROS]\n\nPARÁMETROS\n\n-de <design.dsn>\nCarga el archivo Specctra .dsn\n\n-di <directorio_del_diseño>\nEstablece la carpeta predeterminada para los cuadros de diálogo de abrir diseño\n\n-dr <archivo_reglas_diseño>\nLee las reglas de enrutado desde un archivo .rules\n\n-do <output_file>\nGuarda la placa (.dsn), la sesión (.ses) o\nel script de sesión de Eagle (.scr) al finalizar\n\n-mp <number_of_passes>\nEstablece el límite superior para el número de pasadas de autorouter\nque se realizarán\n\n-l <language>\n«en» para inglés, «de» para alemán, «zh» para chino simplificado; de lo contrario, se usa el predeterminado del sistema. Se establece inglés por defecto para idiomas no admitidos.\n\n-mt <number_of_threads>\nEstablece el tamaño del conjunto de hilos para la optimización del enrutado. El valor predeterminado es\nuno menos que el número de procesadores lógicos del sistema.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Establece la estrategia de actualización de la placa para la optimización\ndel enrutado. El valor predeterminado es greedy. Cuando se selecciona hybrid,\nla opción «hr» especifica la proporción híbrida.\n\n-hr <m\:n>\nEstablece la proporción híbrida en el formato de\n\#_pasadas_óptimas_globales\:\#_pasadas_priorizadas.\nEl valor por defecto es 1\:1. Solo es efectivo cuando se selecciona la\nestrategia híbrida.\n\n-is <selection_strategy>\nSecuencial, aleatoria o priorizada. Establece la estrategia de selección de elementos\npara la optimización del enrutado\: secuencial, aleatoria, priorizada.\npor defecto es prioritized. La estrategia priorizada selecciona elementos basándose\nen las puntuaciones calculadas en la ronda anterior.\n\n-h Muestra esta ayuda\n
