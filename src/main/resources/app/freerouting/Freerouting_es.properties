command_line_help=USO\n\nfreerouting [PARÁMETROS]\n\nPARÁMETROS\n\n-de <design.dsn>\nCargar el archivo .dsn Specctra\n\n-di <directorio_diseño>\nEstablecer la carpeta predeterminada usada por los cuadros de diálogo para abrir diseños\n\n-dr <archivo_reglas_diseño>\nLee las reglas de enrutado desde un archivo .rules\n\n-do <output_file>\nGuarda la placa (.dsn), la sesión (.ses) o el\nscript de Autodesk Fusion (.scr) al finalizar\n\n-mp <number_of_passes>\nEstablece el número máximo de pasadas de enrutado automático a realizar\n\n-l <language>\n"en" para inglés, "de" para alemán o "zh" para chino simplificado; de lo contrario, usa el valor predeterminado del sistema. El inglés se usa de forma predeterminada para idiomas no admitidos.\n\n-mt <número_de_hilos>\nEstablece el tamaño del grupo de hilos para la optimización de rutas. El valor predeterminado es\nuno menos que el número de procesadores lógicos en el sistema.\n\n-is <estrategia_de_selección>\nSecuencial o priorizada. Establece la estrategia de selección de elementos para\nla optimización de rutas. El valor predeterminado es secuencial.\n\n-h Muestra esta ayuda
