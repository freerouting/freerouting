command_line_help=उपयोग\n\nfreerouting [पैरामीटर]\n\nपैरामीटर\n\n-de <design.dsn>\nSpecctra .dsn फ़ाइल लोड करें\n\n-di <design_directory>\nओपन-डिज़ाइन संवादों द्वारा उपयोग की जाने वाली डिफ़ॉल्ट निर्देशिका सेट करें\n\n-dr <design_rules_file>\nएक .rules फ़ाइल से रूटिंग नियम पढ़ें\n\n-do <output_file>\nअंत में बोर्ड (.dsn), सत्र (.ses), या\nAutodesk Fusion स्क्रिप्ट (.scr) सहेजें\n\n-mp <number_of_passes>\nनिष्पादित करने के लिए अधिकतम ऑटो-रूटिंग पास की संख्या निर्धारित करें\n\n-l <language>\nअंग्रेजी के लिए "en", जर्मन के लिए "de", या सरलीकृत चीनी के लिए "zh"; अन्यथा, सिस्टम डिफ़ॉल्ट का उपयोग करें। असमर्थित भाषाओं के लिए डिफ़ॉल्ट रूप से अंग्रेजी का उपयोग किया जाता है।\n\n-mt <number_of_threads>\nरूट अनुकूलन के लिए थ्रेड-पूल आकार सेट करें। डिफ़ॉल्ट मान\nसिस्टम में तार्किक प्रोसेसर की संख्या से एक कम है।\n\n-is <selection_strategy>\nSequential या prioritized। रूट अनुकूलन के लिए वस्तु-चयन रणनीति\nसेट करें। डिफ़ॉल्ट अनुक्रमिक (sequential) है।\n\n-h यह सहायता संदेश प्रदर्शित करें
