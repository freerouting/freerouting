command_line_help=उपयोग\n\nfreerouting [पैरामीटर]\n\nपैरामीटर\n\n-de <design.dsn>\nSpecctra .dsn फ़ाइल लोड करें\n\n-di <design_directory>\nओपन-डिज़ाइन संवादों द्वारा उपयोग किया जाने वाला डिफ़ॉल्ट फ़ोल्डर सेट करें\n\n-dr <design_rules_file>\nनियम फ़ाइल (.rules) से रूटिंग नियम पढ़ें\n\n-do <आउटपुट_फ़ाइल>\nबोर्ड (.dsn), सत्र (.ses), या\nअंत में Autodesk Fusion स्क्रिप्ट (.scr)\n\n-mp <pass_की_संख्या>\nनिष्पादित करने के लिए स्वचालित रूटिंग पास की अधिकतम संख्या निर्धारित करें\n\n-l <भाषा>\nअंग्रेज़ी के लिए "en", जर्मन के लिए "de", या सरलीकृत चीनी के लिए "zh"; अन्यथा, सिस्टम डिफ़ॉल्ट का उपयोग करें। असमर्थित भाषाओं के लिए डिफ़ॉल्ट रूप से अंग्रेज़ी का उपयोग किया जाता है।\n\n-mt <number_of_threads>\nरूटींग अनुकूलन के लिए थ्रेड-पूल आकार सेट करें। डिफ़ॉल्ट है\nसिस्टम में तार्किक प्रोसेसरों की संख्या से एक कम।\n\n-us <updating_strategy>\nGreedy, Global, या Hybrid। रूट के लिए बोर्ड अपडेट रणनीति सेट करें\nऑप्टिमाइजेशन। डिफ़ॉल्ट ग्रीडी (greedy) है। जब हाइब्रिड (Hybrid) चुना जाता है,\nहाइब्रिड अनुपात निर्दिष्ट करने के लिए "hr" विकल्प का उपयोग करें।\n\n-hr <m\:n>\nहाइब्रिड अनुपात का मान इस प्रारूप में सेट करें\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nडिफ़ॉल्ट 1\:1 है। यह विकल्प केवल तभी प्रभावी होता है जब\nहाइब्रिड रणनीति चुनी गई है।\n\n-is <selection_strategy>\nअनुक्रमिक (Sequential), यादृच्छिक (random), या प्राथमिकता प्राप्त (prioritized)। वस्तु-चयन रणनीति सेट करें\nरूट अनुकूलन के लिए। डिफ़ॉल्ट prioritized है, जो चुनता है\nपिछले दौर के दौरान गणना किए गए स्कोर के आधार पर वस्तुएँ।\n\n-h यह सहायता प्रदर्शित करें
