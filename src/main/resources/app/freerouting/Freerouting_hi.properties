command_line_help=उपयोग\n\nfreerouting [पैरामीटर]\n\nपैरामीटर\n\n-de <design.dsn>\nSpecctra .dsn फ़ाइल लोड करता है\n\n-di <design_directory>\nओपन डिज़ाइन संवादों के लिए डिफ़ॉल्ट फ़ोल्डर सेट करता है\n\n-dr <design_rules_file>\nएक .rules फ़ाइल से routing नियम पढ़ता है\n\n-do <output_file>\nअंत में बोर्ड (.dsn), सत्र (.ses) या\nEagle सत्र स्क्रिप्ट (.scr) को सहेजता है\n\n-mp <number_of_passes>\nऑटो-routing पास की अधिकतम सीमा निर्धारित करता है\nजो निष्पादित किए जाएंगे\n\n-l <language>\nअंग्रेजी के लिए "en", जर्मन के लिए "de", सरलीकृत चीनी के लिए "zh", अन्यथा यह सिस्टम डिफ़ॉल्ट है। असमर्थित भाषाओं के लिए डिफ़ॉल्ट रूप से अंग्रेजी सेट होती है।\n\n-mt <number_of_threads>\nरूट ऑप्टिमाइज़ेशन के लिए थ्रेड पूल का आकार सेट करता है। डिफ़ॉल्ट मान\nसिस्टम में लॉजिकल प्रोसेसर की संख्या से एक कम है।\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. रूट ऑप्टिमाइज़ेशन के लिए बोर्ड अपडेटिंग रणनीति\nसेट करता है। डिफ़ॉल्ट greedy है। जब hybrid चुना जाता है,\nतो एक अन्य विकल्प "hr" हाइब्रिड अनुपात निर्दिष्ट करता है।\n\n-hr <m\:n>\nहाइब्रिड अनुपात सेट करता है, इस प्रारूप में:\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "38": " डिफ़ॉल्ट 1\:1 है। यह केवल हाइब्रिड रणनीति होने पर ही प्रभावी होता है" } ```\nचयनित किया गया है।\n\n-is <chayan_r रणनीति>\nअनुक्रमिक (Sequential), यादृच्छिक (random), या प्राथमिकता प्राप्त (prioritized)। यह आइटम चयन रणनीति सेट करता है\nराउटिंग अनुकूलन (optimization) के लिए\: क्रमिक (sequential), यादृच्छिक (random), प्राथमिकता प्राप्त (prioritized)।\nडिफ़ॉल्ट प्राथमिकता प्राप्त (prioritized) है। प्राथमिकता रणनीति पिछले राउंड में\nगणना किए गए अंकों के आधार पर आइटम चुनती है।\n\n-h यह सहायता दिखाता है\n
