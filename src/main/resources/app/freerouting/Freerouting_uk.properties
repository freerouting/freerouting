command_line_help=ВИКОРИСТАННЯ\n\nfreerouting [ПАРАМЕТРИ]\n\nПАРАМЕТРИ\n\n-de <design.dsn>\nЗавантажити файл Specctra .dsn\n\n-di <design_directory>\nВстановити стандартну папку для діалогів відкриття проєкту\n\n-dr <design_rules_file>\nЗчитати правила трасування з файлу .rules\n\n-do <вихідний_файл>\nЗберегти плату (.dsn), сесію (.ses) або\nскрипт Autodesk Fusion (.scr) наприкінці\n\n-mp <кількість_проходів>\nВстановити максимальну кількість проходів автотрасування\n\n-l <мова>\n"en" для англійської, "de" для німецької або "zh" для спрощеної китайської; інакше використовується системне значення за замовчуванням. Для непідтримуваних мов за замовчуванням використовується англійська.\n\n-mt <number_of_threads>\nУстановити розмір пулу потоків для оптимізації трасування. За замовчуванням\nвикористовується на один менше, ніж кількість логічних процесорів у системі.\n\n-is <selection_strategy>\nSequential (послідовна) або prioritized (пріоритетна). Установити стратегію вибору елементів для\nоптимізації трасування. За замовчуванням — sequential.\n\n-h Показати цю довідку
