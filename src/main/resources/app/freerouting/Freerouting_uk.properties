command_line_help=ВИКОРИСТАННЯ\n\nfreerouting [ПАРАМЕТРИ]\n\nПАРАМЕТРИ\n\n-de <design.dsn>\nЗавантажити файл Specctra .dsn\n\n-di <каталог_проєкту>\nВстановити стандартну папку для діалогів відкриття проєкту\n\n-dr <файл_правил_проєктування>\nЗчитати правила трасування з файлу .rules\n\n-do <вихідний_файл>\nЗберегти плату (.dsn), сесію (.ses) або\nСкрипт Autodesk Fusion (.scr) наприкінці\n\n-mp <кількість_проходів>\nВстановити максимальну кількість проходів автотрасування\n\n-l <мова>\nen" для англійської, "de" для німецької або "zh" для спрощеної китайської; інакше використовується системне значення за замовчуванням. Англійська використовується за замовчуванням для непідтримуваних мов.\n\n-mt <кількість_потоків>\nВстановлює розмір пулу потоків для оптимізації маршруту. За замовчуванням:\nна один менше, ніж кількість логічних процесорів у системі.\n\n-us <updating_strategy>\nGreedy (жадібна), Global (глобальна) або Hybrid (гібридна). Встановлює стратегію оновлення плати під час трасування\nоптимізації. За замовчуванням — greedy. Якщо вибрано Hybrid,\nвикористовуйте параметр "hr", щоб вказати гібридне співвідношення.\n\n-hr <m\:n>\nВстановіть гібридне співвідношення у форматі\n```json { "36": " \#_проходів_глобальної_оптимізації\:\#_пріоритетних_проходів." } ```\nЗа замовчуванням — 1\:1. Ця опція діє лише тоді, коли\nВибрано гібридну стратегію.\n\n-is <стратегія_вибору>\n```json { "41": " Послідовна\nдля оптимізації трасування. Значення за замовчуванням — prioritized, яке вибирає\nелементи на основі оцінок, розрахованих під час попереднього раунду.\n\n-h Показати цю довідку
