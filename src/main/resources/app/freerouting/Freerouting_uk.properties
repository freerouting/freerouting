command_line_help=ВИКОРИСТАННЯ\n\nfreerouting [ПАРАМЕТРИ]\n\nПАРАМЕТРИ\n\n-de <design.dsn>\nЗавантажує файл Specctra .dsn\n\n-di <design_directory>\nЗадає стандартну папку для діалогів відкриття проєкту\n\n-dr <design_rules_file>\nЗчитує правила трасування з файлу .rules\n\n-do <вихідний_файл>\nЗберігає плату (.dsn), сесію (.ses) або\nскрипт сесії Eagle (.scr) наприкінці\n\n-mp <кількість_проходів>\nВстановлює верхню межу кількості проходів автотрасувальника,\nякі будуть виконані\n\n-l <мова>\n«en» — для англійської, «de» — для німецької, «zh» — для спрощеної китайської, інакше використовується системне значення за замовчуванням. Для непідтримуваних мов за замовчуванням встановлюється англійська.\n\n-mt <кількість_потоків>\nЗадає розмір пулу потоків для оптимізації маршрутизації. Значення за замовчуванням —\nна одиницю менше ніж кількість логічних процесорів у системі.\n\n-us <стратегія_оновлення>\nGreedy, Global, Hybrid. Встановлює стратегію оновлення плати для оптимізації\nмаршрутизації. Значення за замовчуванням — greedy. Якщо вибрано hybrid,\nінший параметр «hr» визначає співвідношення гібридного режиму.\n\n-hr <m\:n>\nУстановлює гібридне співвідношення у форматі\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "38": " За замовчуванням 1\:1. Діє лише для гібридної стратегії" } ```\nвибрано.\n\n-is <selection_strategy>\nПослідовний, випадковий або пріоритетний. Встановлює стратегію вибору елементів\nдля оптимізації маршруту: послідовна (sequential), випадкова (random), пріоритетна (prioritized).\nза замовчуванням prioritized. Стратегія prioritized вибирає елементи\nна основі оцінок, розрахованих у попередньому раунді.\n\n-h Показує цю довідку\n
