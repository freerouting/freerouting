command_line_help=SỬ DỤNG\n\nfreerouting [THAM_SỐ]\n\nTHAM SỐ\n\n-de <design.dsn>\nTải tệp .dsn của Specctra\n\n-di <design_directory>\nĐặt thư mục mặc định cho các hộp thoại mở thiết kế\n\n-dr <design_rules_file>\nĐọc các quy tắc định tuyến từ một tệp .rules\n\n-do <output_file>\nLưu bo mạch (.dsn), phiên (.ses) hoặc\nkịch bản phiên Eagle (.scr) khi kết thúc\n\n-mp <number_of_passes>\nĐặt giới hạn tối đa cho số lượt định tuyến tự động\nsẽ được thực hiện\n\n-l <language>\nen" cho tiếng Anh, "de" cho tiếng Đức, "zh" cho tiếng Trung giản thể, nếu không sẽ là mặc định của hệ thống. Tiếng Anh được thiết lập mặc định cho các ngôn ngữ không được hỗ trợ.\n\n-mt <number_of_threads>\nĐặt kích thước nhóm luồng để tối ưu hóa định tuyến. Mặc định là\nít hơn một luồng so với số bộ xử lý logic trong hệ thống.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Đặt chiến lược cập nhật bo mạch để tối ưu hóa\nđịnh tuyến. Mặc định là greedy. Khi chọn hybrid,\ntùy chọn khác "hr" sẽ chỉ định tỷ lệ lai (hybrid ratio).\n\n-hr <m\:n>\nĐặt tỷ lệ kết hợp theo định dạng\n```json { "37": " \#_lượt_tối_ưu_toàn_cục\:\#_lượt_ưu_tiên." } ```\nGiá trị mặc định là 1\:1. Nó chỉ có hiệu lực khi dùng chiến lược hỗn hợp\nđược chọn.\n\n-is <selection_strategy>\nTuần tự, ngẫu nhiên, hoặc ưu tiên. Thiết lập chiến lược chọn đối tượng\ncho tối ưu hóa định tuyến\: sequential (tuần tự), random (ngẫu nhiên), prioritized (ưu tiên).\nmặc định là prioritized (ưu tiên). Chiến lược prioritized lựa chọn các đối tượng dựa trên\nđiểm số được tính toán ở vòng trước.\n\n-h Hiển thị trợ giúp này\n
