command_line_help=CÁCH DÙNG\n\nfreerouting [THAM SỐ]\n\nTHAM SỐ\n\n-de <tập_tin_thiết_kế.dsn>\nTải tệp Specctra .dsn\n\n-di <thư_mục_thiết_kế>\nĐặt thư mục mặc định dùng cho các hộp thoại mở thiết kế\n\n-dr <tệp_quy_tắc_thiết_kế>\nĐọc các quy tắc định tuyến từ tệp .rules\n\n-do <output_file>\nLưu bo mạch (.dsn), phiên (.ses), hoặc\nkịch bản Autodesk Fusion (.scr) khi hoàn tất\n\n-mp <number_of_passes>\nĐặt số lượt định tuyến tự động tối đa cần thực hiện\n\n-l <language>\nen" cho tiếng Anh, "de" cho tiếng Đức, hoặc "zh" cho tiếng Trung giản thể; nếu không, sử dụng mặc định của hệ thống. Tiếng Anh được sử dụng mặc định cho các ngôn ngữ không được hỗ trợ.\n\n-mt <number_of_threads>\nĐặt kích thước nhóm luồng cho tối ưu hóa định tuyến. Mặc định là\nít hơn một so với số bộ xử lý logic trong hệ thống.\n\n-is <selection_strategy>\nSequential (tuần tự) hoặc prioritized (ưu tiên). Đặt chiến lược chọn mục cho\ntối ưu hóa định tuyến. Mặc định là sequential.\n\n-h Hiển thị trợ giúp này
