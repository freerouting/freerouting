command_line_help=CÁCH DÙNG\n\nfreerouting [THAM_SỐ]\n\nTHAM SỐ\n\n-de <design.dsn>\nTải tệp Specctra .dsn\n\n-di <thư_mục_thiết_kế>\nĐặt thư mục mặc định được sử dụng bởi các hộp thoại mở thiết kế\n\n-dr <design_rules_file>\nĐọc các quy tắc định tuyến từ tệp .rules\n\n-do <output_file>\nLưu bo mạch (.dsn), tệp phiên (.ses), hoặc\nKịch bản Autodesk Fusion (.scr) ở cuối\n\n-mp <số_lượt_chạy>\nĐặt số lượt định tuyến tự động tối đa cần thực hiện\n\n-l <ngôn ngữ>\nen" cho tiếng Anh, "de" cho tiếng Đức, hoặc "zh" cho tiếng Trung giản thể; nếu không, sẽ sử dụng mặc định của hệ thống. Tiếng Anh được sử dụng mặc định cho các ngôn ngữ không được hỗ trợ.\n\n-mt <so_luong_luong>\nĐặt kích thước nhóm luồng (thread-pool) cho tối ưu hóa định tuyến. Mặc định là\nít hơn một so với số lượng bộ xử lý logic trong hệ thống.\n\n-us <updating_strategy>\nGreedy, Global, hoặc Hybrid. Đặt chiến lược cập nhật bo mạch cho việc định tuyến\ntối ưu hóa. Mặc định là greedy (tham ăn). Khi chọn Hybrid,\nsử dụng tùy chọn "hr" để chỉ định tỉ lệ kết hợp.\n\n-hr <m\:n>\nĐặt tỷ lệ hỗn hợp theo định dạng\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " Mặc định là 1\:1. Tùy chọn này chỉ có hiệu lực khi" } ```\nĐã chọn chiến lược hỗn hợp.\n\n-is <selection_strategy>\nTuần tự, ngẫu nhiên hoặc ưu tiên. Đặt chiến lược chọn mục\ncho tối ưu hóa định tuyến. Mặc định là ưu tiên, lựa chọn\ncác mục dựa trên điểm số được tính toán trong vòng trước.\n\n-h Hiển thị trợ giúp này
