command_line_help=UTILIZARE\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nÎncarcă fișierul .dsn Specctra\n\n-di <design_directory>\nSetează dosarul implicit pentru dialogurile de deschidere a proiectului\n\n-dr <design_rules_file>\nCitește regulile de rutare dintr-un fișier .rules\n\n-do <fișier_ieșire>\nSalvează placa (.dsn), sesiunea (.ses) sau\nscriptul de sesiune Eagle (.scr) la final\n\n-mp <număr_de_treceri>\nSetează limita superioară a numărului de treceri ale autorouter-ului\ncare vor fi efectuate\n\n-l <limbă>\n„en” pentru engleză, „de” pentru germană, „zh” pentru chineză simplificată, altfel este valoarea implicită a sistemului. Engleza este setată implicit pentru limbile nesuportate.\n\n-mt <number_of_threads>\nSetează dimensiunea grupului de fire de execuție pentru optimizarea rutei. Valoarea implicită este\ncu unu mai mică decât numărul de procesoare logice din sistem.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Setează strategia de actualizare a plăcii pentru optimizarea\nrutei. Valoarea implicită este greedy. Când este selectat hybrid,\no altă opțiune „hr” specifică raportul hibrid.\n\n-hr <m\:n>\nSetează raportul hibrid în formatul\n\#_treceri_optimale_globale\:\#_treceri_prioritizate.\nValoarea implicită este 1\:1. Este eficient doar când este selectată\nstrategia hibridă.\n\n-is <strategie_selecție>\nSecvențială, aleatorie sau prioritizată. Setează strategia de selecție a elementelor\npentru optimizarea rutării\: secvențială, aleatorie, prioritizată.\nimplicit este prioritized. Strategia prioritară selectează elementele pe baza\nscorurilor calculate în runda anterioară.\n\n-h Afișează acest ajutor\n
