command_line_help=UTILIZARE\n\nfreerouting [PARAMETRII]\n\nPARAMETRII\n\n-de <design.dsn>\nIncarcă fișierul .dsn Specctra\n\n-di <director_proiect>\nSetează dosarul implicit folosit de casetele de dialog pentru deschiderea proiectelor\n\n-dr <fișier_reguli_proiectare>\nCitește regulile de rutare dintr-un fișier .rules\n\n-do <fișier_ieșire>\nSalvează placa (.dsn), sesiunea (.ses) sau\nscriptul Autodesk Fusion (.scr) la final\n\n-mp <număr_de_treceri>\nSetează numărul maxim de treceri ale rutării automate\n\n-l <limbă>\n„en” pentru engleză, „de” pentru germană sau „zh” pentru chineză simplificată; în caz contrar, se folosește limba implicită a sistemului. Engleza este folosită implicit pentru limbile nesuportate.\n\n-mt <number_of_threads>\nSetează dimensiunea pool-ului de fire de execuție pentru optimizarea rutării. Valoarea implicită este\nnumărul de procesoare logice din sistem minus unu.\n\n-is <selection_strategy>\nSecvențială sau prioritizată. Setează strategia de selectare a elementelor pentru\noptimizarea rutării. Valoarea implicită este secvențială.\n\n-h Afișează acest ajutor
