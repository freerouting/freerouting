command_line_help=UTILIZARE\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <proiect.dsn>\nÎncarcă fișierul Specctra .dsn\n\n-di <director_proiect>\nSetați folderul implicit utilizat de casetele de dialog pentru deschiderea proiectelor\n\n-dr <fișier_regulideproiectare>\nCitește regulile de rutare dintr-un fișier .rules\n\n-do <output_file>\nSalvează placa (.dsn), sesiunea (.ses) sau\nscript Autodesk Fusion (.scr) la final\n\n-mp <număr_de_treceri>\nSetează numărul maxim de treceri ale rutării automate\n\n-l <limbă>\nen" pentru engleză, "de" pentru germană sau "zh" pentru chineză simplificată; în caz contrar, se folosește opțiunea implicită a sistemului. Engleza este folosită implicit pentru limbile nesuportate.\n\n-mt <număr_de_fire_de_execuție>\nSetează dimensiunea pool-ului de fire de execuție pentru optimizarea rutării. Valoarea implicită este\ncu unul mai puțin decât numărul de procesoare logice din sistem.\n\n-us <updating_strategy>\nGreedy, Global sau Hybrid. Setați strategia de actualizare a plăcii pentru rutare\noptimizării. Valoarea implicită este greedy. Când este selectat Hybrid,\nutilizați opțiunea „hr” pentru a specifica raportul hibrid.\n\n-hr <m\:n>\nSetează raportul hibrid în formatul\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " Valoarea implicită este 1\:1. Această opțiune are efect doar când" } ```\nStrategia hibridă este selectată.\n\n-is <strategie_selecție>\nSecvențial, aleatoriu sau prioritizat. Setează strategia de selectare a elementelor\npentru optimizarea rutării. Valoarea implicită este prioritizată, care selectează\nelementele pe baza scorurilor calculate în timpul rundei anterioare.\n\n-h Afișează acest ajutor
