command_line_help=用法\n\nfreerouting [參數]\n\n參數\n\n-de <design.dsn>\n載入 Specctra .dsn 檔\n\n-di <design_directory>\n設定開啟設計對話方塊使用的預設資料夾\n\n-dr <design_rules_file>\n從 .rules 檔讀取佈線規則\n\n-do <output_file>\n於結束時儲存板圖 (.dsn)、工作階段 (.ses) 或\nAutodesk Fusion 指令稿 (.scr)\n\n-mp <number_of_passes>\n設定要執行的自動佈線最大輪次\n\n-l <language>\n「en」代表英文、「de」代表德文，或「zh」代表簡體中文；否則使用系統預設值。不支援的語言預設使用英文。\n\n-mt <number_of_threads>\n設定路徑最佳化的執行緒池大小。預設值為\n系統邏輯處理器數量減一。\n\n-is <selection_strategy>\nSequential 或 prioritized。設定路徑最佳化的\n項目選擇策略。預設值為 sequential。\n\n-h 顯示此說明資訊
