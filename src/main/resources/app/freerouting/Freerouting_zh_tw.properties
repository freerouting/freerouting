command_line_help=用法\n\nfreerouting [參數]\n\n參數\n\n-de <design.dsn>\n載入 Specctra .dsn 檔\n\n-di <design_directory>\n設定開啟設計對話方塊的預設資料夾\n\n-dr <design_rules_file>\n從 .rules 檔案讀取佈線規則\n\n-do <output_file>\n最後儲存板框檔 (.dsn)、工作階段檔 (.ses) 或\nEagle 工作階段指令稿 (.scr)\n\n-mp <number_of_passes>\n設定自動佈線將執行的\n最大通行（Pass）次數上限\n\n-l <language>\n「en」代表英文，「de」代表德文，「zh」代表簡體中文，否則預設為系統語言。若為不支援的語言，則預設設定為英文。\n\n-mt <number_of_threads>\n設定線路最佳化的執行緒池大小。預設值為\n比系統中的邏輯處理器數量少一個。\n\n-us <更新策略>\nGreedy、Global、Hybrid。設定佈線的電路板更新策略\n最佳化。預設為 greedy。當選擇 hybrid 時，\n另一個選項「hr」用於指定混合比例。\n\n-hr <m\:n>\n設定混合比例，格式為\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n預設值為 1\:1。僅在採用混合策略時有效\n已被選取。\n\n-is <selection_strategy>\n順序、隨機或優先處理。設定物件選取策略\n用於佈線最佳化：順序、隨機、優先。\n預設為 prioritized。優先策略會根據\n上一輪計算出的分數來選擇項目。\n\n-h 顯示此說明\n
