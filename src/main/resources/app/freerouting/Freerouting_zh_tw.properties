command_line_help=用法\n\nfreerouting [參數]\n\n參數\n\n-de <design.dsn>\n載入 Specctra .dsn 檔\n\n-di <設計目錄>\n設定開啟設計對話方塊使用的預設資料夾\n\n-dr <design_rules_file>\n從 .rules 規則檔讀取佈線規則\n\n-do <output_file>\n儲存板圖 (.dsn)、工作階段 (.ses) 或\n結束時產生 Autodesk Fusion 腳本 (.scr)\n\n-mp <pass_數量>\n設定自動佈線要執行的最大輪數\n\n-l <語言>\n「en」代表英文，「de」代表德文，或「zh」代表簡體中文；否則使用系統預設值。若為不支援的語言，預設使用英文。\n\n-mt <number_of_threads>\n設定路徑最佳化的執行緒池大小。預設值為\n比系統中邏輯處理器的數量少一個。\n\n-us <updating_strategy>\nGreedy、Global 或 Hybrid。設定佈線的板圖更新策略\n最佳化。預設為貪婪演算法 (greedy)。當選擇混合 (Hybrid) 時，\n使用「hr」選項指定混合比例。\n\n-hr <m\:n>\n設定混合比例，格式為\n```json { "36": " \#_全域最佳化輪次\:\#_優先輪次。" } ```\n```json { "37": " 預設值為 1\:1。此選項僅在下列情況生效：" } ```\n已選擇混合策略。\n\n-is <selection_strategy>\n順序、隨機或優先處理。設定項目選擇策略\n用於佈線最佳化。預設為 prioritized，其會選擇\n項目的選取是以上一輪計算出的評分為基礎。\n\n-h 顯示此說明
