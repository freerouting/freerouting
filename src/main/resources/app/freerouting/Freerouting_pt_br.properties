command_line_help=USO\n\nfreerouting [PARÂMETROS]\n\nPARÂMETROS\n\n-de <design.dsn>\nCarregar o arquivo .dsn Specctra\n\n-di <diretório_do_projeto>\nDefine a pasta padrão usada pelas caixas de diálogo para abrir projetos\n\n-dr <arquivo_regras_projeto>\nLer regras de roteamento a partir de um arquivo .rules\n\n-do <output_file>\nSalvar a placa (.dsn), sessão (.ses) ou\nScript do Autodesk Fusion (.scr) no final\n\n-mp <número_de_passagens>\nDefine o número máximo de passagens de roteamento automático a executar\n\n-l <idioma>\nen" para inglês, "de" para alemão ou "zh" para chinês simplificado; caso contrário, usará o padrão do sistema. O inglês é usado por padrão para idiomas não suportados.\n\n-mt <número_de_threads>\nDefine o tamanho do pool de threads para a otimização do roteamento. O padrão é\num a menos do que o número de processadores lógicos no sistema.\n\n-us <updating_strategy>\nGreedy, Global ou Hybrid. Define a estratégia de atualização da placa para o roteamento\notimização. O padrão é 'greedy' (ganancioso). Quando 'Hybrid' está selecionado,\nuse a opção "hr" para especificar a proporção híbrida.\n\n-hr <m\:n>\nDefine a proporção híbrida no formato de\n```json { "36": " \#_passagens_globais_ótimas\:\#_passagens_priorizadas." } ```\nO padrão é 1\:1. Esta opção só tem efeito quando o\nA estratégia híbrida foi selecionada.\n\n-is <selection_strategy>\nSequencial, aleatória ou priorizada. Define a estratégia de seleção de itens\npara otimização do roteamento. O padrão é priorizado, que seleciona\nitens com base nas pontuações calculadas durante a rodada anterior.\n\n-h Exibe esta ajuda
