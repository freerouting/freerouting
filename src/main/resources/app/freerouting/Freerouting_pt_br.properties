command_line_help=USO\n\nfreerouting [PARÂMETROS]\n\nPARÂMETROS\n\n-de <design.dsn>\nCarregar o arquivo .dsn do Specctra\n\n-di <diretorio_do_projeto>\nDefinir a pasta padrão usada pelas caixas de diálogo de abertura de projeto\n\n-dr <arquivo_regras_projeto>\nLê regras de roteamento a partir de um arquivo .rules\n\n-do <output_file>\nSalvar a placa (.dsn), sessão (.ses) ou\nScript do Autodesk Fusion (.scr) no final\n\n-mp <número_de_passagens>\nDefine o número máximo de passagens de roteamento automático a serem executadas\n\n-l <idioma>\n"en" para inglês, "de" para alemão ou "zh" para chinês simplificado; caso contrário, usa o padrão do sistema. O inglês é usado por padrão para idiomas não suportados.\n\n-mt <número_de_threads>\nDefine o tamanho do pool de threads para otimização do roteamento. O padrão é\num a menos do que o número de processadores lógicos no sistema.\n\n-is <estratégia_de_seleção>\nSequencial ou priorizada. Define a estratégia de seleção de itens para\na otimização do roteamento. O padrão é sequencial.\n\n-h Exibe esta ajuda
