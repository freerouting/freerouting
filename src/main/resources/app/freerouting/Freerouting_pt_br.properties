command_line_help=USO\n\nfreerouting [PARÂMETROS]\n\nPARÂMETROS\n\n-de <design.dsn>\nCarrega o arquivo Specctra .dsn\n\n-di <diretório_do_projeto>\nDefine a pasta padrão para as janelas de abertura de projetos\n\n-dr <arquivo_de_regras_de_design>\nLê regras de roteamento de um arquivo .rules\n\n-do <arquivo_de_saída>\nSalva a placa (.dsn), a sessão (.ses) ou\no script de sessão do Eagle (.scr) ao final\n\n-mp <número_de_passos>\nDefine o limite máximo do número de passos de autorroteamento\nque serão executados\n\n-l <idioma>\nen" para inglês, "de" para alemão, "zh" para chinês simplificado, caso contrário, será o padrão do sistema. O inglês é configurado por padrão para idiomas não suportados.\n\n-mt <number_of_threads>\nDefine o tamanho do pool de threads para a otimização de rotas. O padrão é\num a menos do que o número de processadores lógicos no sistema.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Define a estratégia de atualização da placa para a otimização\nde rotas. O padrão é greedy. Quando a opção hybrid é selecionada,\noutra opção "hr" especifica a proporção híbrida.\n\n-hr <m\:n>\nDefine a proporção do modo híbrido no formato de\n```json { "37": " \#_SEGMENTOS_DE_LINHA_NUMERADOS\:\#_passes_priorizados." } ```\n```json { "38": " O padrão é 1\:1. Só é efetivo ao usar a estratégia híbrida" } ```\nestiver selecionado.\n\n-is <selection_strategy>\nSequencial, aleatório ou priorizado. Define a estratégia de seleção de itens\npara otimização do roteamento\: sequencial, aleatório, priorizado. O\no padrão é priorizado. A estratégia priorizada seleciona itens com base\nnas pontuações calculadas na rodada anterior.\n\n-h Mostra esta ajuda\n
