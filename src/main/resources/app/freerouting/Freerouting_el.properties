command_line_help=ΧΡΗΣΗ\n\nfreerouting [ΠΑΡΑΜΕΤΡΟΙ]\n\nΠΑΡΑΜΕΤΡΟΙ\n\n-de <design.dsn>\nΦόρτωση του αρχείου Specctra .dsn\n\n-di <κατάλογος_σχεδίασης>\nΟρισμός του προεπιλεγμένου φακέλου που χρησιμοποιείται από τα παράθυρα διαλόγου ανοίγματος σχεδίασης\n\n-dr <αρχείο_κανόνων_σχεδίασης>\nΑνάγνωση κανόνων δρομολόγησης από ένα αρχείο .rules\n\n-do <αρχείο_εξόδου>\nΑποθήκευση της πλακέτας (.dsn), της συνεδρίας (.ses), ή\nΣκρίπτ Autodesk Fusion (.scr) στο τέλος\n\n-mp <number_of_passes>\nΟρισμός του μέγιστου αριθμού περασμάτων αυτόματης δρομολόγησης προς εκτέλεση\n\n-l <γλώσσα>\nen" για Αγγλικά, "de" για Γερμανικά, ή "zh" για Απλοποιημένα Κινέζικα· διαφορετικά, χρησιμοποιείται η προεπιλογή συστήματος. Τα Αγγλικά χρησιμοποιούνται ως προεπιλογή για μη υποστηριζόμενες γλώσσες.\n\n-mt <number_of_threads>\nΟρίστε το μέγεθος της δεξαμενής νημάτων (thread-pool) για τη βελτιστοποίηση δρομολόγησης. Η προεπιλογή είναι\nένα λιγότερο από τον αριθμό των λογικών επεξεργαστών στο σύστημα.\n\n-us <updating_strategy>\nGreedy, Global ή Hybrid. Ορίστε τη στρατηγική ενημέρωσης πλακέτας για τη δρομολόγηση\nβελτιστοποίησης. Η προεπιλογή είναι «greedy». Όταν επιλέγεται το Υβριδικό (Hybrid),\nχρησιμοποιήστε την επιλογή "hr" για να ορίσετε την αναλογία υβριδισμού.\n\n-hr <m\:n>\nΟρίστε την υβριδική αναλογία στη μορφή του\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " Η προεπιλογή είναι 1\:1. Αυτή η επιλογή ισχύει μόνο όταν το" } ```\nΕπιλέχθηκε η υβριδική στρατηγική.\n\n-is <selection_strategy>\nSequential, random, or prioritized. Set the item-selection strategy\nγια τη βελτιστοποίηση δρομολόγησης. Η προεπιλογή είναι prioritized, η οποία επιλέγει\nστοιχεία με βάση τις βαθμολογίες που υπολογίστηκαν στον προηγούμενο γύρο.\n\n-h Εμφάνιση αυτής της βοήθειας
