command_line_help=ΧΡΗΣΗ\n\nfreerouting [ΠΑΡΑΜΕΤΡΟΙ]\n\nΠΑΡΑΜΕΤΡΟΙ\n\n-de <design.dsn>\nΦόρτωση του αρχείου .dsn Specctra\n\n-di <design_directory>\nΟρισμός του προεπιλεγμένου φακέλου που χρησιμοποιείται από τα παράθυρα διαλόγου ανοίγματος σχεδίου\n\n-dr <design_rules_file>\nΑνάγνωση κανόνων δρομολόγησης από αρχείο .rules\n\n-do <αρχείο_εξόδου>\nΑποθήκευση της πλακέτας (.dsn), της συνεδρίας (.ses) ή του\nσεναρίου Autodesk Fusion (.scr) στο τέλος\n\n-mp <αριθμός_περασμάτων>\nΟρισμός του μέγιστου αριθμού περασμάτων αυτόματης δρομολόγησης προς εκτέλεση\n\n-l <γλώσσα>\nen" για Αγγλικά, "de" για Γερμανικά ή "zh" για Απλοποιημένα Κινεζικά· διαφορετικά, χρήση της προεπιλογής συστήματος. Τα Αγγλικά χρησιμοποιούνται ως προεπιλογή για μη υποστηριζόμενες γλώσσες.\n\n-mt <number_of_threads>\nΟρισμός του μεγέθους της πισίνας νημάτων (thread-pool) για τη βελτιστοποίηση δρομολόγησης. Η προεπιλογή είναι\nένα λιγότερο από τον αριθμό των λογικών επεξεργαστών στο σύστημα.\n\n-is <selection_strategy>\nSequential ή prioritized. Ορισμός της στρατηγικής επιλογής στοιχείων για τη\nβελτιστοποίηση δρομολόγησης. Η προεπιλογή είναι sequential.\n\n-h Εμφάνιση αυτής της βοήθειας
