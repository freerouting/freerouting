command_line_help=שימוש\n\nfreerouting [פרמטרים]\n\nפרמטרים\n\n-de <design.dsn>\nטען את קובץ ה-DSN של Specctra (קובץ .dsn)\n\n-di <design_directory>\nהגדר את תיקיית ברירת המחדל המשמשת את תיבות הדו-שיח לפתיחת תכן\n\n-dr <design_rules_file>\nקרא כללי ניתוב מקובץ ‎.rules\n\n-do <output_file>\nשמור את הלוח (‎.dsn), הסשן (‎.ses), או\nסקריפט Autodesk Fusion (‎.scr) בסיום\n\n-mp <number_of_passes>\nהגדר את המספר המרבי של מעברי הנתב האוטומטי לביצוע\n\n-l <language>\nen" לאנגלית, "de" לגרמנית, או "zh" לסינית מופשטת; אחרת, השתמש ברירת המחדל של המערכת. אנגלית משמשת כברירת מחדל עבור שפות שאינן נתמכות.\n\n-mt <number_of_threads>\nהגדר את גודל מאגר השרשורים לייעול הניתוב. ברירת המחדל היא\nאחד פחות ממספר המעבדים הלוגיים במערכת.\n\n-is <selection_strategy>\nSequential או prioritized. הגדר את אסטרטגיית בחירת הפריטים עבור\nייעול הניתוב. ברירת המחדל היא sequential.\n\n-h הצג עזרה זו
