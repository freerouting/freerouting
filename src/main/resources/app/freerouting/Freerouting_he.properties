command_line_help=שימוש\n\nfreerouting [פרמטרים]\n\nפרמטרים\n\n-de <design.dsn>\nטעינת קובץ ה-Specctra ‎.dsn\n\n-di <תיקיית_תכן>\nהגדרת תיקיית ברירת המחדל המשמשת את תיבות הדו-שיח לפתיחת תכנים\n\n-dr <design_rules_file>\nקריאת כללי ניתוב מקובץ .rules\n\n-do <output_file>\nשמור את הלוח (dsn.), את המושב (ses.), או\nסקריפט Autodesk Fusion (.scr) בסיום\n\n-mp <number_of_passes>\nהגדרת המספר המרבי של מעברי ניתוב אוטומטי לביצוע\n\n-l <שפה>\nen" עבור אנגלית, "de" עבור גרמנית, או "zh" עבור סינית מפושטת; אחרת, ייעשה שימוש ברירת המחדל של המערכת. אנגלית משמשת כברירת מחדל עבור שפות שאינן נתמכות.\n\n-mt <number_of_threads>\nקובע את גודל מאגר התהליכונים (thread-pool) עבור ייעול הניתוב. ברירת המחדל היא\nאחד פחות ממספר המעבדים הלוגיים במערכת.\n\n-us <updating_strategy>\nGreedy (חמדני), Global (גלובלי), או Hybrid (היברידי). הגדר את אסטרטגיית עדכון הלוח עבור הניתוב\nאופטימיזציה. ברירת המחדל היא greedy. כאשר חברידי (Hybrid) נבחר,\nהשתמש באפשרות "hr" כדי להגדיר את יחס ההיברידיות (hybrid ratio).\n\n-hr <m\:n>\nהגדר את היחס ההיברידי בפורמט של\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nברירת המחדל היא 1\:1. אפשרות זו פועלת רק כאשר\nנבחרה אסטרטגיה היברידית.\n\n-is <selection_strategy>\nסדרתי, אקראי או לפי עדיפות. הגדרת אסטרטגיית בחירת הפריטים\nעבור ייעול הניתוב. ברירת המחדל היא prioritized, אשר בוחרת\nפריטים בהתבסס על ציונים שחושבו במהלך הסיבוב הקודם.\n\n-h הצגת עזרה זו
