command_line_help=ব্যবহার\n\nfreerouting [প্যারামিটারসমূহ]\n\nপ্যারামিটারসমূহ\n\n-de <design.dsn>\nSpecctra .dsn ফাইলটি লোড করুন\n\n-di <design_directory>\nখোলা-ডিজাইন ডায়ালগে ব্যবহৃত ডিফল্ট ফোল্ডার সেট করুন\n\n-dr <design_rules_file>\nএকটি .rules ফাইল থেকে রাউটিং নিয়মগুলি পড়ুন\n\n-do <output_file>\nবোর্ড (.dsn), সেশন (.ses), বা\nশেষে Autodesk Fusion স্ক্রিপ্ট (.scr)\n\n-mp <number_of_passes>\nসম্পাদন করার জন্য অটো-রাউটিং পাসের সর্বাধিক সংখ্যা নির্ধারণ করুন\n\n-l <ভাষা>\nইংরেজি জন্য "en", জার্মানের জন্য "de", অথবা সরলীকৃত চাইনিজের জন্য "zh"; অন্যথায়, সিস্টেম ডিফল্ট ব্যবহার করুন। অসমর্থিত ভাষার জন্য ডিফল্ট হিসেবে ইংরেজি ব্যবহৃত হয়।\n\n-mt <থ্রেড_সংখ্যা>\nরাউট অপ্টিমাইজেশনের জন্য থ্রেড-পুল আকার নির্ধারণ করুন। ডিফল্ট হলো\nসিস্টেমে লজিক্যাল প্রসেসরের সংখ্যার চেয়ে একটি কম।\n\n-is <selection_strategy>\nধারাবাহিক (Sequential) বা অগ্রাধিকারভিত্তিক (prioritized)। আইটেম নির্বাচনের কৌশল নির্ধারণ করুন\nরাউট অপ্টিমাইজেশনের জন্য। ডিফল্ট হলো ধারাবাহিক (sequential)।\n\n-h এই সহায়তা প্রদর্শন করুন
