command_line_help=ব্যবহারবিধি\n\nfreerouting [প্যারামিটার]\n\nপ্যারামিটারসমূহ\n\n-de <design.dsn>\nSpecctra .dsn ফাইল লোড করুন\n\n-di <design_directory>\nডিজাইন খোলার ডায়ালগে ব্যবহৃত ডিফল্ট ফোল্ডার সেট করুন\n\n-dr <ডিজাইন_নিয়ম_ফাইল>\nএকটি .rules ফাইল থেকে রাউটিং নিয়ম পড়ুন\n\n-do <আউটপুট_ফাইল>\nবোর্ড (.dsn), সেশন (.ses), বা\nশেষে Autodesk Fusion স্ক্রিপ্ট (.scr)\n\n-mp <number_of_passes>\nস্বয়ংক্রিয় রাউটিংয়ের জন্য সম্পন্ন করার সর্বোচ্চ পাসের সংখ্যা নির্ধারণ করুন\n\n-l <language>\nইংরেজির জন্য "en", জার্মানের জন্য "de", অথবা সরলীকৃত চীনা ভাষার জন্য "zh"; অন্যথায়, সিস্টেম ডিফল্ট ব্যবহার করুন। অসমর্থিত ভাষার ক্ষেত্রে ডিফল্ট হিসেবে ইংরেজি ব্যবহার করা হয়।\n\n-mt <থ্রেডের_সংখ্যা>\nরাউট অপ্টিমাইজেশনের জন্য থ্রেড-পুল সাইজ নির্ধারণ করুন। ডিফল্ট হলো\nসিস্টেমে থাকা লজিক্যাল প্রসেসরের সংখ্যার চেয়ে একটি কম।\n\n-us <updating_strategy>\nGreedy, Global, বা Hybrid। রাউট করার জন্য বোর্ড আপডেট কৌশল নির্ধারণ করুন\nঅপ্টিমাইজেশন। ডিফল্ট হলো greedy। যখন Hybrid নির্বাচন করা হয়,\nহাইব্রিড অনুপাত নির্দিষ্ট করতে "hr" বিকল্পটি ব্যবহার করুন।\n\n-hr <m\:n>\nহাইব্রিড অনুপাত এই ফরম্যাটে সেট করুন\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes।" } ```\nডিফল্ট হলো 1\:1। এই বিকল্পটি কেবল তখনই কার্যকর হয় যখন\nহাইব্রিড কৌশল নির্বাচিত করা হয়েছে।\n\n-is <selection_strategy>\nধারাবাহিক (Sequential), দৈবচয়ন (random), বা অগ্রাধিকারভিত্তিক (prioritized)। আইটেম নির্বাচনের কৌশল নির্ধারণ করুন\nরাউট অপ্টিমাইজেশনের জন্য। ডিফল্ট হলো প্রায়োরিটাইজড, যা নির্বাচন করে\nপূর্ববর্তী রাউন্ডের সময় গণনা করা স্কোরের উপর ভিত্তি করে বস্তুসমূহ।\n\n-h এই সাহায্য প্রদর্শন করুন
