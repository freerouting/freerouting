command_line_help=ব্যবহার বিধি\n\nfreerouting [PARAMETERS]\n\nপ্যারামিটারসমূহ\n\n-de <design.dsn>\nSpecctra .dsn ফাইল লোড করে\n\n-di <design_directory>\nডিজাইন ওপেন করার ডায়ালগের জন্য ডিফল্ট ফোল্ডার সেট করে\n\n-dr <design_rules_file>\nএকটি .rules ফাইল থেকে রাউটিং নিয়মগুলি পড়ে\n\n-do <output_file>\nশেষে বোর্ড (.dsn), সেশন (.ses) বা\nEagle সেশন স্ক্রিপ্ট (.scr) সংরক্ষণ করে\n\n-mp <number_of_passes>\nসম্পাদিত হতে যাওয়া অটো-রাউটিং পাস সংখ্যার\nসর্বোচ্চ সীমা নির্ধারণ করে\n\n-l <language>\nইংরেজি বোঝাতে "en", জার্মানের জন্য "de", সরলীকৃত চীনা ভাষার জন্য "zh", অন্যথায় এটি সিস্টেমের ডিফল্ট ভাষা হবে। সমর্থিত নয় এমন ভাষাগুলোর জন্য ডিফল্টভাবে ইংরেজি সেট করা থাকে।\n\n-mt <number_of_threads>\nরুট অপ্টিমাইজেশনের জন্য থ্রেড পুল সাইজ সেট করে। ডিফল্ট মান হলো\nসিস্টেমে থাকা লজিক্যাল প্রসেসরের সংখ্যার চেয়ে এক কম।\n\n-us <updating_strategy>\nGreedy, Global, Hybrid। রুট অপ্টিমাইজেশনের জন্য বোর্ড আপডেট\nকৌশল নির্ধারণ করে। ডিফল্ট মান হলো greedy। যখন hybrid নির্বাচিত হয়,\nতখন অন্য বিকল্প "hr" হাইব্রিড অনুপাত (hybrid ratio) নির্দিষ্ট করে।\n\n-hr <m\:n>\nহাইব্রিড অনুপাত নির্ধারণ করে এই ফরম্যাটে\n\#_global_optimal_passes\:\#_prioritized_passes।\nডিফল্ট মান হলো 1\:1। এটি কেবল তখনই কার্যকর হয় যখন হাইব্রিড স্ট্র্যাটেজি\nনির্বাচন করা হয়।\n\n-is <selection_strategy>\nSequential, random, অথবা prioritized। রুট অপ্টিমাইজেশনের জন্য\nআইটেম সিলেকশন স্ট্র্যাটেজি সেট করে\: sequential, random, prioritized।\nডিফল্ট হলো পছন্দক্রম (prioritized)। পছন্দক্রম কৌশলটি পূর্ববর্তী রাউন্ডে গণনা করা\nস্কোরের ভিত্তিতে আইটেমগুলো নির্বাচন করে।\n\n-h এই সহায়তা নির্দেশিকা প্রদর্শন করে\n
