command_line_help=BRUK\n\nfreerouting [PARAMETRE]\n\nPARAMETRE\n\n-de <design.dsn>\nLast inn Specctra .dsn-filen\n\n-di <katalog_for_kretskort>\nAngi standardmappen som brukes av dialogbokser for å åpne design\n\n-dr <design_rules_file>\nLes rutingsregler fra en .rules-fil\n\n-do <utfil>\nLagre kretskortet (.dsn), økten (.ses), eller\nAutodesk Fusion-skript (.scr) til slutt\n\n-mp <antall_gjennomløp>\nAngi maksimalt antall gjennomløp for automatisk ruting som skal utføres\n\n-l <språk>\nen" for engelsk, "de" for tysk eller "zh" for forenklet kinesisk; ellers brukes systemets standard. Engelsk brukes som standard for språk som ikke støttes.\n\n-mt <antall_tråder>\nSett størrelsen på trådytelsen (thread pool) for ruteoptimalisering. Standard er\nén færre enn antallet logiske prosessorer i systemet.\n\n-us <updating_strategy>\nGreedy, Global eller Hybrid. Angi oppdateringsstrategi for kortet ved ruting\noptimalisering. Standard er grådig (greedy). Når Hybrid er valgt,\nbruk «hr»-alternativet for å angi hybridforholdet.\n\n-hr <m\:n>\nSett hybridforholdet i formatet\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " Standardverdien er 1\:1. Dette valget har bare effekt når" } ```\nHybridstrategi er valgt.\n\n-is <selection_strategy>\nSekvensiell, tilfeldig eller prioritert. Angi strategi for valg av objekt\nfor ruteoptimalisering. Standardverdien er prioriterte, som velger\nobjekter basert på poengsummer beregnet i forrige runde.\n\n-h Vis denne hjelpen
