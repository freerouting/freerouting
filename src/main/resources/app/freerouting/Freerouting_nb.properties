command_line_help=BRUK\n\nfreerouting [PARAMETRE]\n\nPARAMETRE\n\n-de <design.dsn>\nLast inn Specctra .dsn-filen\n\n-di <design_directory>\nAngi standardmappen som brukes av dialogbokser for å åpne design\n\n-dr <design_rules_file>\nLes ruterregler fra en .rules-fil\n\n-do <output_file>\nLagre kretskortet (.dsn), økten (.ses) eller\nAutodesk Fusion-skriptet (.scr) til slutt\n\n-mp <number_of_passes>\nAngi maksimalt antall gjennomløp for den automatiske ruteren\n\n-l <language>\nen" for engelsk, "de" for tysk eller "zh" for forenklet kinesisk; ellers brukes systemets standard. Engelsk brukes som standard for språk som ikke støttes.\n\n-mt <antal_tråder>\nAngi trådpool-størrelsen for ruteoptimalisering. Standardverdi er\nén mindre enn antallet logiske prosessorer i systemet.\n\n-is <velgestrategi>\nSekvensiell eller prioritert. Angi strategi for objektvalg ved\nruteoptimalisering. Standardverdi er sekvensiell.\n\n-h Vis denne hjelpen
