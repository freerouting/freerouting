command_line_help=HASZNÁLAT\n\nfreerouting [PARAMÉTEREK]\n\nPARAMÉTEREK\n\n-de <design.dsn>\nSpecctra .dsn fájl betöltése\n\n-di <tervtár_útvonala>\nAz alapértelmezett, terv megnyitása párbeszédpanelek által használt mappa beállítása\n\n-dr <design_rules_file>\nÚtvonalvezetési szabályok beolvasása .rules fájlból\n\n-do <kimeneti_fájl>\nMentse a lapot (.dsn), a munkamenetet (.ses), vagy\nAutodesk Fusion szkript (.scr) a végén\n\n-mp <passzok_szama>\nAz automatikus nyomvonalvezetési menetek maximális számának beállítása\n\n-l <nyelv>\nen" az angol, "de" a német vagy "zh" az egyszerűsített kínai nyelvnél; ellenkező esetben a rendszeralapértelmezett lép életbe. Nem támogatott nyelvek esetén az angol az alapértelmezett.\n\n-mt <szálak_száma>\nBeállítja a szálkészlet méretét az útvonal-optimalizáláshoz. Az alapértelmezett értéke\neggyel kevesebb, mint a rendszerben található logikai processzorok száma.\n\n-us <updating_strategy>\n```json { "30": " Greedy, Global vagy\noptimalizálást. Az alapértelmezett a greedy. Ha a Hybrid van kiválasztva,\nhasználd a "hr" opciót a hibrid arány megadásához.\n\n-hr <m\:n>\nA hibrid arány beállítása a következő formátumban:\n\#_global_optimal_passes\:\#_prioritized_passes.\n```json { "37": " Az alapértelmezett 1\:1. Ez az opció csak akkor lép életbe, ha a" } ```\nHibrid stratégia van kiválasztva.\n\n-is <selection_strategy>\nEgymás utáni, véletlenszerű vagy priorizált. Állítsa be az elem-kiválasztási stratégiát\núti útvonal-optimalizáláshoz. Az alapértelmezett a priorizált (prioritized), amely kiválasztja\nelemet a korábbi körben kiszámított pontszámok alapján.\n\n-h Ennek a súgónak a megjelenítése
