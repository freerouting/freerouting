command_line_help=HASZNÁLAT\n\nfreerouting [PARAMÉTEREK]\n\nPARAMÉTEREK\n\n-de <design.dsn>\nA Specctra .dsn fájl betöltése\n\n-di <design_directory>\nA terv megnyitása párbeszédablakok által használt alapértelmezett mappa beállítása\n\n-dr <design_rules_file>\nA nyomvonalvezetési szabályok beolvasása egy .rules fájlból\n\n-do <kimeneti_fájl>\nA lap (.dsn), a munkamenet (.ses) vagy az\nAutodesk Fusion szkript (.scr) mentése a végén\n\n-mp <menetek_száma>\nAz automatikus nyomvonalvezetési menetek maximális számának beállítása\n\n-l <nyelv>\nen" az angolhoz, "de" a némethez vagy "zh" az egyszerűsített kínaihoz; egyébként a rendszeralapértelmezett használandó. A nem támogatott nyelvekhez alapértelmezés szerint az angol használatos.\n\n-mt <szalak_szama>\nA szálkészlet méretének beállítása a nyomvonal-optimalizáláshoz. Az alapértelmezett érték\neggyel kevesebb, mint a rendszerben található logikai processzorok száma.\n\n-is <kivalasztasi_strategia>\nA következők egyike: Sequential (szekvenciális) vagy Prioritized (prioritásos). Az elemkiválasztási stratégia beállítása a\nnyomvonal-optimalizáláshoz. Az alapértelmezett érték a szekvenciális.\n\n-h Ennek a súgónak a megjelenítése
