command_line_help=HASZNÁLAT\n\nfreerouting [PARAMÉTEREK]\n\nPARAMÉTEREK\n\n-de <design.dsn>\nBetölti a Specctra .dsn-fájlt\n\n-di <design_directory>\nBeállítja az alapértelmezett mappát a megnyitási párbeszédablakokhoz\n\n-dr <design_rules_file>\nBeolvassa a vezetési szabályokat egy .rules fájlból\n\n-do <output_file>\nMenti a kártyát (.dsn), a munkamenetet (.ses) vagy\naz Eagle munkamenet-scriptet (.scr) a végén\n\n-mp <number_of_passes>\nBeállítja a végrehajtandó automatikus vezetési menetek\nszámának felső korlátját\n\n-l <language>\nen" az angol, "de" a német, "zh" az egyszerűsített kínai nyelvhez, egyébként a rendszeralapértelmezett. Nem támogatott nyelvek esetén alapértelmezés szerint az angol van beállítva.\n\n-mt <szálak_száma>\nBeállítja a szálkészlet méretét az útvonal-optimalizáláshoz. Az alapértelmezett érték\neggyel kevesebb, mint a rendszerben található logikai processzorok száma.\n\n-us <frissítési_stratégia>\nGreedy (Kapzsi), Global (Glóbális), Hybrid (Hibrid). Beállítja a kártyafrissítési stratégiát az útvonal-\noptimalizáláshoz. Az alapértelmezett a greedy (kapzsi). Ha a hybrid (hibrid) van kiválasztva,\negy másik opció, a "hr" adja meg a hibrid arányt.\n\n-hr <m\:n>\nBeállítja a hibrid arányt a következő formátumban:\n\#_globális_optimális_menetek\:\#_prioritásos_menetek.\nAz alapértelmezett érték 1\:1. Csak akkor érvényes, ha a hibrid stratégia\nvan kiválasztva.\n\n-is <kiválasztási_stratégia>\nSequential, random, vagy prioritized. Beállítja az elem kiválasztási stratégiáját\naz útvonal-optimalizáláshoz\: sequential, random, prioritized. A\naz alapértelmezett a priorizált. A priorizált stratégia az előző körben\nkiszámított pontszámok alapján választja ki az elemeket.\n\n-h Megjeleníti ezt a súgót\n
