command_line_help=USAGE\n\n  freerouting [PARAMETERS]\n\nPARAMETERS\n\n  -de <design.dsn>\n      Load the Specctra .dsn file\n\n  -di <design_directory>\n      Set the default folder used by open-design dialogs\n\n  -dr <design_rules_file>\n      Read routing rules from a .rules file\n\n  -do <output_file>\n      Save the board (.dsn), session (.ses), or\n      EAGLE session script (.scr) at the end\n\n  -mp <number_of_passes>\n      Set the maximum number of autorouting passes to perform\n\n  -l  <language>\n      "en" for English, "de" for German, or "zh" for Simplified Chinese; otherwise, use the system default. English is used by default for unsupported languages.\n\n  -mt <number_of_threads>\n      Set the thread-pool size for route optimization. The default is\n      one fewer than the number of logical processors in the system.\n\n  -us <updating_strategy>\n      Greedy, Global, or Hybrid. Set the board update strategy for route\n      optimization. The default is greedy. When Hybrid is selected,\n      use the "hr" option to specify the hybrid ratio.\n\n  -hr <m\:n>\n      Set the hybrid ratio in the format of\n      \#_global_optimal_passes\:\#_prioritized_passes.\n      The default is 1\:1. This option is effective only when the\n      Hybrid strategy is selected.\n\n  -is <selection_strategy>\n      Sequential, random, or prioritized. Set the item-selection strategy\n      for route optimization. The default is prioritized, which selects\n      items based on scores calculated during the previous round.\n\n  -h Display this help
