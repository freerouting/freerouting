command_line_help=POUŽITIE\n\nfreerouting [PARAMETRE]\n\nPARAMETRE\n\n-de <design.dsn>\nNačítať súbor Specctra .dsn\n\n-di <design_directory>\nNastaviť predvolený priečinok pre dialógy otvorenia návrhu\n\n-dr <design_rules_file>\nNačítať pravidlá smerovania zo súboru .rules\n\n-do <výstupný_súbor>\nUložiť dosku (.dsn), reláciu (.ses) alebo\nskript pre Autodesk Fusion (.scr) na konci\n\n-mp <počet_prechodov>\nNastaviť maximálny počet prechodov automatického smerovača\n\n-l <jazyk>\n"en" pre angličtinu, "de" pre nemčinu alebo "zh" pre zjednodušenú čínštinu; inak sa použije východiskový jazyk systému. Pre nepodporované jazyky sa predvolene použije angličtina.\n\n-mt <počet_vlákien>\nNastaví veľkosť fondu vlákien na optimalizáciu smerovania. Výchozia hodnota je\no jedno menej ako počet logických procesorov v systéme.\n\n-is <stratégia_výberu>\nSequential alebo prioritized. Nastaví stratégiu výberu prvkov pre\noptimalizáciu smerovania. Výchozia hodnota je sequential.\n\n-h Zobrazí túto nápovedu
