command_line_help=POUŽITIE\n\nfreerouting [PARAMETRE]\n\nPARAMETRE\n\n-de <design.dsn>\nNačítať súbor Specctra .dsn\n\n-di <adresár_návrhu>\nNastaviť predvolený priečinok používaný dialógmi na otvorenie návrhu\n\n-dr <design_rules_file>\nNačítanie pravidiel smerovania zo súboru .rules\n\n-do <výstupný_súbor>\nUložiť dosku (.dsn), reláciu (.ses) alebo\nskript Autodesk Fusion (.scr) na konci\n\n-mp <počet_prechodov>\nNastaví maximálny počet prechodov automatického smerovania, ktoré sa majú vykonať\n\n-l <jazyk>\nen" pre angličtinu, "de" pre nemčinu alebo "zh" pre zjednodušenú čínštinu; inak sa použije systémové nastavenie. Pre nepodporované jazyky sa predvolene použije angličtina.\n\n-mt <počet_vlákien>\nNastaví veľkosť fondu vlákien pre optimalizáciu trasy. Predvolená hodnota je\no jeden menej, než je počet logických procesorov v systéme.\n\n-us <updating_strategy>\nGreedy, Global alebo Hybrid. Nastaví stratégiu aktualizácie dosky pre smerovanie\noptimalizácie. Predvolená možnosť je chamtivá (greedy). Ak je zvolený Hybrid,\npoužite možnosť "hr" na špecifikáciu hybridného pomeru.\n\n-hr <m\:n>\nNastavenie hhybridného pomeru vo formáte\n```json { "36": " \#_globálnych_optimálnych_prechodov\:\#_prioritizovaných_prechodov." } ```\n```json { "37": " Vývolenská hodnota je 1\:1. Táto voľba je účinná len vtedy, keď" } ```\nJe zvolená hybridná stratégia.\n\n-is <strategia_vyberu>\nPostupný, náhodný alebo s prioritou. Nastaví stratégiu výberu prvkov\npre optimalizáciu trasy. Predvolená hodnota je prioritized, čo vyberie\nprvky na základe skóre vypočítaného počas predchádzajúceho kola.\n\n-h Zobraziť túto nápovedu
