command_line_help=UPOTREBA\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nUčitava Specctra .dsn datoteku\n\n-di <design_directory>\nPostavlja zadani direktorij koji koriste dijalozi za otvaranje projekta\n\n-dr <design_rules_file>\nČitanje pravila provlačenja vodova iz .rules datoteke\n\n-do <output_file>\nSpremi tiskanu pločicu (.dsn), sesiju (.ses) ili\nAutodesk Fusion skriptu (.scr) na kraju\n\n-mp <number_of_passes>\nPostavi maksimalni broj prolaza automatskog provlačenja vodova\n\n-l <language>\nen" za engleski, "de" za njemački ili "zh" za pojednostavljeni kineski; u suprotnom se koristi zadana postavka sustava. Engleski se zadano koristi za nepodržane jezike.\n\n-mt <broj_dretvi>\nPostavite veličinu skupa dretvi za optimizaciju provlačenja. Zadana vrijednost je\nza jedan manje od broja logičkih procesora u sustavu.\n\n-is <strategija_odabira>\nSlijedno ili po prioritetu (Sequential / prioritized). Postavite strategiju odabira elemenata za\noptimizaciju provlačenja. Zadana vrijednost je slijedna (sequential).\n\n-h Prikaži ovu pomoć
