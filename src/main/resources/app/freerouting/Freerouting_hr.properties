command_line_help=UPOTREBA\n\nfreerouting [PARAMETRI]\n\nPARAMETRI\n\n-de <design.dsn>\nUčitava Specctra .dsn datoteku\n\n-di <direktorij_projekta>\nPostavi zadane mape koje se koriste u dijalozima za otvaranje projekata\n\n-dr <datoteka_pravila_projekta>\nČitanje pravila provlačenja vodova iz datoteke .rules\n\n-do <izlazna_datoteka>\nSpremite pločicu (.dsn), sesiju (.ses) ili\nAutodesk Fusion skriptu (.scr) na kraju\n\n-mp <broj_prolaza>\nPostavite maksimalni broj prolaza automatskog provlačenja vodova\n\n-l <jezik>\nen" za engleski, "de" za njemački ili "zh" za pojednostavljeni kineski; u suprotnom koristi zadane postavke sustava. Engleski se koristi prema zadanim postavkama za podržane jezike.\n\n-mt <broj_dretvi>\nPostavite veličinu skupa niti za optimizaciju provlačenja vodova. Zadana vrijednost je\njedan manje od broja logičkih procesora u sustavu.\n\n-us <updating_strategy>\nGreedy, Global ili Hybrid. Postavite strategiju ažuriranja pločice za provlačenje\noptimizacije. Zadano je pohlepno (greedy). Kada je odabran Hibridno (Hybrid),\nupotrijebite opciju "hr" za određivanje omjera hibridnog provlačenja.\n\n-hr <m\:n>\nPostavite hibridni omjer u formatu\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " Zadana vrijednost je 1\:1. Ova opcija ima učinka samo kada je" } ```\nOdabrana je hibridna strategija.\n\n-is <strategija_odabira>\nSlijedna, nasumična ili s prioritetom. Postavlja strategiju odabira elemenata\nza optimizaciju provlačenja vodova. Zadana vrijednost je prioritized, što odabire\nelemenata na temelju ocjena izračunatih tijekom prethodnog kruga.\n\n-h Prikaži ovu pomoć
