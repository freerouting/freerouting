command_line_help=UTILISATION\n\nfreerouting [PARAMÈTRES]\n\nPARAMÈTRES\n\n-de <design.dsn>\nCharger le fichier .dsn Specctra\n\n-di <design_directory>\nDéfinir le dossier par défaut utilisé par les boîtes de dialogue d'ouverture de fichier\n\n-dr <design_rules_file>\nLire les règles de routage depuis un fichier .rules\n\n-do <fichier_de_sortie>\nEnregistrer la carte (.dsn), la session (.ses) ou\nle script Autodesk Fusion (.scr) à la fin\n\n-mp <nombre_de_passes>\nDéfinir le nombre maximal de passes d’autoroutage à exécuter\n\n-l <langue>\n« en » pour l’anglais, « de » pour l’allemand ou « zh » pour le chinois simplifié ; sinon, utiliser la langue par défaut du système. L’anglais est utilisé par défaut pour les langues non prises en charge.\n\n-mt <number_of_threads>\nDéfinit la taille du pool de threads pour l'optimisation du routage. La valeur par défaut est\négale au nombre de processeurs logiques du système moins un.\n\n-is <selection_strategy>\nSequential ou prioritized. Définit la stratégie de sélection des éléments pour\nl'optimisation du routage. La valeur par défaut est sequential.\n\n-h Afficher cet aide-mémoire
