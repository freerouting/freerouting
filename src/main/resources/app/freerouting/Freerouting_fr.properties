command_line_help=UTILISATION\n\nfreerouting [PARAMÈTRES]\n\nPARAMÈTRES\n\n-de <design.dsn>\nCharge le fichier Specctra .dsn\n\n-di <répertoire_de_conception>\nDéfinit le dossier par défaut pour les boîtes de dialogue d'ouverture de conception\n\n-dr <fichier_règles_de_conception>\nLit les règles de routage à partir d'un fichier .rules\n\n-do <output_file>\nEnregistre la carte (.dsn), la session (.ses) ou\nle script de session Eagle (.scr) à la fin\n\n-mp <number_of_passes>\nDéfinit la limite supérieure du nombre de passes d'autoroutage\nqui seront effectuées\n\n-l <language>\nen" pour l'anglais, "de" pour l'allemand, "zh" pour le chinois simplifié, sinon c'est la langue par défaut du système. L'anglais est défini par défaut pour les langues non prises en charge.\n\n-mt <number_of_threads>\nDéfinit la taille du pool de threads pour l'optimisation du routage. La valeur par défaut est\nle nombre de processeurs logiques du système moins un.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Définit la stratégie de mise à jour de la carte pour l'optimisation\ndu routage. La valeur par défaut est greedy. Lorsque hybrid est sélectionné,\nl'option « hr » spécifie le ratio hybride.\n\n-hr <m\:n>\nDéfinit le ratio hybride au format\n\#_passes_optimales_globales\:\#_passes_priorisées.\nLa valeur par défaut est 1\:1. N'est effectif que si la stratégie hybride\nest sélectionnée.\n\n-is <sélection_stratégie>\nSequential, random, ou prioritized. Définit la stratégie de sélection d'éléments\npour l'optimisation de route \: sequential, random, prioritized. La\nla stratégie par défaut est « prioritized ». La stratégie prioritisée sélectionne\nles éléments en fonction des scores calculés lors de la passe précédente.\n\n-h Affiche cet aide\n
