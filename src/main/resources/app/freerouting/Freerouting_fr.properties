command_line_help=UTILISATION\n\nfreerouting [PARAMÈTRES]\n\nPARAMÈTRES\n\n-de <design.dsn>\nCharger le fichier .dsn Specctra\n\n-di <dossier_de_conception>\nDéfinir le dossier par défaut utilisé par les dialogues d'ouverture de conception\n\n-dr <fichier_règles_de_conception>\nLire les règles de routage à partir d’un fichier .rules\n\n-do <fichier_sortie>\nEnregistrer la carte (.dsn), la session (.ses) ou\nscript Autodesk Fusion (.scr) à la fin\n\n-mp <nombre_de_passes>\nDéfinir le nombre maximal de passes d’autoroutage à effectuer\n\n-l <langue>\nen" pour l’anglais, "de" pour l’allemand ou "zh" pour le chinois simplifié ; sinon, utilise la langue par défaut du système. L’anglais est utilisé par défaut pour les langues non prises en charge.\n\n-mt <nombre_de_threads>\nDéfinir la taille du pool de threads pour l’optimisation du routage. La valeur par défaut est\nun de moins que le nombre de processeurs logiques du système.\n\n-us <updating_strategy>\nGreedy, Global ou Hybrid. Définit la stratégie de mise à jour de la carte pour le routage\nl’optimisation. La valeur par défaut est gloutonne (greedy). Quand Hybride est sélectionné,\nutilisez l'option « hr » pour spécifier le ratio hybride.\n\n-hr <m\:n>\nDéfinit le ratio hybride sous le format\n```json { "36": " \#_passes_optimales_globales\:\#_passes_prioritaires." } ```\n```json { "37": " Par défaut, la valeur est 1\:1. Cette option n’est effective que lorsque le" } ```\nLa stratégie hybride est sélectionnée.\n\n-is <selection_strategy>\nSéquentiel, aléatoire ou priorisé. Définit la stratégie de sélection des éléments\npour l’optimisation du routage. La valeur par défaut est « prioritized », qui sélectionne\néléments basés sur les scores calculés lors du tour précédent.\n\n-h Afficher cet aide-mémoire
