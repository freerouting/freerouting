command_line_help=KÄYTTÖ\n\nfreerouting [PARAMETRIT]\n\nPARAMETRIT\n\n-de <design.dsn>\nLataa Specctra .dsn -tiedosto\n\n-di <suunnitteluhakemisto>\nMääritä oletuskansio, jota käytetään avaa suunnittelu -valintaikkunoissa\n\n-dr <design_rules_file>\nLue reitityssäännöt .rules-tiedostosta\n\n-do <output_file>\nTallenna levy (.dsn), istunto (.ses) tai\nAutodesk Fusion -skripti (.scr) lopussa\n\n-mp <pass_maara>\nMääritä automaattisen reitityksen suoritettavien kierrosten enimmäismäärä\n\n-l <kieli>\nen" englanniksi, "de" saksaksi tai "zh" yksinkertaistetulle kiinalle; muussa tapauksessa käytetään järjestelmän oletusta. Englantia käytetään oletuksena kielille, joita ei tueta.\n\n-mt <säikeiden_määrä>\nAseta säiepoolin koko reitin optimoinnille. Oletusarvo on\nyhtä vähemmän kuin järjestelmän loogisten suorittimien määrä.\n\n-us <updating_strategy>\nGreedy, Global tai Hybrid. Aseta levyn päivitysstrategia reititykselle\noptimointi. Oletus on ahne (greedy). Kun valittuna on hybridi,\nkäytä optiona "hr" määrittääksesi hybridisuhteen.\n\n-hr <m\:n>\nAseta hybridisuhde muodossa\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nOletusarvo on 1\:1. Tämä valitsin on voimassa vain, kun\nValittuna on hybridistrategia.\n\n-is <selection_strategy>\nJärjestelmällinen, satunnainen tai priorisoitu. Aseta kohteen valintastrategia\nreitityksen optimointia varten. Oletusarvo on prioritized, joka valitsee\nkohteet edellisellä kierroksella laskettujen pisteiden perusteella.\n\n-h Näytä tämä ohje
