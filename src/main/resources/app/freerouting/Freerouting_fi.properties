command_line_help=KÄYTTÖ\n\nfreerouting [PARAMETRIT]\n\nPARAMETRIT\n\n-de <design.dsn>\nLataa Specctra .dsn -tiedosto\n\n-di <design_directory>\nAseta avaa suunnittelu -valintaikkunoiden oletuskansio\n\n-dr <design_rules_file>\nLue reitityssäännöt .rules-tiedostosta\n\n-do <tulostiedosto>\nTallenna levy (.dsn), istunto (.ses) tai\nAutodesk Fusion -skripti (.scr) lopussa\n\n-mp <kierrosten_määrä>\nAseta automaattireitittimen suoritettavien enimmäiskierrosten määrä\n\n-l <kieli>\nen" englannille, "de" saksalle tai "zh" yksinkertaistetulle kiinalle; muuten käytetään järjestelmän oletusta. Englantia käytetään oletuksena kielille, joita ei tueta.\n\n-mt <säikeiden_määrä>\nAseta säikeiden määrä reitin optimoinnille. Oletusarvo on\nyhtä pienempi kuin järjestelmän loogisten suorittimien määrä.\n\n-is <valintastrategia>\nSequential (peräkkäinen) tai prioritized (priorisoitu). Aseta kohteiden valintastrategia\nreitin optimoinnille. Oletusarvo on sequential.\n\n-h Näytä tämä ohje
