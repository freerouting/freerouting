command_line_help=BRUG\n\nfreerouting [PARAMETRE]\n\nPARAMETRE\n\n-de <design.dsn>\nIndlæs Specctra .dsn-filen\n\n-di <designmappe>\nAngiv standardmappen, der bruges af dialogbunde til åbning af design\n\n-dr <designregelfil>\nLæs routingregler fra en .rules-fil\n\n-do <output_file>\nGem printkortet (.dsn), sessionen (.ses) eller\nAutodesk Fusion-skriptet (.scr) til sidst\n\n-mp <number_of_passes>\nAngiv det maksimale antal automatisk ruter-gennemløb, der skal udføres\n\n-l <language>\nen" for engelsk, "de" for tysk eller "zh" for forenklet kinesisk; ellers bruges systemets standard. Engelsk bruges som standard for sprog, der ikke understøttes.\n\n-mt <number_of_threads>\nAngiv størrelsen på trådpuljen til sporoptimering. Standardværdien er\nén mindre end antallet af logiske processorer i systemet.\n\n-is <selection_strategy>\nSequential eller prioritized. Angiv objektudvælgelsesstrategien for\nsporoptimering. Standardværdien er sequential.\n\n-h Vis denne hjælp
