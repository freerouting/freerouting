command_line_help=BRUG\n\nfreerouting [PARAMETRE]\n\nPARAMETRE\n\n-de <design.dsn>\nIndlæs Specctra .dsn-filen\n\n-di <design_stikatalog>\nIndstil standardmappen, der bruges af åbn design-dialoger\n\n-dr <designregelfil>\nLæs routingregler fra en .rules-fil\n\n-do <udgangsfil>\nGem kortet (.dsn), sessionen (.ses) eller\nAutodesk Fusion-script (.scr) til sidst\n\n-mp <antal_gennemløb>\nIndstil det maksimale antal automatisk sporlægnings-gennemløb, der skal udføres\n\n-l <sprog>\nen" for engelsk, "de" for tysk eller "zh" for forenklet kinesisk; ellers bruges systemstandarden. Engelsk bruges som standard for ikkestøttede sprog.\n\n-mt <antal_tråde>\nAngiv trådpuljestørrelsen for ruteoptimering. Standardværdien er\nén færre end antallet af logiske processorer i systemet.\n\n-us <updating_strategy>\nGreedy, Global eller Hybrid. Angiv opdateringsstrategien for kortet til sporlægning\noptimering. Standardværdien er grådig (greedy). Når Hybrid er valgt,\nbrug tilvalget "hr" til at angive hybridforholdet.\n\n-hr <m\:n>\nAngiv hybridforholdet i formatet\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nStandardværdien er 1\:1. Denne indstilling har kun virkning, når\nHybridstrategi er valgt.\n\n-is <udvalgsstrategi>\nSekventiel, vilkårlig eller prioriteret. Indstil strategien for emnevalg\ntil sporoptimering. Standardværdien er prioriteret, som vælger\nelementer baseret på scores beregnet under den foregående runde.\n\n-h Vis denne hjælp
