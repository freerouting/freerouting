command_line_help=KULLANIM\n\nfreerouting [PARAMETRELER]\n\nPARAMETRELER\n\n-de <tasarım.dsn>\nSpecctra .dsn dosyasını yükler\n\n-di <tasarım_dizini>\nTasarım açma iletişim kutularının varsayılan klasörünü ayarlar\n\n-dr <tasarım_kuralları_dosyası>\nYönlendirme kurallarını bir .rules dosyasından oku\n\n-do <output_file>\nKartı (.dsn), oturumu (.ses) veya\nAutodesk Fusion betiğini (.scr) sonunda kaydet\n\n-mp <number_of_passes>\nYürütülecek azami otomatik yönlendirme geçiş sayısını ayarla\n\n-l <language>\nİngilizce için "en", Almanca için "de" veya Basitleştirilmiş Çince için "zh"; aksi takdirde sistem varsayılanını kullanın. Desteklenmeyen diller için varsayılan olarak İngilizce kullanılır.\n\n-mt <iş_parçacığı_sayısı>\nYönlendirme iyileştirmesi için iş parçacığı havuzu boyutunu ayarlar. Varsayılan,\nsistemdeki mantıksal işlemci sayısından bir eksiktir.\n\n-is <seçim_stratejisi>\nArdışık (Sequential) veya öncelikli (prioritized). Yönlendirme iyileştirmesi\niçin öğe seçim stratejisini ayarlar. Varsayılan ardışıktır.\n\n-h Bu yardımı görüntüler
