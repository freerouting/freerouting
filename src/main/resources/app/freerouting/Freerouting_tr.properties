command_line_help=KULLANIM\n\nfreerouting [PARAMETRELER]\n\nPARAMETRELER\n\n-de <tasarim.dsn>\nSpecctra .dsn dosyasını yükleyin\n\n-di <tasarım_dizini>\nTasarım aç penceresi için varsayılan klasörü ayarlayın\n\n-dr <tasarım_kuralları_dosyası>\nYönlendirme kurallarını bir .rules dosyasından oku\n\n-do <çıktı_dosyası>\nKartı (.dsn), oturumu (.ses) veya\nSonunda Autodesk Fusion betiği (.scr)\n\n-mp <pass_sayısı>\nGerçekleştirilecek azami otomatik yönlendirme geçiş sayısını ayarlar\n\n-l <dil>\nİngilizce için "en", Almanca için "de" veya Basitleştirilmiş Çince için "zh"; aksi takdirde sistem varsayılanını kullanın. Desteklenmeyen diller için varsayılan olarak İngilizce kullanılır.\n\n-mt <iş_parçacığı_sayısı>\nRota iyileştirmesi için iş parçacığı havuzu boyutunu ayarlayın. Varsayılan değer:\nsistemdeki mantıksal işlemci sayısından bir eksik.\n\n-us <güncelleme_stratejisi>\nGreedy, Global veya Hybrid. Yönlendirme için kart güncelleme stratejisini belirleyin\niyileştirme. Varsayılan değer greedy (Açgözlü)'dir. Hibrit seçildiğinde,\nKarma oranı belirtmek için "hr" seçeneğini kullanın.\n\n-hr <m\:n>\nHibrit oranını şu biçimde ayarlayın:\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " Varsayılan değer 1\:1 şeklindedir. Bu seçenek yalnızca şu durumda etkilidir:" } ```\nKarma strateji seçildi.\n\n-is <selection_strategy>\nSequential, random, or prioritized. Set the item-selection strategy\nrota iyileştirmesi için. Varsayılan seçenektir:\nitems based on scores calculated during the previous round.\n\n-h Bu yardımı görüntüle
