command_line_help=KULLANIM\n\nfreerouting [PARAMETRELER]\n\nPARAMETRELER\n\n-de <design.dsn>\nSpecctra .dsn dosyasını yükler\n\n-di <tasarım_dizini>\nTasarım açma iletişim pencereleri için varsayılan klasörü ayarlar\n\n-dr <tasarım_kuralları_dosyası>\nYönlendirme kurallarını bir .rules dosyasından okur\n\n-do <çıkış_dosyası>\nSonunda devreyi (.dsn), oturumu (.ses) veya\nEagle oturum betiğini (.scr) kaydeder\n\n-mp <geçiş_sayısı>\nÇalıştırılacak otomatik yönlendirme geçiş sayısının\nüst sınırını belirler\n\n-l <dil>\nİngilizce için "en", Almanca için "de", Basitleştirilmiş Çince için "zh", aksi takdirde sistem varsayılanıdır. Desteklenmeyen diller için varsayılan olarak İngilizce ayarlanır.\n\n-mt <iş_parçacığı_sayısı>\nRota optimizasyonu için iş parçacığı havuzu boyutunu ayarlar. Varsayılan değer:\nsistemdeki mantıksal işlemci sayısından bir eksik.\n\n-us <güncelleme_stratejisi>\nGreedy, Global, Hybrid. Yönlendirme için kart güncelleme stratejisini ayarlar\noptimization. Varsayılan değer greedy seçeneğidir. hybrid seçildiğinde,\nbaşka bir seçenek olan "hr" hibrit oranını belirtir.\n\n-hr <m\:n>\nKarma oranını şu biçimde ayarlar:\n\#_genel_optimum_geçiş_sayısı\:\#_önceliklendirilen_geçiş_sayısı.\nVarsayılan değer 1\:1'dir. Yalnızca karma strateji\nseçildiğinde etkilidir.\n\n-is <seçim_stratejisi>\nSequential, random veya prioritized. Rota iyileştirmesi için\nöğe seçim stratejisini ayarlar\: sequential, random, prioritized.\nvarsayılan, önceliklendirilmiştir. Önceliklendirilen strateji,\nönceki turda hesaplanan puanlara göre öğeleri seçer.\n\n-h Bu yardımı gösterir\n
