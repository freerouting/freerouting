command_line_help=ÚS\n\nfreerouting [PARÀMETRES]\n\nPARÀMETRES\n\n-de <design.dsn>\nCarrega el fitxer DSN de Specctra\n\n-di <directori_de_disseny>\nDefineix la carpeta per defecte utilitzada pels diàlegs d'obrir disseny\n\n-dr <design_rules_file>\nLlegeix les regles d'encaminament des d'un fitxer de regles (.rules)\n\n-do <output_file>\nDeseu la placa (.dsn), la sessió (.ses) o\nscript d'Autodesk Fusion (.scr) al final\n\n-mp <nombre_de_passades>\nDefineix el nombre màxim de passades d'encaminament automàtic a realitzar\n\n-l <idioma>\nen" per a anglès, "de" per a alemany o "zh" per a xinès simplificat; altrament, s'utilitza el valor per defecte del sistema. L'anglès s'utilitza per defecte en els idiomes no admesos.\n\n-mt <nombre_de_fils>\nDefineix la mida del conjunt de fils per a l'optimització de l'encaminament. Per defecte és\nun menys que el nombre de processadors lògics del sistema.\n\n-us <updating_strategy>\nGreedy, Global o Hybrid. Defineix l'estratègia d'actualització de la placa per a les passades\nd’optimització. El valor per defecte és greedy. Quan se selecciona Hybrid,\nutilitzeu l'opció «hr» per especificar la relació híbrida.\n\n-hr <m\:n>\nDefineix la relació híbrida amb el format\n```json { "36": " \#_passades_òptimes_globals\:\#_passades_prioritzades." } ```\nEl valor per defecte és 1\:1. Aquesta opció només és efectiva quan el\nS'ha seleccionat l'estratègia híbrida.\n\n-is <estratègia_selecció>\nSeqüencial, aleatòria o prioritzada. Defineix l’estratègia de selecció d’elements\nper a l'optimització de l'encaminament. El valor per defecte és prioritized, que selecciona\nelements a partir de les puntuacions calculades a la ronda anterior.\n\n-h Mostra aquesta ajuda
