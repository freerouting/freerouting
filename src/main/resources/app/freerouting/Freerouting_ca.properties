command_line_help=ÚS\n\nfreerouting [PARÀMETRES]\n\nPARÀMETRES\n\n-de <design.dsn>\nCarrega el fitxer .dsn de Specctra\n\n-di <directori_disseny>\nDefineix la carpeta per defecte utilitzada pels diàlegs d'obrir disseny\n\n-dr <fitxer_regles_disseny>\nLlegeix les regles d'encaminament d'un fitxer .rules\n\n-do <output_file>\nDesa la placa (.dsn), la sessió (.ses) o el\nscript d'Autodesk Fusion (.scr) al final\n\n-mp <number_of_passes>\nDefineix el nombre màxim de passades d'encaminament automàtic a realitzar\n\n-l <language>\nen" per a anglès, "de" per a alemany o "zh" per a xinès simplificat; altrament, s'utilitza el valor per defecte del sistema. L'anglès s'utilitza per defecte per als idiomes no suportats.\n\n-mt <nombre_de_fils>\nEstableix la mida del grup de fils per a l'optimització de l'encaminament.\nPer defecte és un menys que el nombre de processadors lògics del sistema.\n\n-is <estratègia_de_selecció>\nSequential o prioritized. Estableix l'estratègia de selecció d'elements\nper a l'optimització de l'encaminament. Per defecte és sequential.\n\n-h Mostra aquesta ajuda
