command_line_help=PENGGUNAAN\n\nfreerouting [PARAMETER]\n\nPARAMETER\n\n-de <design.dsn>\nMuat berkas DSN Specctra (.dsn)\n\n-di <direktori_desain>\nAtur folder bawaan yang digunakan oleh dialog buka desain\n\n-dr <berkas_aturan_desain>\nMembaca aturan perutean dari berkas .rules\n\n-do <output_file>\nMenyimpan papan (.dsn), sesi (.ses), atau\nskrip Autodesk Fusion (.scr) di akhir\n\n-mp <number_of_passes>\nMengeset jumlah maksimum lintasan rute secara otomatis yang dilakukan\n\n-l <language>\nen" untuk bahasa Inggris, "de" untuk bahasa Jerman, atau "zh" untuk bahasa Tionghoa Sederhana; jika tidak, gunakan bawaan sistem. Bahasa Inggris digunakan secara bawaan untuk bahasa yang tidak didukung.\n\n-mt <jumlah_utas>\nAtur ukuran thread-pool untuk optimasi rute. Default-nya adalah\nsatu lebih sedikit dari jumlah prosesor logis di sistem.\n\n-is <strategi_pemilihan>\nSekuensial atau diprioritaskan. Atur strategi pemilihan item untuk\noptimasi rute. Default-nya adalah sekuensial.\n\n-h Tampilkan bantuan ini
