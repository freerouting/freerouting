command_line_help=PENGGUNAAN\n\nfreerouting [PARAMETER]\n\nPARAMETER\n\n-de <desain.dsn>\nMemuat file Specctra .dsn\n\n-di <direktori_desain>\nMenetapkan folder default untuk dialog buka desain\n\n-dr <file_aturan_desain>\nMembaca aturan routing dari file .rules\n\n-do <output_file>\nMenyimpan papan (.dsn), sesi (.ses) atau\nskrip sesi Eagle (.scr) di akhir\n\n-mp <number_of_passes>\nMengatur batas atas jumlah tahapan routing otomatis\nyang akan dijalankan\n\n-l <language>\nen" untuk Bahasa Inggris, "de" untuk Bahasa Jerman, "zh" untuk Bahasa Mandarin Sederhana, jika tidak maka akan menggunakan bawaan sistem. Bahasa Inggris ditetapkan secara default untuk bahasa yang tidak didukung.\n\n-mt <jumlah_thread>\nMenganut ukuran pool thread untuk optimasi rute. Nilai defaultnya adalah\nsatu lebih sedikit dari jumlah prosesor logis di sistem.\n\n-us <strategi_pembaruan>\nGreedy, Global, Hybrid. Mengatur strategi pembaruan papan untuk optimasi\nrute. Nilai defaultnya adalah greedy. Jika hybrid dipilih,\nopsi lain "hr" menentukan rasio hybrid.\n\n-hr <m\:n>\nSets hybrid ratio in the format of\n\#_global_optimal_passes\:\#_prioritized_passes.\nThe default is 1\:1. It's only effective when hybrid strategy\nis selected.\n\n-is <selection_strategy>\nSequential, random, or prioritized. Sets item selection strategy\nfor route optimization\: sequential, random, prioritized. The\nbawaannya adalah diutamakan. Strategi diutamakan memilih item berdasarkan\nskor yang dihitung pada putaran sebelumnya.\n\n-h Menampilkan bantuan ini\n
