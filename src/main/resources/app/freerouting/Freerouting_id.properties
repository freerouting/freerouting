command_line_help=PENGGUNAAN\n\nfreerouting [PARAMETER]\n\nPARAMETER\n\n-de <desain.dsn>\nMuat berkas Specctra .dsn\n\n-di <direktori_desain>\nAtur folder bawaan yang digunakan oleh dialog buka-desain\n\n-dr <design_rules_file>\nBaca aturan perutean dari berkas .rules\n\n-do <output_file>\nSimpan papan (.dsn), sesi (.ses), atau\nskrip Autodesk Fusion (.scr) di akhir\n\n-mp <jumlah_lintasan>\nAtur jumlah maksimum lintasan perutean otomatis yang akan dilakukan\n\n-l <bahasa>\nen" untuk bahasa Inggris, "de" untuk bahasa Jerman, atau "zh" untuk bahasa Mandarin Sederhana; jika tidak, gunakan bawaan sistem. Bahasa Inggris digunakan secara bawaan untuk bahasa yang tidak didukung.\n\n-mt <jumlah_thread>\nAtur ukuran thread pool untuk optimasi perutean. Nilai bawaannya adalah\nsatu lebih sedikit dari jumlah prosesor logis dalam sistem.\n\n-us <updating_strategy>\nGreedy, Global, atau Hybrid. Tetapkan strategi pembaruan papan untuk rute\noptimasi. Nilai bawaannya adalah greedy. Ketika Hybrid dipilih,\ngunakan opsi "hr" untuk menentukan rasio hibrida.\n\n-hr <m\:n>\nAtur rasio hibrida dalam format\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nDefaultnya adalah 1\:1. Opsi ini hanya efektif jika\nStrategi hibrida dipilih.\n\n-is <strategi_pemilihan>\nBerurutan, acak, atau diprioritaskan. Atur strategi pemilihan item\nuntuk optimasi perutean. Defaultnya adalah terprioritas, yang memilih\nitem berdasarkan skor yang dihitung selama putaran sebelumnya.\n\n-h Tampilkan bantuan ini
