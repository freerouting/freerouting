command_line_help=GEBRUIK\n\nfreerouting [PARAMETERS]\n\nPARAMETERS\n\n-de <ontwerp.dsn>\nLaadt het Specctra .dsn-bestand\n\n-di <ontwerp_map>\nStelt de standaardmap in voor de vensters voor het openen van een ontwerp\n\n-dr <ontwerpregels_bestand>\nLeest routingregels uit een .rules-bestand\n\n-do <output_file>\nSlaat de printcontour (.dsn), de sessie (.ses) of\nhet Eagle-sessiescript (.scr) aan het einde op\n\n-mp <number_of_passes>\nStelt de bovengrens in voor het aantal autorouter-passes\ndat wordt uitgevoerd\n\n-l <language>\nen" voor Engels, "de" voor Duits, "zh" voor Vereenvoudigd Chinees, anders wordt de systeemstandaard gebruikt. Engels wordt standaard ingesteld voor niet-ondersteunde talen.\n\n-mt <number_of_threads>\nStelt de grootte van de threadpool in voor route-optimalisatie. De standaardwaarde is\néén minder dan het aantal logische processoren in het systeem.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Stelt de bijwerkstrategie van de printcontour in voor route-\noptimalisatie. De standaardwaarde is greedy. Wanneer hybrid is geselecteerd,\nbepaalt een andere optie "hr" de hybride verhouding.\n\n-hr <m\:n>\nInstalleert de hybride verhouding in het formaat van\n\#_globale_optimale_passes\:\#_geprioriteerde_passes.\nDe standaardwaarde is 1\:1. Dit is alleen effectief wanneer hybride strategie\nis geselecteerd.\n\n-is <selectie_strategie>\nSequential, random, of prioritized. Stelt de itemselectiestrategie in\nvoor route-optimalisatie\: sequential, random, prioritized. De\nstandaard is prioritized. Prioritized-strategie selecteert items op basis\nvan scores berekend in de vorige ronde.\n\n-h Toont deze hulp\n
