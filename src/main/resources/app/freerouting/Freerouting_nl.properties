command_line_help=GEBRUIK\n\nfreerouting [PARAMETERS]\n\nPARAMETERS\n\n-de <design.dsn>\nHet Specctra .dsn-bestand laden\n\n-di <design_directory>\nDe Standaardmap instellen die wordt gebruikt door vensters voor het openen van een ontwerp\n\n-dr <design_rules_file>\nLees routeringsregels uit een .rules-bestand\n\n-do <output_file>\nSla het printplaat- (.dsn), sessie- (.ses) of\nAutodesk Fusion-script (.scr) aan het einde op\n\n-mp <number_of_passes>\nStel het maximale aantal doorgangen voor automatisch routeren in\n\n-l <language>\n"en" voor Engels, "de" voor Duits of "zh" voor Vereenvoudigd Chinees; gebruik anders de systeemstandaard. Engels is de standaard voor niet-ondersteunde talen.\n\n-mt <number_of_threads>\nStel de grootte van de threadpool in voor route-optimalisatie. Standaard is dit\néén minder dan het aantal logische processoren in het systeem.\n\n-is <selection_strategy>\nSequentieel of geprioriteerd. Stel de itemselectiestrategie in voor\nroute-optimalisatie. Standaard is sequentieel.\n\n-h Toon deze hulp
