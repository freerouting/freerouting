command_line_help=GEBRUIK\n\nfreerouting [PARAMETERS]\n\nPARAMETERS\n\n-de <design.dsn>\nHet Specctra .dsn-bestand laden\n\n-di <ontwerp_map>\nStel de standaardmap in die wordt gebruikt door dialogen voor het openen van een ontwerp\n\n-dr <ontwerpregels_bestand>\nLees routeringsregels uit een .rules-bestand\n\n-do <output_file>\nSla de print (.dsn), sessie (.ses) of\nAutodesk Fusion-script (.scr) aan het einde\n\n-mp <aantal_doorgangen>\nStel het maximale aantal uit te voeren automatische routeringsdoorgangen in\n\n-l <taal>\nen" voor Engels, "de" voor Duits, of "zh" voor Vereenvoudigd Chinees; anders wordt de systeemstandaard gebruikt. Engels wordt standaard gebruikt voor niet-ondersteunde talen.\n\n-mt <aantal_threads>\nStel de grootte van de threadpool in voor routeoptimalisatie. De standaardwaarde is\néén minder dan het aantal logische processoren in het systeem.\n\n-us <updating_strategy>\nGreedy, Global of Hybrid. Stel de strategie voor het bijwerken van de printplaat in voor het routeren\noptimalisatie. De standaard is greedy. Wanneer Hybrid is geselecteerd,\ngebruik de optie "hr" om de hybride verhouding op te geven.\n\n-hr <m\:n>\nStel de hybride verhouding in met de indeling van\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\n```json { "37": " De standaardwaarde is 1\:1. Deze optie is alleen van kracht wanneer de" } ```\nHybride strategie is geselecteerd.\n\n-is <selection_strategy>\nOpeenvolgend, willekeurig of op prioriteit. Stel de strategie in voor het selecteren van items\nvoor route-optimalisatie. De standaardwaarde is 'prioritized', wat kiest\nitems based on scores calculated during the previous round.\n\n-h Toon deze hulp
