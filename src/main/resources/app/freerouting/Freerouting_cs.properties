command_line_help=POUŽITÍ\n\nfreerouting [PARAMETRY]\n\nPARAMETRY\n\n-de <design.dsn>\nNačíst soubor DSN Specctra (.dsn)\n\n-di <design_directory>\nNastavit výchozí složku používanou v dialozích pro otevření návrhu\n\n-dr <design_rules_file>\nNačíst pravidla směrování ze souboru .rules\n\n-do <vystupni_soubor>\nUložit desku (.dsn), relaci (.ses) nebo\nskript pro Autodesk Fusion (.scr) na konci\n\n-mp <pocet_pruchodu>\nNastavit maximální počet průchodů automatického směrování\n\n-l <jazyk>\nen" pro angličtinu, "de" pro němčinu nebo "zh" pro zjednodušenou čínštinu; jinak se použije výchozí nastavení systému. Pro nepodporované jazyky se výchozí použije angličtina.\n\n-mt <počet_vláken>\nNastaví velikost fondu vláken pro optimalizaci směrování. Výchozí hodnota je\no jedno méně než počet logických procesorů v systému.\n\n-is <strategie_výběru>\nSequential nebo prioritized. Nastaví strategii výběru prvků pro\noptimalizaci směrování. Výchozí je sequential.\n\n-h Zobrazí tuto nápovědu
