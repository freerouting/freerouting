command_line_help=POUŽITÍ\n\nfreerouting [PARAMETRY]\n\nPARAMETRY\n\n-de <design.dsn>\nNačíst soubor Specctra .dsn\n\n-di <adresar_navrhu>\nNastavit výchozí složku používanou v dialozích pro otevření návrhu\n\n-dr <design_rules_file>\nNačte pravidla směrování ze souboru pravidel .rules\n\n-do <output_file>\nUložit desku (.dsn), relaci (.ses) nebo\nskript pro Autodesk Fusion (.scr) na konci\n\n-mp <počet_průchodů>\nNastaví maximální počet průchodů automatického směrování, které se mají provést\n\n-l <language>\nen" pro angličtinu, "de" pro němčinu nebo "zh" pro zjednodušenou čínštinu; jinak se použije výchozí nastavení systému. Pro nepodporované jazyky se jako výchozí použije angličtina.\n\n-mt <počet_vláken>\nNastaví velikost fondu vláken pro optimalizaci směrování. Výchozí hodnota je\no jedno méně než počet logických procesorů v systému.\n\n-us <updating_strategy>\nGreedy, Global, or Hybrid. Nastavte strategii aktualizace desky pro směrování\noptimalizaci. Výchozí hodnota je greedy. Při výběru možnosti Hybrid\npomocí volby "hr" zadejte hybridní poměr.\n\n-hr <m\:n>\nNastavte hybridní poměr ve formátu\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nVýchozí hodnota je 1\:1. Tato volba je účinná pouze tehdy, když je\nJe vybrána hybridní strategie.\n\n-is <selection_strategy>\nSequential, random nebo prioritized. Nastavte strategii výběru položek\npro optimalizaci směrování. Výchozí hodnota je prioritizovaná, která vybírá\nprvků na základě skóre vypočtených během předchozího kola.\n\n-h Zobrazí tuto nápovědu
