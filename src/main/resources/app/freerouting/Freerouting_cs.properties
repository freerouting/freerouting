command_line_help=POUŽITÍ\n\nfreerouting [PARAMETRY]\n\nPARAMETRY\n\n-de <návrh.dsn>\nNačte soubor DSN Specctra\n\n-di <složka_návrhu>\nNastaví výchozí složku pro dialogová okna otevření návrhu\n\n-dr <soubor_pravidel_návrhu>\nNačte pravidla routování ze souboru .rules\n\n-do <vystupni_soubor>\nNa konci uloží desku (.dsn), relaci (.ses) nebo\nskript relace pro Eagle (.scr)\n\n-mp <pocet_pruchodu>\nNastaví horní limit počtu průchodů autorouteru,\nkteré budou provedeny\n\n-l <jazyk>\nen" pro angličtinu, "de" pro němčinu, "zh" pro zjednodušenou čínštinu, jinak se použije výchozí nastavení systému. Pro nepodporované jazyky je výchozí angličtina.\n\n-mt <počet_vláken>\nNastaví velikost fondu vláken pro optimalizaci trasy. Výchozí hodnota je\no jedno méně, než je počet logických procesorů v systému.\n\n-us <strategie_aktualizace>\nGreedy, Global, Hybrid. Nastaví strategii aktualizace desky pro optimalizaci\ntrasy. Výchozí je greedy. Pokud je vybráno hybrid,\ndalší volba "hr" určuje poměr hybridní strategie.\n\n-hr <m\:n>\nNastaví hybridní poměr ve formátu\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nVýchozí hodnota je 1\:1. Použije se pouze při hybridní strategii\nje vybrán.\n\n-is <selection_strategy>\nSekvenční, náhodný nebo prioritizovaný. Nastavuje strategii výběru prvků\n```json { "43": " pro optimalizaci trasing\: sekvenční, náhodné, prioritizované. " } ```\nvýchozí možnost je prioritizovaná. Prioritizovaná strategie vybírá položky na základě\nskóre vypočítaného v předchozím kole.\n\n-h Zobrazí tuto nápovědu\n
