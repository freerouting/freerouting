command_line_help=ИСПОЛЬЗОВАНИЕ\n\nfreerouting [ПАРАМЕТРЫ]\n\nПАРАМЕТРЫ\n\n-de <design.dsn>\nЗагрузить DSN-файл Specctra\n\n-di <design_directory>\nЗадать папку по умолчанию для диалогов открытия проекта\n\n-dr <файл_правил_проектирования>\nСчитывание правил трассировки из файла .rules\n\n-do <output_file>\nСохранить плату (.dsn), сессию (.ses) или\nскрипт Autodesk Fusion (.scr) в конце\n\n-mp <количество_проходов>\nЗадать максимальное количество проходов автотрассировки\n\n-l <язык>\nen" — английский, "de" — немецкий или "zh" — упрощенный китайский; иначе используется язык системы по умолчанию. Для неподдерживаемых языков по умолчанию используется английский.\n\n-mt <число_потоков>\nЗадать размер пула потоков для оптимизации трассировки. Значение по умолчанию:\nна один меньше количества логических процессоров в системе.\n\n-us <updating_strategy>\nGreedy, Global или Hybrid. Задаёт стратегию обновления платы для трассировки\nоптимизации. Значение по умолчанию — Жадный (greedy). Если выбран Гибридный (Hybrid),\nиспользуйте параметр "hr" для указания гибридного соотношения.\n\n-hr <m\:n>\nЗадайте гибридный коэффициент в формате\n\#_global_optimal_passes\:\#_prioritized_passes.\n```json { "37": " Значение по умолчанию — 1\:1. Эта опция работает только при" } ```\nВыбрана гибридная стратегия.\n\n-is <selection_strategy>\nSequential, random, or prioritized. Set the item-selection strategy\nдля оптимизации трассировки. По умолчанию используется prioritized, который выбирает\nэлементов на основе оценки, рассчитанной во время предыдущего прохода.\n\n-h Отобразить эту справку
