command_line_help=ИСПОЛЬЗОВАНИЕ\n\nfreerouting [ПАРАМЕТРЫ]\n\nПАРАМЕТРЫ\n\n-de <design.dsn>\nЗагружает файл .dsn формата Specctra\n\n-di <design_directory>\nЗадает папку по умолчанию для диалогов открытия проекта\n\n-dr <design_rules_file>\nСчитывает правила трассировки из файла .rules\n\n-do <output_file>\nСохраняет плату (.dsn), сессию (.ses) или\nскрипт сессии Eagle (.scr) в конце работы\n\n-mp <number_of_passes>\nЗадает верхнее ограничение на количество проходов автотрассировщика,\nкоторые будут выполнены\n\n-l <language>\n«en» — английский, «de» — немецкий, «zh» — упрощенный китайский, иначе используется системный язык по умолчанию. Для неподдерживаемых языков по умолчанию устанавливается английский.\n\n-mt <number_of_threads>\nЗадает размер пула потоков для оптимизации трассировки. По умолчанию используется\nна один поток меньше, чем количество логических процессоров в системе.\n\n-us <updating_strategy>\nGreedy, Global, Hybrid. Задает стратегию обновления платы для оптимизации\nтрассировки. По умолчанию — greedy. Если выбрана стратегия hybrid,\nдругой параметр «hr» задает соотношение гибридного режима.\n\n-hr <m\:n>\nУстанавливает гибридное соотношение в формате\n```json { "37": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nЗначение по умолчанию — 1\:1. Работает только при гибридной стратегии\nвыбрана.\n\n-is <selection_strategy>\nПоследовательный, случайный или приоритетный. Задаёт стратегию выбора элементов\nдля оптимизации трассировки\: последовательно, случайно, по приоритетам.\nзначение по умолчанию — prioritized. Стратегия prioritized выбирает элементы\nна основе баллов, рассчитанных в предыдущем раунде.\n\n-h Показывает эту справку\n
