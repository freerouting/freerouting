command_line_help=ИСПОЛЬЗОВАНИЕ\n\nfreerouting [ПАРАМЕТРЫ]\n\nПАРАМЕТРЫ\n\n-de <design.dsn>\nЗагрузить файл Specctra .dsn\n\n-di <design_directory>\nЗадать папку по умолчанию для диалогов открытия проекта\n\n-dr <design_rules_file>\nЧтение правил трассировки из файла .rules\n\n-do <output_file>\nСохранить плату (.dsn), сессию (.ses) или\nскрипт Autodesk Fusion (.scr) в конце\n\n-mp <number_of_passes>\nЗадать максимальное количество проходов автотрассировки\n\n-l <language>\nen" для английского, "de" для немецкого или "zh" для упрощённого китайского; иначе используется системный язык по умолчанию. Для неподдерживаемых языков по умолчанию используется английский.\n\n-mt <number_of_threads>\nЗадает размер пула потоков для оптимизации трассировки. По умолчанию\nиспользуется на один поток меньше, чем количество логических процессоров в системе.\n\n-is <selection_strategy>\nSequential (последовательный) или Prioritized (по приоритету). Задает стратегию выбора объектов для\nоптимизации трассировки. По умолчанию используется sequential.\n\n-h Отобразить эту справку
