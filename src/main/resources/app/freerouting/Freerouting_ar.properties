command_line_help=الاستخدام\n\nfreerouting [المعلمات]\n\nالمعلمات\n\n-de <design.dsn>\nيحمّل ملف Specctra .dsn\n\n-di <design_directory>\nيحدد المجلد الافتراضي لمربعات حوار فتح التصميم\n\n-dr <design_rules_file>\nيقرا قواعد التوجيه من ملف ‎.rules‎\n\n-do <output_file>\nيحفظ اللوحة (‎.dsn‎)، الجلسة (‎.ses‎) أو\nسكربت جلسة Eagle‏ (‎.scr‎) في النهاية\n\n-mp <number_of_passes>\nيحدد الحد الأقصى لعدد دورات المُوجّه التلقائي\nالتي سيتم تنفيذها\n\n-l <language>\nen" للغة الإنجليزية، و "de" للألمانية، و "zh" للصينية المبسطة، وإلا فسيتم استخدام اللغة الافتراضية للنظام. تم ضبط اللغة الإنجليزية كافتراضية للغات غير المدعومة.\n\n-mt <number_of_threads>\nيحدد حجم مجمّع الخيوط (thread pool) لتحسين المسار. القيمة الافتراضية هي\nأقل بواحد من عدد المعالجات المنطقية في النظام.\n\n-us <updating_strategy>\nGreedy، Global، Hybrid. يحدد استراتيجية تحديث اللوحة لتحسين\nالمسار. القيمة الافتراضية هي greedy. عند تحديد hybrid،\nيحدد خيار آخر "hr" نسبة الهجين (hybrid ratio).\n\n-hr <m\:n>\nيحدد نسبة الهجين بتنسيق\nعدد_تمريرات_التحسين_العالمي\:عدد_التمريرات_ذات_الأولوية.\nالافتراضي هو 1\:1. يكون فعالاً فقط عند اختيار\nاستراتيجية الهجين.\n\n-is <selection_strategy>\nSequential، أو random، أو prioritized. يحدد استراتيجية اختيار العناصر\nلتحسين التوجيه\: sequential، أو random، أو prioritized.\nالافتراضي هو ذو الأولوية. تختار الاستراتيجية ذات الأولوية العناصر بناءً\nعلى الدرجات المحسوبة في الجولة السابقة.\n\n-h يُظهر تعليمات المساعدة هذه\n
