command_line_help=الاستخدام\n\nfreerouting [المعاملات]\n\nالمعلمات\n\n-de <design.dsn>\nتحميل ملف DSN الخاص بـ Specctra\n\n-di <design_directory>\nتعيين المجلد الافتراضي المستخدم في مربعات حوار فتح التصميم\n\n-dr <design_rules_file>\nقراءة قواعد التوجيه من ملف قواعد .rules\n\n-do <output_file>\nحفظ اللوحة (.dsn)، أو الجلسة (.ses)، أو\nAutodesk Fusion (.scr) في النهاية\n\n-mp <عدد_التمريرات>\nتعيين الحد الأقصى لعدد تمريرات التوجيه التلقائي المراد تنفيذها\n\n-l <language>\nen" للإنجليزية، "de" للألمانية، أو "zh" للصينية المبسطة؛ وإلا، فسيُستخدم الإعداد الافتراضي للنظام. تُستخدم الإنجليزية افتراضيًا للغات غير المدعومة.\n\n-mt <number_of_threads>\nتعيين حجم تجمع سلاسل العمليات (thread-pool) لتحسين التوجيه. القيمة الافتراضية هي\nأقل بواحد من عدد المعالجات المنطقية في النظام.\n\n-us <updating_strategy>\nGreedy أو Global أو Hybrid. يحدد استراتيجية تحديث اللوحة أثناء التوجيه\nالتحسين. القيمة الافتراضية هي greedy. عند تحديد Hybrid،\nاستخدم الخيار "hr" لتحديد النسبة الهجينة.\n\n-hr <m\:n>\nتعيين النسبة الهجينة بالصيغة\n```json { "36": " \#_global_optimal_passes\:\#_prioritized_passes." } ```\nالقيمة الافتراضية هي 1\:1. لا يسري هذا الخيار إلا عندما يكون\nيتم تحديد الاستراتيجية الهجينة.\n\n-is <selection_strategy>\nSequential أو random أو prioritized. تعيين استراتيجية تحديد العناصر\nلتحسين التوجيه. الافتراضي هو prioritized، والذي يحدد\nالعناصر بناءً على الدرجات المحسوبة خلال الجولة السابقة.\n\n-h عرض رسالة المساعدة هذه
