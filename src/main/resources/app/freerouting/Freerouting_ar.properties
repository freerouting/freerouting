command_line_help=الاستخدام\n\nfreerouting [الوسائط]\n\nالمعلمات\n\n-de <design.dsn>\nتحميل ملف Specctra ‎.dsn\n\n-di <دليل_التصميم>\nتعيين المجلد الافتراضي المستخدم بواسطة حوارات فتح التصميم\n\n-dr <design_rules_file>\nقراءة قواعد التوجيه من ملف .rules\n\n-do <output_file>\nحفظ اللوحة (.dsn) أو الجلسة (.ses) أو\nنص Autodesk Fusion البرمجي (‎.scr) في النهاية\n\n-mp <number_of_passes>\nتحديد الحد الأقصى لعدد تمريرات التوجيه التلقائي المراد تنفيذها\n\n-l <اللغة>\n"en" للإنكليزية، أو "de" للألمانية، أو "zh" للصينية المبسطة؛ وبخلاف ذلك، يُستخدم الإعداد الافتراضي للنظام. تُستخدم الإنكليزية افتراضيًا للغات غير المدعومة.\n\n-mt <number_of_threads>\nتعيين حجم مجمع الخيوط (thread-pool) لتحسين التوجيه. الافتراضي هو\nأقل بواحد من عدد المعالجات المنطقية في النظام.\n\n-is <selection_strategy>\nمتسلسل أو حسب الأولوية. حدد استراتيجية تحديد العناصر لـ\nتحسين التوجيه. الافتراضي هو التسلسلي.\n\n-h عرض مساعدة الاستخدام هذه
